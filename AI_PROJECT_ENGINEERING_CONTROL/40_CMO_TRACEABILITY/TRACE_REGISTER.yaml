schema_version: "0.9"
updated_at: "2026-09-20"
owner: "CMO"
purpose: "维护需求→方案→变更→代码→验证→基线的可追溯关系；只保存引用、状态和证据，不复制正文。"

id_model:
  trace: "TRACE-<DOMAIN>-NNN"
  requirement: "REQ-<DOMAIN>-NNN"
  solution: "SOL-<DOMAIN>-NNN"
  change: "CHG-<DOMAIN>-NNN"
  verification: "VER-<DOMAIN>-NNN"

statuses:
  - PLANNED
  - SOLUTION_DEFINED
  - IMPLEMENTED
  - VALIDATION_BLOCKED
  - VERIFIED
  - BASELINED
  - SUPERSEDED

rules:
  no_content_duplication: true
  code_change_requires_trace_id: true
  read_only_task_requires_trace_id: false
  verified_requires_test_evidence: true
  baselined_requires_verified: true

