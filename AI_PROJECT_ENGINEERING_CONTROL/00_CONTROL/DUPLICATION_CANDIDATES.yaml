schema_version: "0.3"
updated_at: "2026-09-20"
policy: "候选项不是重复代码定论；必须经项目确认或进一步代码级比较后才能重构。"

candidates:
  - candidate_id: DUP-001_CONFIG_LOADING
    category: CONFIGURATION
    paths:
      - "common/config_loader.py"
      - "quality_knowledge/config_loader.py"
    observation: "存在两个 YAML 配置加载入口；前者为通用缓存加载器，后者包含质量业务字段映射逻辑。"
    risk: "后续继续新增第三套加载逻辑会扩大配置口径分裂。"
    duplication_probability: MEDIUM
    recommended_action: "明确 generic loader 与 domain config adapter 的职责边界；优先复用 common.ConfigLoader，不直接合并业务逻辑。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-002_PARALLEL_EXECUTION
    category: ORCHESTRATION
    paths:
      - "builder/parallel_execution.py"
      - "quality_knowledge/scenario_generation.py"
      - "quality_knowledge/services/v2_batch_job_service.py"
    observation: "至少三处承担线程池/并发调度职责。"
    risk: "并发数、异常处理、重试、任务状态与资源控制可能逐步分叉。"
    duplication_probability: HIGH
    recommended_action: "作为 AI_ORCHESTRATOR 首批收敛对象；保留业务策略，统一执行引擎。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-003_RESPONSE_NORMALIZER
    category: AI_RESPONSE
    paths:
      - "quality_knowledge/response_normalizer.py"
      - "quality_knowledge/response_normalizer_v2.py"
    observation: "V1 与 V2 正规化逻辑并存；V2 基于 analysis_v2 DTO。"
    risk: "长期并存可能导致字段口径、异常策略和版本迁移不一致。"
    duplication_probability: MEDIUM
    recommended_action: "先定义版本生命周期与兼容边界，不直接删除 V1。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-004_ANALYSIS_SERVICE_VERSIONS
    category: APPLICATION_SERVICE
    paths:
      - "quality_knowledge/services/analysis_service.py"
      - "quality_knowledge/services/v1_analysis_service.py"
      - "quality_knowledge/services/v2_analysis_service.py"
    observation: "基础分析服务、V1、V2 同时存在。"
    risk: "调用方若未明确版本，容易形成隐式分流。"
    duplication_probability: MEDIUM
    recommended_action: "补服务版本路由和 deprecation 状态；禁止新增未标版本的第四套分析服务。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-005_PARSER_NAMESPACE
    category: PARSING
    paths:
      - "parser/**"
      - "parsing/**"
    observation: "两个高相似命名包并存；当前抽样显示 parser 偏输入证据解析，parsing 偏 AI JSON 输出提取/修复。"
    risk: "新开发者容易放错模块并产生重复工具。"
    duplication_probability: LOW
    recommended_action: "保留实现，补职责说明；后续可改名为 input_parser / ai_output_parser。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-006_REPOSITORY_NAMESPACES
    category: DATA_ACCESS
    paths:
      - "repositories/json_repository.py"
      - "quality_knowledge/repositories/**"
    observation: "根级通用 JSON Artifact Repository 与质量域 SQLite Repository 并存。"
    risk: "目前职责不同，但名称层级不清会导致错误复用。"
    duplication_probability: LOW
    recommended_action: "文档明确 generic artifact store 与 domain repository，不做强制合并。"
    status: PENDING_CONFIRMATION

  - candidate_id: DUP-007_PACKAGING
    category: RELEASE
    paths:
      - "scripts/build_baseline_package.py"
      - "scripts/build_upgrade_package.py"
      - "scripts/build_req022_package.py"
    observation: "存在多个独立打包入口。"
    risk: "敏感文件排除、sources/规则、Manifest字段与基线元数据可能重复维护。"
    duplication_probability: HIGH
    recommended_action: "抽取统一 packaging policy / manifest builder，各项目仅保留差异化 profile。"
    status: PENDING_CONFIRMATION
