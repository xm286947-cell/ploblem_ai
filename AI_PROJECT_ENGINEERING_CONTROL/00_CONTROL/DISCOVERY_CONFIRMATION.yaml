      - "补充遗漏的专属文件"
      - "指出哪些路径实际属于共享层"

  - item_id: DISC-002
    subject: MAJOR_CASE_DOMAIN
    project_id: MAJOR_PROBLEM_AGENT
    discovery_source: [GIT_DELTA_SCAN, IMPORT_SCAN]
    confidence: HIGH
    confirmation_status: PENDING_CONFIRMATION
    project_action:
