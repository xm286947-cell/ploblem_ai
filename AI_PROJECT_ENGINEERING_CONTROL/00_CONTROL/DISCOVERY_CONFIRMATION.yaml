  project_input_mode: CONFIRM_AND_SUPPLEMENT
  rule: "控制面统一扫描首版；各项目不从零填写，只确认归属、补漏、说明有意设计的共享关系。"

status_model:
  - AUTO_DISCOVERED
  - PENDING_CONFIRMATION
