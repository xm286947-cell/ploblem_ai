schema_version: "0.9"
template_id: PROJECT_EXECUTION_RECORD
instruction: "每个阶段只维护一条简洁记录，不作为工作日志。"

project_id: ""
traceability:
  trace_id: ""
  requirement_ref: ""
  solution_ref: ""
  rule: "存在代码/契约变更时必须填写；只读任务可留空。"

baseline:
  branch: ""
  commit: ""

target:
  objective: ""
  acceptance: []
  out_of_scope: []

preflight:
  status: "NOT_RUN | PASS | BLOCKED"
  runtime:
    command: ""
    result: ""
  dependencies:
    command: ""
    result: ""
  test_framework:
    command: ""
    result: ""
  circuit_breaker: ""
  rule: "Preflight 未 PASS 时不得进入代码修改。"

plan:
  steps: []
  shared_modules_touched: []

effective_evidence:
  - evidence_id: ""
    type: "TEST | E2E | AUDIT | SCAN | METRIC | MANIFEST | ENVIRONMENT"
    result: ""
    source: ""
    reusable: true

reusable_decisions:
  - decision_id: ""
    conclusion: ""
    applies_to: []
    invalidation: []

result:
  status: "PLANNED | IN_PROGRESS | COMPLETED | FAILED | PARTIAL | VALIDATION_BLOCKED"
  changed_files: []
  change_id: ""
  verification_id: ""
  next_action: ""

archive_rule:
  keep_only:
    - "影响后续决策的证据"
    - "可复用结论"
    - "基线与验证结果"
    - "会阻断后续执行的环境事实"
    - "CMO追溯链接"
  do_not_keep_by_default:
    - "完整调试日志"
    - "重复截图"
    - "无结论中间推理"
    - "可从Git重新生成的临时清单"
