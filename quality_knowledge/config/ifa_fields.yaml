version: "1.0"
business_type: "IFA"
status: "initial_from_design"

detection:
  issue_id_aliases:
    - "ITR单号"
    - "ITR 单号"
    - "ITR编号"
    - "ITR号"
  characteristic_fields:
    Bug标题: 6
    Bug所属业务组: 6
    问题描述: 8
    提炼测试场景: 6
    FA特性: 6
    历史同类问题: 5
    是否历史同类ITR问题: 5

identity:
  business_issue_id:
    required: true
    aliases:
      - "ITR单号"
      - "ITR 单号"
      - "ITR编号"
      - "ITR号"

issue_fact:
  title:
    aliases: ["Bug标题", "问题标题"]
  description:
    aliases: ["问题描述"]
  industry:
    aliases: ["行业"]
  customer:
    aliases: ["客户", "客户名称"]
  issue_type:
    aliases: ["问题类型"]
  severity:
    aliases: ["严重程度"]
  business_group:
    aliases: ["Bug所属业务组", "业务组"]
  impact:
    aliases: ["影响结果"]
  is_defect:
    aliases: ["是否为缺陷"]
  month:
    aliases: ["月份", "软件问题月份"]
  product:
    aliases: ["产品", "产品分类"]
  platform:
    aliases: ["平台", "所属平台"]
  module:
    aliases: ["模块"]

product_context:
  fa_feature:
    aliases: ["FA特性"]
  fa_l1_feature:
    aliases: ["FA一级特性"]
  feature_l1:
    aliases: ["一级特性"]
  feature_l2:
    aliases: ["二级特性"]
  feature_l3:
    aliases: ["三级特性"]
  feature_l4:
    aliases: ["四级特性"]

occurrence:
  original_reason:
    aliases: ["问题原因定位"]
  root_cause_evidence:
    aliases: ["根因分析"]
  cause_l1:
    aliases: ["一级分类"]
  cause_l2:
    aliases: ["二级分类"]
  cause_l3:
    aliases: ["三级分类"]
  cause_l4:
    aliases: ["四级分类"]

escape:
  is_escape:
    aliases: ["是否漏测"]
  escape_type:
    aliases: ["漏测类型"]
  original_reason:
    aliases: ["流出原因补充描述", "流出原因补充说明"]
  escape_l1:
    aliases: ["原因一级分类", "流出原因一级分类"]
  escape_l2:
    aliases: ["原因二级分类", "流出原因二级分类"]
  escape_l3:
    aliases: ["原因三级分类", "流出原因三级分类"]
  escape_l4:
    aliases: ["原因四级分类", "流出原因四级分类"]

solution:
  original_solution:
    aliases: ["问题解决方案"]
  corrective_action:
    aliases: ["纠正措施"]
  improvement_action:
    aliases: ["改进措施", "改进点"]

verification:
  extracted_test_scenario:
    aliases: ["提炼测试场景"]
  existing_case:
    aliases: ["是否已有用例"]
  mandatory_test:
    aliases: ["是否为必测项"]
  automated:
    aliases: ["是否已自动化"]

recurrence:
  historical_description:
    aliases: ["历史同类问题"]
  historical_repeat:
    aliases: ["是否历史同类ITR问题", "是否历史同类问题"]

extension:
  todo_note:
    aliases: ["待办&备注", "待办备注"]
  known_bug:
    aliases: ["是否已知BUG", "是否已知Bug"]
  known_bug_id:
    aliases: ["已知BUG单", "已知Bug单"]
  low_level_escape:
    aliases: ["是否低级漏测", "是否低级问题"]
  scenario_issue:
    aliases: ["是否场景问题"]
  scenario_research_coverable:
    aliases: ["是否可以通过场景调研覆盖"]
  fa_new_issue:
    aliases: ["FA新发现问题"]
