version: "1.0"
status: "initial"

header_scan:
  max_rows: 50
  scan_all_sheets: true
  min_detection_score: 20

header_normalization:
  strip: true
  remove_spaces: true
  remove_full_width_spaces: true
  remove_tabs: true
  remove_line_breaks: true
  normalize_brackets: true
  normalize_colon: true
  remove_field_hint:
    enabled: true
    # 仅用于匹配；Raw Header 必须保留原文
    patterns:
      - "（×*×）"
      - "(×*×)"
      - "【*】"

raw_policy:
  preserve_original_header: true
  preserve_raw_row_json: true
  preserve_unmapped_fields: true

detection:
  strategy: "weighted_fields"
  allow_detection_without_issue_id: true

import_behavior:
  business_key:
    - business_type
    - business_issue_id
  same_hash: "SKIPPED"
  changed_hash: "UPDATED"
  new_record: "NEW"
  row_failure: "FAILED"
  no_records_behavior: "NO_RECORDS_FOUND"
