version: "1.0"
business_type: "PLC"
status: "initial_real_data_enhanced"

detection:
  issue_id_aliases:
    - "ITR单号"
    - "ITR 单号"
    - "ITR编号"
    - "ITR号"
    - "TRC单号"
    - "TRC 单号"
    - "TRC编号"
    - "问题单号"
    - "问题编号"
  characteristic_fields:
    问题描述: 8
    问题原因定位: 8
    问题解决方案: 8
    是否漏测: 6
    管理改进措施: 6
    技术改进措施: 6
    开发改进措施: 6
    横向影响域: 4
    纵向影响域: 4
    是否已有用例: 4
    是否为必测项: 4
    是否已自动化: 4
    是否场景问题: 4

identity:
  business_issue_id:
    required: true
    aliases:
      - "ITR单号"
      - "ITR 单号"
      - "ITR编号"
      - "ITR号"
      - "TRC单号"
      - "TRC 单号"
      - "问题单号"
      - "问题编号"

issue_fact:
  month:
    aliases: ["月份", "软件问题月份"]
  title:
    aliases: ["Bug标题", "问题标题", "标题"]
  description:
    aliases: ["问题描述"]
  impact:
    aliases: ["影响结果", "变更影响"]
  severity:
    aliases: ["严重程度"]
  issue_type:
    aliases: ["问题类型"]
  industry:
    aliases: ["行业"]
  customer:
    aliases: ["客户", "客户名称"]
  department:
    aliases: ["所属部门", "责任部门"]
  business_group:
    aliases: ["Bug所属业务组", "业务组"]
  platform:
    aliases: ["所属平台", "平台"]
  product:
    aliases: ["产品", "产品分类"]
  product_series:
    aliases: ["产品系列"]
  module:
    aliases: ["模块", "所属模块"]

product_context:
  feature_l1:
    aliases: ["一级特性", "FA一级特性"]
  feature_l2:
    aliases: ["二级特性", "FA二级特性"]
  feature_l3:
    aliases: ["三级特性"]
  feature_l4:
    aliases: ["四级特性"]
  layer:
    aliases: ["归属分层", "层", "层级"]
  layer_category:
    aliases: ["层分类", "层分类（×如：IDE）"]
  fa_feature:
    aliases: ["FA特性"]

occurrence:
  original_reason:
    aliases:
      - "问题原因定位"
      - "问题原因定位（×开发填写×）"
  cause_l1:
    aliases: ["新一级分类", "一级分类"]
  cause_l2:
    aliases: ["新二级分类", "二级分类"]
  cause_l3:
    aliases: ["新三级分类", "三级分类"]
  cause_l4:
    aliases: ["新四级分类", "四级分类"]
  root_cause_evidence:
    aliases: ["根因分析"]

escape:
  is_escape:
    aliases: ["是否漏测"]
  escape_type:
    aliases: ["漏测类型"]
  original_reason:
    aliases:
      - "漏测根因补充说明"
      - "漏测根因补充描述"
      - "流出原因补充说明"
      - "流出原因补充描述"
  escape_l1:
    aliases: ["原因分类一级", "原因一级分类", "流出原因一级分类"]
  escape_l2:
    aliases: ["原因分类二级", "原因二级分类", "流出原因二级分类"]
  escape_l3:
    aliases: ["原因分类三级", "原因三级分类", "流出原因三级分类"]
  escape_l4:
    aliases: ["原因分类四级", "原因四级分类", "流出原因四级分类"]

solution:
  original_solution:
    aliases:
      - "问题解决方案"
      - "问题解决方案（×开发填写×）"
  corrective_action:
    aliases: ["纠正措施"]
  improvement_action:
    aliases: ["改进措施", "改进点"]
  dev_action:
    aliases: ["开发改进措施"]
  management_action:
    aliases: ["管理改进措施"]
  technical_action:
    aliases: ["技术改进措施"]

verification:
  existing_case:
    aliases: ["是否已有用例", "是否已有测试用例"]
  mandatory_test:
    aliases: ["是否为必测项", "是否必测"]
  automated:
    aliases: ["是否已自动化", "是否自动化"]
  mandatory_not_automated:
    aliases: ["必测项未自动化原因", "必测项未自动"]
  extracted_test_scenario:
    aliases: ["提炼测试场景"]

recurrence:
  is_common_issue:
    aliases:
      - "是否共性问题"
      - "是否共性问题（×开发填写×）"
  historical_repeat:
    aliases: ["是否历史同类问题", "是否历史同类ITR问题"]
  historical_description:
    aliases: ["历史同类问题"]

extension:
  change_introduced:
    aliases: ["是否变更引入"]
  change_reason:
    aliases:
      - "变更原因"
      - "变更原因（×除新需求自身问题外都属于变更×）"
  change_impact:
    aliases: ["变更影响", "变更影响点"]
  horizontal_scope:
    aliases:
      - "横向影响域"
      - "横向影响域（×横向侧重特性×）"
  vertical_scope:
    aliases:
      - "纵向影响域"
      - "纵向影响域（×纵向侧重产品和引入版本×）"
  is_scenario_issue:
    aliases: ["是否场景问题"]
  scenario_research_coverable:
    aliases: ["是否可以通过场景调研覆盖"]
  fst_needed:
    aliases: ["是否开展FST", "判断是否开展FST"]
  fst_improvement:
    aliases: ["FST改进措施"]
  fst_status:
    aliases: ["FST改进闭环状态"]
  source_id:
    aliases: ["SourceID"]
