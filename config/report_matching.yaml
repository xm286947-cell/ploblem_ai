version: "1.0"

matching:
  extensions: [".pdf", ".docx"]
  case_sensitive: false
  trim_whitespace: true
  normalize_full_width: true
  allow_extension_completion: false
  allow_stem_match: false
  allow_itr_fallback: false
  recursive: true

match_priority:
  - EXACT_FILENAME
  - NORMALIZED_FILENAME

multiple_match_policy: MARK_AMBIGUOUS
