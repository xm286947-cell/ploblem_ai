# Safe first-start bootstrap for Hardware Case.
# The loopback URL and model placeholder let the service validate its Runtime
# contract without contacting a provider. Configure an approved endpoint and
# model before running AI tasks. Keep credentials in an environment variable.

active_model: hardware_case_unconfigured

models:
  hardware_case_unconfigured:
    provider: openai_compatible
    base_url: http://127.0.0.1:9/v1
    model: REPLACE_WITH_COMPANY_APPROVED_MODEL
    temperature: 0
    max_tokens: 8192
    metadata:
      configuration_state: CONFIGURATION_REQUIRED
      startup_profile: NON_SECRET_LOOPBACK_BOOTSTRAP
