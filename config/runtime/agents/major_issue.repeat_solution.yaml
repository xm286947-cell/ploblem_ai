    max_provider_calls_per_step: 2
  model:
    temperature: 0
    max_tokens: 4096

metadata:
  business_domain: MAJOR_CASE
  analysis_stage: repeat_solution
  provider_response_shape: json_object
  what_how_boundary: RUNTIME_EXECUTION_ONLY
