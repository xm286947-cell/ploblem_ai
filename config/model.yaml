ai:
  enabled: true
  provider: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  api_key_env: acca
  model: dtcoder
  temperature: 0
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 2
  proxy_url: http://127.0.0.1:7897
  prompt_version: '1.0'
  mock_response_file: tests/samples/mock_ai_response.json
  stage_runtime:
    occurrence:
      timeout_seconds: 120
      max_retries: 1
      validation_retries: 1
      max_tokens: 2048
    escape:
      timeout_seconds: 120
      max_retries: 1
      validation_retries: 1
      max_tokens: 2048
    recurrence:
      timeout_seconds: 240
      max_retries: 2
      validation_retries: 1
      max_tokens: 2048
    capability_gap:
      timeout_seconds: 300
      max_retries: 2
      validation_retries: 1
      max_tokens: 4096
      max_items_per_dimension: 3

# 可配置多个质量分析智能体。未填写的参数继承上面的 ai 配置；密钥只引用环境变量。
quality_issue_agents:
  quality:
    label: 质量深度分析智能体
    enabled: true
    provider: openai_compatible
    model: dtcoder
  fast:
    label: 快速分析智能体
    enabled: true
    provider: openai_compatible
    model: dtcoder

# 页面选择“动态分配”时，系统按问题轮询分配智能体；同一问题的四阶段始终使用同一智能体。
embedding:
  enabled: false
  provider: local_hash
  base_url: ''
  api_key_env: REPEAT_CASE_API_KEY
  model: local-hash-v1
  dimensions: 256
  timeout_seconds: 120
  max_retries: 2
solution_ai:
  temperature: 0
  max_tokens: 4096
  timeout_seconds: 180
  max_retries: 2
  candidate_top_n: 3
  min_similarity_score: 0
repeat_decision_ai:
  enabled: false
  provider: openai_compatible
  model: ''
  prompt_version: M8.4-P1
  temperature: 0.1
  max_tokens: 2400
parallel_ai:
  enabled: true
  max_workers: 4
