name: Quality Scenario Windows Test Package

on:
  push:
    branches:
      - test/quality-scenario-windows-acceptance-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-acceptance-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Windows controlled acceptance smoke
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\run_quality_scenario_windows_acceptance.py --smoke-only --no-browser

      - name: Windows original DB copy smoke
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\run_quality_scenario_windows_acceptance.py --smoke-only --no-browser --source-db validation\windows_acceptance\quality_scenario_source_fixture.db

      - name: Windows startup failure diagnostics negative gate
        shell: pwsh
        run: |
          $broken = Join-Path $env:RUNNER_TEMP "broken_original_quality.db"
          [System.IO.File]::WriteAllText($broken, "THIS_IS_NOT_A_SQLITE_DB")
          $out = Join-Path $env:RUNNER_TEMP "start_stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "start_stderr.txt"
          $proc = Start-Process -FilePath ".\.venv\Scripts\python.exe" -ArgumentList @(
            "tools\run_quality_scenario_windows_acceptance.py",
            "--smoke-only",
            "--no-browser",
            "--source-db",
            $broken
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          $text = (Get-Content -Raw $out) + (Get-Content -Raw $err)
          if ($proc.ExitCode -eq 0) { throw "DIAGNOSTIC_GATE_UNEXPECTED_SUCCESS" }
          if ($text -notmatch "WINDOWS_ACCEPTANCE_START=FAIL") { throw "DIAGNOSTIC_GATE_MISSING_FAILURE" }
          if ($text -notmatch "APP_LOG_TAIL_BEGIN") { throw "DIAGNOSTIC_GATE_MISSING_APP_LOG" }
          if ($text -notmatch "APP_PROCESS_EXIT=") { throw "DIAGNOSTIC_GATE_MISSING_PROCESS_EXIT" }
          if ($text -notmatch "(?i)(not a database|databaseerror|sqlite3)") { throw "DIAGNOSTIC_GATE_MISSING_ROOT_CAUSE" }
          Write-Host "WINDOWS_STARTUP_FAILURE_DIAGNOSTICS=PASS"
          Write-Host "ROOT_CAUSE_VISIBLE=YES"
          Write-Host "APP_LOG_TAIL_VISIBLE=YES"

      - name: One-click source performance focused regression
        shell: pwsh
        run: |
          .\\.venv\\Scripts\\python.exe -m pytest -q tests\\test_software_assessment_qsv1_browser_flow.py tests\test_quality_scenario_mature_integration.py

      - name: Windows real Chromium G1-G5 browser golden
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check playwright
          .\.venv\Scripts\python.exe -m playwright install chromium
          .\.venv\Scripts\python.exe -m pytest -q tests\test_quality_scenario_mac_browser_golden.py

      - name: Build fresh-extract Windows test package
        id: package
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          $name = "QUALITY_SCENARIO_WINDOWS_TEST_PACKAGE_$short"
          $root = Join-Path $env:RUNNER_TEMP $name
          $archive = Join-Path $env:RUNNER_TEMP "source.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "$name.zip"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          git archive --format=zip --output="$archive" HEAD
          Expand-Archive -Path $archive -DestinationPath $root -Force

          $manifest = [ordered]@{
            task = "QUALITY_SCENARIO_WINDOWS_ACCEPTANCE_PACKAGE_001"
            result = "WINDOWS_TEST_CANDIDATE"
            source_sha = $env:GITHUB_SHA
            base_product_sha = "5d9538f189fb3ca6f056ea57ad0d666f6e6b9002"
            platform_focus = "Windows"
            launch_entry = "start_quality_scenario_windows_acceptance.bat"
            original_db_launch_entry = "start_quality_scenario_windows_original_db.bat"
            original_db_supported = $true
            original_db_write_policy = "COPY_FIRST_ORIGINAL_UNTOUCHED"
            original_db_fixture_injection = "NO"
            original_db_startup_wait_seconds = 300
            guide = "QUALITY_SCENARIO_WINDOWS_ACCEPTANCE.md"
            agent_timeout_seconds = 300
            provider_mode = "CONTROLLED_OPENAI_COMPATIBLE_MOCK"
            real_provider_semantic_gate = "OUT_OF_SCOPE"
            synthetic_business_data = "TEST_ONLY"
            direct_candidate_write = $false
            direct_publish_write = $false
            g1_real_provider_status = "CONDITIONAL_PASS_KEEP_FROM_MAC_GATE"
            g2_real_provider_status = "NOT_RESULTED"
            g3_g5_real_provider_status = "NOT_RUN"
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $root "TEST_RELEASE_MANIFEST.json")

          if (Test-Path $out) { Remove-Item -Force $out }
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $out -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$out.sha256"

          "PACKAGE_NAME=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PACKAGE_PATH=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PACKAGE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "WINDOWS_PACKAGE_BUILD=PASS"
          Write-Host "SOURCE_SHA=$env:GITHUB_SHA"
          Write-Host "PACKAGE_NAME=$name.zip"
          Write-Host "PACKAGE_SHA256=$hash"

      - name: Fresh Extract Windows BAT execution (fixture + original DB)
        shell: pwsh
        run: |
          $package = "${{ steps.package.outputs.PACKAGE_PATH }}"
          $fresh = Join-Path $env:RUNNER_TEMP "QS Windows Fresh Extract 中文"
          if (Test-Path $fresh) { Remove-Item -Recurse -Force $fresh }
          New-Item -ItemType Directory -Force -Path $fresh | Out-Null
          Expand-Archive -Path $package -DestinationPath $fresh -Force
          $env:QS_WINDOWS_ACCEPTANCE_SMOKE_ONLY = "1"
          $env:CI = "true"
          Push-Location $fresh
          try {
            $launcher = Join-Path $fresh "start_quality_scenario_windows_acceptance.bat"
            & cmd.exe /d /c ('call "' + $launcher + '"')
            if ($LASTEXITCODE -ne 0) { throw "FRESH_EXTRACT_FIXTURE_BAT_FAIL:$LASTEXITCODE" }
            Write-Host "FRESH_EXTRACT_FIXTURE_BAT=PASS"

            $fixture = Join-Path $fresh "validation\windows_acceptance\quality_scenario_source_fixture.db"
            if (!(Test-Path $fixture)) { throw "FRESH_FIXTURE_MISSING" }
            Copy-Item -Path $fixture -Destination (Join-Path $fresh "quality_issue_v1.db") -Force
            $originalLauncher = Join-Path $fresh "start_quality_scenario_windows_original_db.bat"
            & cmd.exe /d /c ('call "' + $originalLauncher + '"')
            if ($LASTEXITCODE -ne 0) { throw "FRESH_EXTRACT_ORIGINAL_DB_BAT_FAIL:$LASTEXITCODE" }
            Write-Host "FRESH_EXTRACT_ORIGINAL_DB_BAT=PASS"
          } finally {
            Pop-Location
          }

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: QUALITY_SCENARIO_WINDOWS_TEST_PACKAGE
          path: |
            ${{ steps.package.outputs.PACKAGE_PATH }}
            ${{ steps.package.outputs.PACKAGE_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
