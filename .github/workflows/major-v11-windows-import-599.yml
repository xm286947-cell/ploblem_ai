name: Major V1.1 Windows Import 599 Gate

on:
  push:
    branches:
      - fix/major-v11-windows-excel-progress-599
      - fix/major-v11-windows-refresh-recovery-605
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Pin frozen package identity
        shell: pwsh
        run: |
          Set-Content -Path PRODUCT_SOURCE_SHA -Value "55aaf9234ec102360043f4deef782126bc234b80" -NoNewline

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax and cache-busted UI
        shell: pwsh
        run: |
          node --check quality_knowledge/web/static/major_production.js
          $html = Get-Content quality_knowledge/web/templates/major_production.html -Raw
          if ($html -notmatch "data-major-excel-status") { throw "Excel near-form status missing" }
          if ($html -notmatch "data-major-source-status") { throw "Single-source near-form status missing" }
          if ($html -notmatch "major-refresh605-v1") { throw "Refresh recovery JS cache bust not active" }
          if ($html -notmatch "major-progress599-v1") { throw "Original C CSS cache bust missing" }
          Write-Host "MAJOR_UI_PROGRESS_STATIC_GATE=PASS"

      - name: Windows native launch, page contract, regression and provider gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "major-v11-server.out.log"
          $err = Join-Path $env:RUNNER_TEMP "major-v11-server.err.log"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/d","/c","call START_MAJOR_V11_WINDOWS.bat" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "CMD_PID=$($proc.Id)"
          try {
            $ok = $false
            for ($i = 0; $i -lt 180; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/p0/major-production" -TimeoutSec 5
                if ($r.StatusCode -eq 200) {
                  $ok = $true
                  Write-Host "MAJOR_UI_HTTP_200=PASS"
                  break
                }
              } catch {}
              if ($proc.HasExited) {
                Write-Host "LAUNCHER_EXITED_EARLY=$($proc.ExitCode)"
                break
              }
            }
            if (-not $ok) { throw "Major UI did not become HTTP 200" }

            $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/p0/major-production" -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "Unexpected status $($r.StatusCode)" }
            if ($r.Content -notmatch "Excel 批量导入") { throw "Major production page contract missing" }
            if ($r.Content -notmatch 'accept=".xls,.xlsx,.xlsm"') { throw "Legacy XLS picker missing" }
            Write-Host "WINDOWS_STANDARD_START=PASS"
            Write-Host "MAJOR_PRODUCTION_PAGE=PASS"

            $py = Join-Path $env:LOCALAPPDATA "MajorV11\venv\Scripts\python.exe"
            if (-not (Test-Path $py)) { throw "Launcher venv missing: $py" }
            & $py -m pytest -q tests/test_major_v5_overall_legacy_xls.py tests/test_major_canonical_intake_convergence.py tests/test_major_provider_wiring.py tests/test_major_refresh_recovery_605.py
            if ($LASTEXITCODE -ne 0) { throw "Focused Major regression failed with exit $LASTEXITCODE" }
            Write-Host "FOCUSED_MAJOR_REGRESSION=PASS"

            try {
              $p = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/api/v2/major-production/provider/status" -TimeoutSec 10
              Write-Host "PROVIDER_STATUS_HTTP=$($p.StatusCode)"
              Write-Host $p.Content
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              Write-Host "PROVIDER_STATUS_HTTP=$status"
              Write-Host "REAL_PROVIDER=NOT_CONFIGURED_IN_GITHUB_ACTIONS"
              Write-Host "REAL_PROVIDER_E2E=BLOCKED_AS_EXPECTED"
            }
          } finally {
            Write-Host "===== STDOUT ====="
            if (Test-Path $out) { Get-Content $out }
            Write-Host "===== STDERR ====="
            if (Test-Path $err) { Get-Content $err }
            if (-not $proc.HasExited) {
              cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null
            }
            Write-Host "SERVER_CLEANUP_DONE=YES"
          }

      - name: Package cumulative Windows Delta D overlay
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "major-refresh-delta-d-root"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = @(
            "START_MAJOR_V11_WINDOWS.bat",
            "quality_knowledge/web/major_production_api.py",
            "quality_knowledge/web/static/major_production.js",
            "quality_knowledge/web/templates/major_production.html",
            "services/major_case_production.py"
          )
          foreach ($src in $files) {
            if (-not (Test-Path -LiteralPath $src)) { throw "Patch source missing: $src" }
            $dst = Join-Path $stage $src
            New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst
          }
          $manifest = @(
            "PRODUCT_FROZEN_SOURCE=55aaf9234ec102360043f4deef782126bc234b80",
            "BASE_PACKAGE=MAJOR_V11_OVERALL_552_RC_55aaf923.zip",
            "DELIVERY=WINDOWS_DELTA_D_CUMULATIVE_OVERLAY",
            "DELTA_C_INCLUDED=YES",
            "SOURCE_BRANCH=fix/major-v11-windows-refresh-recovery-605",
            "RECOVERY_ISSUE=605",
            "USAGE=Fresh extract original frozen product; overlay this ZIP at main.py folder; launch START_MAJOR_V11_WINDOWS.bat",
            "USER_DATA=Keep LOCALAPPDATA/MajorV11/data unchanged",
            "REAL_WINDOWS_BROWSER=NOT_VERIFIED_BY_THIS_JOB",
            "REAL_PROVIDER_E2E=NOT_RUN"
          )
          $manifest | Set-Content -Path (Join-Path $stage "PATCH_MANIFEST.txt") -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP "MAJOR_V11_WINDOWS_REFRESH_DELTA_D_55AAF923_20261010.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $out -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLower()
          "PATCH_SHA256=$hash" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "MAJOR_DELTA_D_SHA256.txt")
          Write-Host "MAJOR_DELTA_D_ZIP=$out"
          Write-Host "MAJOR_DELTA_D_SHA256=$hash"

      - name: Upload Delta D Windows patch candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: major-v11-windows-refresh-delta-d
          path: |
            ${{ runner.temp }}/MAJOR_V11_WINDOWS_REFRESH_DELTA_D_55AAF923_20261010.zip
            ${{ runner.temp }}/MAJOR_DELTA_D_SHA256.txt
          if-no-files-found: error
          retention-days: 30
