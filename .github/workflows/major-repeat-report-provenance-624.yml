name: Major Repeat report provenance 624 (macOS + Linux)
on:
  push:
    branches:
      - fix/major-repeat-report-provenance-624
  pull_request:
    branches:
      - fix/major-v11-pr615-release-review-617
  workflow_dispatch:
permissions:
  contents: read

jobs:
  repeat-report-mock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact P2 branch HEAD
        uses: actions/checkout@v4
        with:
          ref: fix/major-repeat-report-provenance-624
          persist-credentials: false
          fetch-depth: 0  # Candidate builder validates frozen 55aaf923 ancestor
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact product runtime and pytest
        run: |
          python -m pip install --disable-pip-version-check -r requirements-major-mvp-product.txt
          python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Repeat report provenance + inherited regression
        run: |
          python -m pytest -q \
            tests/test_major_repeat_report_provenance_624.py \
            tests/test_major_pr615_release_review_617.py \
            tests/test_repeat_agent_capability_restore.py \
            tests/test_major_linux_repeat_report_614.py
          echo 'REPEAT_REPORT_PROVENANCE_MOCK_GATE=PASS'
      - name: Build exact-source immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/major624"
          python scripts/build_major_mvp_product_candidate.py --output-dir "$RUNNER_TEMP/major624"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / "major624"
          archives = list(root.glob("*.zip"))
          assert len(archives) == 1, archives
          archive = archives[0]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              manifest_name = next(n for n in z.namelist() if n.endswith("/PACKAGE_MANIFEST.json"))
              manifest = json.loads(z.read(manifest_name))
              source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              assert manifest["source_commit"] == source, (manifest["source_commit"], source)
              names = set(z.namelist())
              prefix = manifest_name.removesuffix("PACKAGE_MANIFEST.json")
              for rel in (
                  "quality_knowledge/repeat_risk/agent_analysis.py",
                  "presentation/construction/report_builder.py",
                  "presentation/renderer/markdown_renderer.py",
                  "requirements-major-mvp-product.txt",
                  "START_MAJOR_MVP.command",
              ):
                  assert prefix+rel in names, rel
              assert b"xlrd==2.0.2" in z.read(prefix+"requirements-major-mvp-product.txt")
          print("DUT_SOURCE_HEAD=" + source)
          print("NEW_CANDIDATE_SHA256=" + hashlib.sha256(archive.read_bytes()).hexdigest())
          print("FULL_PACKAGE_MANIFEST_GATE=PASS")
          PY
      - name: Gate separation
        if: always()
        run: |
          echo 'REPEAT_REAL_PROVIDER=NOT_RUN'
          echo 'MOCK_CANNOT_CERTIFY_MODEL_BUSINESS_PASS=YES'
          echo 'QUALITY_SCENARIO_DOWNSTREAM=NOT_RUN'
          echo 'WINDOWS_FIELD_GATE=NOT_RUN'
          echo 'RELEASE_APPROVAL=HOLD'
      - name: Upload exact candidate artifact
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: major-repeat-624-macos-source-candidate
          path: ${{ runner.temp }}/major624/*.zip
          if-no-files-found: warn
          retention-days: 21
