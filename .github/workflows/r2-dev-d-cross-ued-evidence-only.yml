name: R2 DEV-D Cross-UED Evidence Only

on:
  pull_request:
    branches: [integration/overall-r2]
    paths:
      - ".github/workflows/r2-dev-d-cross-ued-evidence-only.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_D_SOURCE: 983ad269a5e03c550d2138c54ba0fa2b3324eead
  PYTHONPATH: .

jobs:
  cross-ued-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact DEV-D source
        uses: actions/checkout@v4
        with:
          ref: 983ad269a5e03c550d2138c54ba0fa2b3324eead
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "DEV_D_SOURCE_EXPECTED=$DEV_D_SOURCE"
          echo "DEV_D_SOURCE_ACTUAL=$actual"
          test "$actual" = "$DEV_D_SOURCE"
          echo "DEV_D_SOURCE_GUARD=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: UED01 Current Problem binding
        run: >-
          python -m pytest -q
          tests/test_r2_w1_canonical_problem_contract.py
          tests/test_r2_w1_current_problem_association_restore.py
          tests/test_r2_w1_itr_recovery.py
          tests/test_r2_w1_itr_resolution.py
          tests/test_r2_w1_missed_test_analysis.py
          tests/test_r2_w1_original_workbench_entries.py

      - name: UED02 Major governed production
        run: >-
          python -m pytest -q
          tests/test_r2_w2_major_governed_production.py
          tests/test_r2_w5_major_excel_import_restore.py
          tests/test_historical_case_consumer_contract.py

      - name: UED03 UED04 Storage direct reuse
        run: >-
          python -m pytest -q
          tests/test_r2_w4_storage_direct_reuse.py

      - name: UED05 UED06 Agent Runtime Diagnostics
        run: >-
          python -m pytest -q
          tests/test_r2_w5_agent_config_runtime_diagnostics.py

      - name: Cross-UED navigation evidence return legacy protection
        run: >-
          python -m pytest -q
          tests/test_r2_w2_overall_ia.py
          tests/test_r2_w2_return_context.py
          tests/test_r2_w3_common_evidence.py
          tests/test_overall_legacy_capability_compatibility.py
          tests/test_r2_w2_legacy_scenario_compat.py
          tests/test_quality_scenario_workspace_binding.py
          tests/test_p04_quality_scenario_insight.py
          tests/test_p04_portrait_archive.py
