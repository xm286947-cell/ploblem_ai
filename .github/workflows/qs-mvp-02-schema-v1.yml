name: QS-MVP-02 Quality Scenario V1

on:
  push:
    branches:
      - feature/qs-mvp-02-quality-scenario-v1
  pull_request:
    branches:
      - feature/reverse-quality-v01
  workflow_dispatch:

jobs:
  schema-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q quality_knowledge

      - name: Quality Scenario V1 contract
        run: python -m pytest tests/test_quality_scenario_v1.py -q

      - name: Quality Scenario V1 repository
        run: python -m pytest tests/test_quality_scenario_v1_repository.py -q

      - name: Reverse Quality regression
        run: python -m pytest tests/test_reverse_quality.py -q

      - name: Legacy Scenario Generation regression
        run: python -m pytest tests/test_quality_scenario_generation.py -q

      - name: Legacy Scenario Library regressions
        run: |
          python -m pytest tests/test_quality_scenario_library.py -q
          python -m pytest tests/test_scenario_multisource_dedup.py -q
          python -m pytest tests/test_scenario_operation_sources.py -q
