name: Storage Knowledge Model W0

on:
  push:
    branches:
      - feature/storage-public-knowledge-inline
    paths:
      - "products/storage_rc1/config/storage_lifetime_knowledge_model.yaml"
      - "products/storage_rc1/storage_life/knowledge_model.py"
      - "products/storage_rc1/tests/test_storage_lifetime_knowledge_model.py"
      - ".github/workflows/storage-knowledge-model-w0.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -q pytest PyYAML fastapi pydantic

      - name: Validate model and focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/products/storage_rc1
        run: |
          python -m py_compile products/storage_rc1/storage_life/knowledge_model.py
          python -m pytest -q products/storage_rc1/tests/test_storage_lifetime_knowledge_model.py
