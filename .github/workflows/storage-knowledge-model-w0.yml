name: Storage Knowledge Production W0-W3

on:
  push:
    branches:
      - feature/storage-public-knowledge-inline
    paths:
      - "products/storage_rc1/config/storage_lifetime_knowledge_model.yaml"
      - "products/storage_rc1/storage_life/knowledge_model.py"
      - "products/storage_rc1/tests/test_storage_lifetime_knowledge_model.py"
      - "products/storage_rc1/storage_life/public_knowledge.py"
      - "products/storage_rc1/storage_life/knowledge_product.py"
      - "products/storage_rc1/storage_life/knowledge_release.py"
      - "products/storage_rc1/storage_life/product_api.py"
      - "products/storage_rc1/tests/test_storage_domain_skills_v01.py"
      - "products/storage_rc1/skills/packs/lifetime_engineering.yaml"
      - "products/storage_rc1/skills/runtime_adapter.py"
      - "products/storage_rc1/storage_life/index.html"
      - "knowledge_production/release_binding.py"
      - "products/storage_rc1/tests/test_storage_release_binding_upgrade.py"
      - "products/storage_rc1/tests/test_storage_product_semantic_consumption.py"
      - "knowledge_production/extraction.py"
      - "knowledge_production/publish.py"
      - "knowledge_production/web.py"
      - "knowledge_production/templates/kp_candidate_detail.html"
      - "products/storage_rc1/tests/test_public_knowledge_workspace.py"
      - "products/storage_rc1/tests/test_storage_knowledge_semantic_query.py"
      - "tests/test_kp_d03_review_publish.py"
      - "tests/test_kp_d05_processing_ui.py"
      - "products/storage_rc1/storage_life/app.py"
      - "products/storage_rc1/tests/test_storage_release_promotion.py"
      - ".github/workflows/storage-knowledge-model-w0.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -q -r products/storage_rc1/requirements.txt

      - name: Validate model and focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/products/storage_rc1
        run: |
          python -m py_compile \
            products/storage_rc1/storage_life/knowledge_model.py \
            products/storage_rc1/storage_life/public_knowledge.py \
            products/storage_rc1/storage_life/knowledge_product.py \
            products/storage_rc1/storage_life/knowledge_release.py \
            products/storage_rc1/storage_life/product_api.py \
            products/storage_rc1/storage_life/app.py \
            products/storage_rc1/skills/runtime_adapter.py \
            knowledge_production/release_binding.py \
            knowledge_production/extraction.py \
            knowledge_production/publish.py \
            knowledge_production/web.py
          python - <<'PY'
          from pathlib import Path
          html=Path("products/storage_rc1/storage_life/index.html").read_text(encoding="utf-8")
          start=html.index("<script>")+len("<script>")
          end=html.index("</script>",start)
          Path("/tmp/storage-knowledge-production.js").write_text(html[start:end],encoding="utf-8")
          required=[
              "按寿命模型生产知识",
              "pkModelScanEncoded",
              "pkModelExtractEncoded",
              "/knowledge-production/extract",
          ]
          missing=[item for item in required if item not in html]
          assert not missing, missing
          print("MODEL_DRIVEN_UI_STATIC=PASS")
          PY
          node --check /tmp/storage-knowledge-production.js
          python -m pytest -q products/storage_rc1/tests/test_storage_lifetime_knowledge_model.py
          python -m pytest -q products/storage_rc1/tests/test_public_knowledge_workspace.py \
            -k "model_scan_uses_frozen_storage_model_and_source_filter or model_scan_rejects_unknown_parameter_before_search or model_extract_bridges_exact_public_pdf_into_existing_kp or model_extract_never_runs_in_fixture_mode"
          python -m pytest -q tests/test_kp_d03_review_publish.py \
            -k "storage_model_candidate_requires_reviewed_semantic_before_publish or storage_model_reviewed_semantic_becomes_formal_consumable or storage_model_publish_rejects_unproposed_semantic"
          python -m pytest -q tests/test_kp_d05_processing_ui.py \
            -k "edit_uses_domain_review_and_preserves_original_candidate or storage_semantic_review_ui_to_publish"
          python -m pytest -q products/storage_rc1/tests/test_storage_knowledge_semantic_query.py

          python -m pytest -q products/storage_rc1/tests/test_storage_domain_skills_v01.py \
            -k "reviewed_semantic_pack_query_selects_parameter_without_prose_guess or reviewed_model_release_missing_scenario_does_not_fall_back_to_legacy_prose or legacy_release_without_structured_contract_remains_compatible or controlled_binding_supersedes_legacy_pack_release_pin or gs03_emmc_diagnostic_separates_capability_from_current_observation or gs05_change_impact_unknown_never_becomes_safe"
          python -m pytest -q products/storage_rc1/tests/test_storage_release_binding_upgrade.py
          python -m pytest -q products/storage_rc1/tests/test_storage_product_semantic_consumption.py
