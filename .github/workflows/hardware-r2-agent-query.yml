name: Hardware R2 Agent Retrieval and Consumption
on:
  pull_request:
    paths:
      - "services/hardware_r2_*.py"
      - "quality_knowledge/web/hardware_case_api.py"
      - "quality_knowledge/web/hardware_knowledge_consumption_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/static/hardware_case*.js"
      - "quality_knowledge/web/templates/hardware_case_knowledge_consumption.html"
      - "config/runtime/agents/hardware_retrieval.*.yaml"
      - "prompts/runtime/hardware_retrieval/**"
      - "tests/test_hardware_r2_*.py"
      - ".github/workflows/hardware-r2-agent-query.yml"
  workflow_dispatch:
jobs:
  focused-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run S1 query tests
        shell: bash
        run: |
          python -m compileall -q services/hardware_r2_query.py
          python -m pytest -q tests/test_hardware_r2_query.py
      - name: Frontend syntax
        run: |
          node --check quality_knowledge/web/static/hardware_case.js
          node --check quality_knowledge/web/static/hardware_case_knowledge_consumption.js
