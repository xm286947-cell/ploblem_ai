{
  "name": "QS W4 Functional Final Gate c577d93",
  "on": {
    "push": {
      "branches": [
        "ci/qs-w4-functional-final-c577d93"
      ],
      "paths": [
        ".github/workflows/qs-w4-functional-final-c577d93.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PRODUCT_SOURCE_SHA": "c577d936113457bb4269c46950c067390f213180",
    "PACKAGE_BASENAME": "QUALITY_PLATFORM_W4_FUNCTIONAL_GOLDEN_c577d9361134"
  },
  "jobs": {
    "focused": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "c577d936113457bb4269c46950c067390f213180",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt"
        },
        {
          "name": "Exact source",
          "shell": "bash",
          "run": "set -euo pipefail\n[ \"$(git rev-parse HEAD)\" = \"$PRODUCT_SOURCE_SHA\" ]\ngit diff --check \"$PRODUCT_SOURCE_SHA^..$PRODUCT_SOURCE_SHA\""
        },
        {
          "name": "Functional fixture + provider regressions",
          "shell": "bash",
          "run": "set -euo pipefail\npython -m pytest -q tests/test_quality_scenario_w4_functional_fixture.py tests/test_quality_scenario_w4_functional_provider_e2e.py tests/test_qsv1_portrait_consumption.py tests/test_software_assessment_qsv1_browser_flow.py tests/test_r2_w2_qsv1_production_chain.py tests/test_p04_portrait_archive.py tests/test_qs_p04_p03_published_binding_fix.py"
        },
        {
          "name": "Build fixture and require preflight",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p validation\npython tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db | tee validation/fixture_build.txt\npython tools/quality_scenario_w4_functional_preflight.py --db validation/quality_scenario_w4_fixture.db --require | tee validation/fixture_preflight.txt\ngrep -q 'W4_FUNCTIONAL_PREFLIGHT=PASS' validation/fixture_preflight.txt\ngrep -q 'G1_COMPLETE_EXPECTED=ASSESSMENT:PRESENT,RESOLUTION:PRESENT,ITR:PRESENT,MISSED_TEST:PRESENT' validation/fixture_preflight.txt\ngrep -q 'G4_DUPLICATE_GENERATE_EXPECTED=ASSESSMENT:PRESENT,RESOLUTION:PRESENT,ITR:PRESENT,MISSED_TEST:PRESENT' validation/fixture_preflight.txt"
        }
      ]
    },
    "mac_native": {
      "runs-on": "macos-latest",
      "timeout-minutes": 40,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "c577d936113457bb4269c46950c067390f213180"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt"
        },
        {
          "name": "Prepare fresh package-like fixture",
          "shell": "bash",
          "run": "set -euo pipefail\npython -m venv --system-site-packages .venv\nmkdir -p validation\npython tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db"
        },
        {
          "name": "Native macOS functional G1-G5 gate",
          "shell": "bash",
          "run": "python - <<'PY'\nimport json, os, signal, subprocess, time, urllib.request\nfrom pathlib import Path\n\nroot=Path.cwd()\nvalidation=root/'validation'\nlog_path=validation/'mac_native_functional.log'\nlog=log_path.open('w+',encoding='utf-8',errors='replace')\nproc=subprocess.Popen(\n    ['./start_w4_mac_functional_golden.command','--host','127.0.0.1','--port','18083'],\n    cwd=root,stdout=log,stderr=subprocess.STDOUT,text=True,start_new_session=True,\n)\nbase='http://127.0.0.1:18083'\n\ndef req(method,path,payload=None):\n    data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')\n    r=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json'})\n    with urllib.request.urlopen(r,timeout=30) as resp:\n        raw=resp.read()\n        if resp.headers.get_content_type()=='application/json':\n            return resp.status,json.loads(raw.decode('utf-8'))\n        return resp.status,raw.decode('utf-8')\n\ndef wait_task(task_id):\n    last=None\n    for _ in range(300):\n        s,last=req('GET',f'/api/v2/software-assessment/quality-scenario/generations/{task_id}')\n        assert s==200,last\n        states={x.get('state') for x in last.get('items',[])}\n        if 'ANALYZING' not in states:\n            return last\n        time.sleep(.1)\n    raise AssertionError(last)\n\ntry:\n    ready=False\n    for _ in range(720):\n        try:\n            urllib.request.urlopen(base+'/software-assessment',timeout=1)\n            ready=True\n            break\n        except Exception:\n            if proc.poll() is not None:\n                break\n            time.sleep(.25)\n    log.flush(); log.seek(0)\n    startup=log.read()\n    assert ready, 'MAC_NATIVE_HOST_NOT_READY\\n'+startup[-12000:]\n    assert 'W4_FUNCTIONAL_PREFLIGHT=PASS' in startup, startup[-12000:]\n    assert 'W4_FUNCTIONAL_PROVIDER_READY=YES' in startup, startup[-12000:]\n    assert 'FUNCTIONAL_PROVIDER=CONTROLLED_OPENAI_MOCK' in startup, startup[-12000:]\n    print('MAC_NATIVE_STARTUP_PREFLIGHT=PASS', flush=True)\n\n    manifest=json.load(open(validation/'quality_scenario_w4_fixture.db.fixture.json',encoding='utf-8'))\n    by_case={x['case_id']:x for x in manifest['cases']}\n\n    def preview(case_id):\n        item=by_case[case_id]\n        payload={\n            'material_ids':[item['software_assessment_material_id']],\n            'trigger_source':'HIGH_PERCEPTION',\n            'trigger_reason':'W4_MAC_FUNCTIONAL_GOLDEN'\n        }\n        s,p=req('POST','/api/v2/software-assessment/quality-scenario/preview',payload)\n        assert s==200,p\n        row=p['items'][0]\n        return payload,row\n\n    g1_payload,g1=preview('G1_COMPLETE')\n    assert g1['state']=='READY',g1\n    assert g1['bundle']['source_status']['ITR']=='PRESENT',g1\n    assert g1['bundle']['source_status']['RESOLUTION']=='PRESENT',g1\n    assert g1['bundle']['source_status']['MISSED_TEST']=='PRESENT',g1\n    print('MAC_G1_BUNDLE_COMPLETE=PASS', flush=True)\n\n    s,start=req('POST','/api/v2/software-assessment/quality-scenario/generations',g1_payload)\n    assert s==200,start\n    g1_task=wait_task(start['task_id'])\n    assert g1_task['items'][0]['state']=='CANDIDATE_CREATED',g1_task\n    print('MAC_G1_PROVIDER_CANDIDATE=PASS', flush=True)\n\n    g4_payload,g4=preview('G4_DUPLICATE_GENERATE')\n    assert g4['state']=='READY',g4\n    assert g4['bundle']['source_status']['ITR']=='PRESENT',g4\n    s,start=req('POST','/api/v2/software-assessment/quality-scenario/generations',g4_payload)\n    assert s==200,start\n    g4_first=wait_task(start['task_id'])\n    assert g4_first['items'][0]['state']=='CANDIDATE_CREATED',g4_first\n    first_id=g4_first['items'][0]['scenario']['scenario_id']\n    s,dup=req('POST','/api/v2/software-assessment/quality-scenario/generations',g4_payload)\n    assert s==200,dup\n    assert dup['items'][0]['state']=='EXISTING_CANDIDATE',dup\n    assert dup['items'][0]['scenario']['scenario_id']==first_id,dup\n    print('MAC_G4_IDEMPOTENCY=PASS', flush=True)\n\n    g5_payload,g5=preview('G5_SOURCE_REVISION')\n    assert g5['state']=='READY',g5\n    assert g5['bundle']['source_status']['ITR']=='PRESENT',g5\n    before_rev=g5['bundle']['bundle_revision']\n    s,start=req('POST','/api/v2/software-assessment/quality-scenario/generations',g5_payload)\n    assert s==200,start\n    g5_first=wait_task(start['task_id'])\n    assert g5_first['items'][0]['state']=='CANDIDATE_CREATED',g5_first\n\n    advance=subprocess.run(\n        ['./advance_w4_g5_source_revision.command'],\n        cwd=root,text=True,capture_output=True,timeout=60\n    )\n    assert advance.returncode==0, advance.stdout+'\\n'+advance.stderr\n    assert 'W4_G5_SOURCE_REVISION=ADVANCED' in advance.stdout, advance.stdout\n\n    _,g5_after=preview('G5_SOURCE_REVISION')\n    assert g5_after['bundle']['source_status']['ITR']=='PRESENT',g5_after\n    assert g5_after['bundle']['bundle_revision']!=before_rev,g5_after\n    assert g5_after['state']=='SOURCE_CHANGED_REANALYSIS_AVAILABLE',g5_after\n    s,start=req('POST','/api/v2/software-assessment/quality-scenario/generations',g5_payload)\n    assert s==200,start\n    g5_revised=wait_task(start['task_id'])\n    assert g5_revised['items'][0]['state']=='CANDIDATE_CREATED',g5_revised\n    print('MAC_G5_SOURCE_REVISION=PASS', flush=True)\n\n    g2_payload,g2=preview('G2_NO_MISSED_TEST')\n    assert g2['state']=='READY',g2\n    assert g2['bundle']['source_status']['ITR']=='PRESENT',g2\n    assert g2['bundle']['source_status']['MISSED_TEST']=='MISSING',g2\n    print('MAC_G2_MISSING_MISSED_TEST=PASS', flush=True)\n\n    _,g3=preview('G3_CONFLICT')\n    assert g3['state']=='INFORMATION_REQUIRED',g3\n    assert g3['bundle']['source_status']['RESOLUTION']=='CONFLICT',g3\n    assert g3['bundle']['source_status']['ITR']=='PRESENT',g3\n    print('MAC_G3_FAIL_CLOSED=PASS', flush=True)\n\n    print('MAC_FUNCTIONAL_G1_G5_GATE=PASS', flush=True)\nfinally:\n    try: os.killpg(proc.pid,signal.SIGTERM)\n    except ProcessLookupError: pass\n    try: proc.wait(timeout=8)\n    except subprocess.TimeoutExpired:\n        try: os.killpg(proc.pid,signal.SIGKILL)\n        except ProcessLookupError: pass\n        proc.wait(timeout=5)\n    log.close()\n\nPY"
        }
      ]
    },
    "package": {
      "needs": [
        "focused",
        "mac_native"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "c577d936113457bb4269c46950c067390f213180",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install product dependencies",
          "run": "python -m pip install -r requirements.txt"
        },
        {
          "name": "Build fixture",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p validation\npython tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db | tee validation/fixture_build.txt\npython tools/quality_scenario_w4_functional_preflight.py --db validation/quality_scenario_w4_fixture.db --require | tee validation/fixture_preflight.txt"
        },
        {
          "name": "Build exact package",
          "shell": "bash",
          "run": "set -euo pipefail\nSTAGE=\"$RUNNER_TEMP/w4-functional-final\"\nrm -rf \"$STAGE\"; mkdir -p \"$STAGE\" dist\ngit archive \"$PRODUCT_SOURCE_SHA\" | tar -x -C \"$STAGE\"\nmkdir -p \"$STAGE/validation\"\ncp validation/quality_scenario_w4_fixture.db \"$STAGE/validation/\"\ncp validation/quality_scenario_w4_fixture.db.fixture.json \"$STAGE/validation/\"\ncp validation/fixture_build.txt \"$STAGE/validation/\"\ncp validation/fixture_preflight.txt \"$STAGE/validation/\"\nprintf '%s\\n' \"$PRODUCT_SOURCE_SHA\" > \"$STAGE/PRODUCT_SOURCE_SHA\"\npython -c \"from pathlib import Path; import os,json; m={'package_type':'W4_FUNCTIONAL_GOLDEN_CANDIDATE','package_scope':'FULL_CURRENT_QUALITY_PLATFORM','source_sha':os.environ['PRODUCT_SOURCE_SHA'],'canonical_macos_entry':'start_w4_mac_functional_golden.command','provider_alias_entry':'start_w4_mac_functional_provider_golden.command','functional_provider':'CONTROLLED_OPENAI_MOCK','functional_provider_owned_by_canonical_launcher':True,'fixture_preflight_required':True,'g1_itr_expected':'PRESENT','g4_itr_expected':'PRESENT','g5_revision_control':'advance_w4_g5_source_revision.command','direct_qsv1_candidate_write':False,'direct_qsv1_publish_write':False,'real_provider_golden':False,'native_browser_golden':False}; Path('$STAGE/FULL_PLATFORM_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')\"\npython -c \"from pathlib import Path; import os; Path('$STAGE/00_READ_ME_FIRST.txt').write_text('W4 FUNCTIONAL GOLDEN\\n\\nSOURCE_SHA='+os.environ['PRODUCT_SOURCE_SHA']+'\\n\\nONLY START WITH:\\n  ./start_w4_mac_functional_golden.command --port 18080\\n\\nThe canonical launcher owns the controlled provider and requires the fixture preflight.\\nG1/G4 expected ITR=PRESENT.\\nG5 revision command: ./advance_w4_g5_source_revision.command\\n\\nDO NOT USE OLDER bc9dd3/f86ad86/b96c4c7/037be19 PACKAGES FOR THIS GATE.\\n',encoding='utf-8')\"\ntest -x \"$STAGE/start_w4_mac_functional_golden.command\"\ntest -x \"$STAGE/start_w4_mac_functional_provider_golden.command\"\ntest -x \"$STAGE/advance_w4_g5_source_revision.command\"\ntest -f \"$STAGE/validation/quality_scenario_w4_fixture.db\"\n(cd \"$STAGE\" && zip -q -r \"$GITHUB_WORKSPACE/dist/${PACKAGE_BASENAME}.zip\" .)\nsha256sum \"dist/${PACKAGE_BASENAME}.zip\" | tee \"dist/${PACKAGE_BASENAME}.zip.sha256\""
        },
        {
          "name": "Verify package identity",
          "shell": "bash",
          "run": "set -euo pipefail\npython -c \"import json,os,pathlib,zipfile; p=pathlib.Path('dist')/(os.environ['PACKAGE_BASENAME']+'.zip'); z=zipfile.ZipFile(p); m=json.loads(z.read('FULL_PLATFORM_MANIFEST.json')); assert z.read('PRODUCT_SOURCE_SHA').decode().strip()==os.environ['PRODUCT_SOURCE_SHA']; assert m['functional_provider_owned_by_canonical_launcher'] is True; assert m['fixture_preflight_required'] is True; assert m['g1_itr_expected']=='PRESENT'; assert m['g4_itr_expected']=='PRESENT'; assert not m['direct_qsv1_candidate_write']; assert not m['direct_qsv1_publish_write']; print('W4_FUNCTIONAL_PACKAGE_IDENTITY=PASS')\""
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "QUALITY_PLATFORM_W4_FUNCTIONAL_GOLDEN_c577d9361134",
            "path": "dist/QUALITY_PLATFORM_W4_FUNCTIONAL_GOLDEN_c577d9361134.zip\ndist/QUALITY_PLATFORM_W4_FUNCTIONAL_GOLDEN_c577d9361134.zip.sha256",
            "if-no-files-found": "error",
            "retention-days": 30,
            "compression-level": 0
          }
        }
      ]
    }
  }
}