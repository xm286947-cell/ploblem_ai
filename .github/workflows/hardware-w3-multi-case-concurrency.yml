name: Hardware W3 Multi-Case Concurrency Mock Gate

on:
  pull_request:
    paths:
      - "services/hardware_r1_batch_concurrency.py"
      - "services/hardware_w3_capacity_gate.py"
      - "services/hardware_case_r1_workbench.py"
      - "quality_knowledge/web/hardware_r1_workbench_api.py"
      - "tests/test_hardware_w3_batch_concurrency.py"
      - "tests/test_hardware_w3_reliability.py"
      - "tests/test_hardware_w3_workbench_ui.py"
      - "quality_knowledge/web/static/hardware_case_knowledge_production.js"
      - "quality_knowledge/web/templates/hardware_case_knowledge_production.html"
      - "quality_knowledge/web/static/hardware_case.css"
      - ".github/workflows/hardware-w3-multi-case-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-mock:
    name: w3-mock-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests and Runtime
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Static Python syntax compile
        run: python -m compileall -q services/hardware_r1_batch_concurrency.py services/hardware_w3_capacity_gate.py services/hardware_case_r1_workbench.py quality_knowledge/web/hardware_r1_workbench_api.py tests/test_hardware_w3_batch_concurrency.py tests/test_hardware_w3_reliability.py tests/test_hardware_w3_workbench_ui.py
      - name: Static JavaScript syntax check
        run: node --check quality_knowledge/web/static/hardware_case_knowledge_production.js
      - name: W3-03 additive UI contract
        run: python -m pytest -q tests/test_hardware_w3_workbench_ui.py
      - name: W3-01 + W3-02 Mock, cross-process slots, cancel, recovery
        run: python -m pytest -q tests/test_hardware_w3_batch_concurrency.py tests/test_hardware_w3_reliability.py
      - name: W2 Workbench state and review regressions (Mock-only)
        run: >
          python -m pytest -q
          tests/test_hardware_r1_workbench.py
          tests/test_hardware_r1_workbench_architecture.py
      # W2's unchanged test_v15_source_grounded_topology_contract_and_cache_identity
      # hard-codes a Stage A config hash which differs on Windows runners.
      # This is not a W3 Stage change; keep this legacy test on Linux/macOS and
      # track Windows baseline separately, without rewriting Agent contracts.
      - name: W2 Stage A/B frozen pipeline regressions (Linux/macOS)
        if: runner.os != 'Windows'
        run: python -m pytest -q tests/test_hardware_r1_pipeline_v13.py
