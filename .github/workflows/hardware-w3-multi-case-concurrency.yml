name: Hardware W3 Multi-Case Concurrency Mock Gate

on:
  pull_request:
    paths:
      - "services/hardware_r1_batch_concurrency.py"
      - "services/hardware_case_r1_workbench.py"
      - "quality_knowledge/web/hardware_r1_workbench_api.py"
      - "tests/test_hardware_w3_batch_concurrency.py"
      - ".github/workflows/hardware-w3-multi-case-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-mock:
    name: w3-mock-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests and Runtime
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Static syntax compile
        run: python -m compileall -q services/hardware_r1_batch_concurrency.py services/hardware_case_r1_workbench.py quality_knowledge/web/hardware_r1_workbench_api.py tests/test_hardware_w3_batch_concurrency.py
      - name: W3 bounded concurrency and W2 frozen behavior regression (Mock-only)
        run: >
          python -m pytest -q
          tests/test_hardware_w3_batch_concurrency.py
          tests/test_hardware_r1_workbench.py
          tests/test_hardware_r1_workbench_architecture.py
          tests/test_hardware_r1_pipeline_v13.py
