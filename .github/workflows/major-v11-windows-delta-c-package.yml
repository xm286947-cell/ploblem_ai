name: Major V1.1 Windows Delta C Patch Packaging

on:
  push:
    branches:
      - build/major-v11-windows-import-delta-c-599
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source files
        shell: pwsh
        run: |
          node --check quality_knowledge/web/static/major_production.js
          python -m compileall -q services/major_case_production.py quality_knowledge/web/major_production_api.py
      - name: Package cumulative Windows Delta C
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = 'MAJOR_V11_WINDOWS_IMPORT_DELTA_C_55AAF923_20261010.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'major-599-patch'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $stage,$dist -Force | Out-Null
          $files = @(
            'START_MAJOR_V11_WINDOWS.bat',
            'services/major_case_production.py',
            'quality_knowledge/web/major_production_api.py',
            'quality_knowledge/web/static/major_production.js',
            'quality_knowledge/web/templates/major_production.html'
          )
          $fileProof = @()
          foreach ($file in $files) {
            $target = Join-Path $stage $file
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            Copy-Item $file $target -Force
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            $fileProof += @{ path = $file.Replace('\','/'); sha256 = $hash }
          }
          $manifest = @{
            patch = 'MAJOR_V11_WINDOWS_IMPORT_DELTA_C_55AAF923_20261010'
            base_package = 'MAJOR_V11_OVERALL_552_RC_55aaf923.zip'
            base_source_sha = '55aaf9234ec102360043f4deef782126bc234b80'
            tested_git_head = '5314a7d9dd57b049338b243460b51204d188c64d'
            windows_native_test_run = 38047512872
            note = 'Additive overlay only, independent of frozen Mac release; supersedes Delta A and Delta B Windows start patches.'
            real_provider_e2e = 'NOT_RUN'
            file_hashes = $fileProof
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path (Join-Path $stage 'PATCH_MANIFEST.json') -Encoding utf8
          @(
            'Major V1.1 Windows Delta C: Batch import visibility and AI diagnosis'
            '1. Unzip original MAJOR_V11_OVERALL_552_RC_55aaf923.zip.',
            '2. Unzip Delta C directly into the same root directory where main.py is located; overwrite the four product UI/API/service files if prompted.',
            '3. Double-click START_MAJOR_V11_WINDOWS.bat.',
            '4. Open http://127.0.0.1:18080/p0/major-production and refresh the page.',
            'Import status is now visible next to the batch import action. Uploaded bytes percentage is measured, while server processing shows elapsed seconds rather than invented percent.',
            'Single intake and subsequent AI analysis are independent. MAJOR_ANALYSIS_INCOMPLETE means the AI gate did not pass; the imported Case/Event is retained. Copy the Runtime Task ID and check MAJOR_ANALYSIS_INCOMPLETE in server logs.',
            'This patch makes no historical case, schema, Provider, Expected or Golden changes. Existing DB under LOCALAPPDATA/MajorV11/data is retained.',
            'Windows source-run checks are not a substitute for a real Provider E2E.'
          ) | Set-Content -Path (Join-Path $stage 'README_WINDOWS_DELTA_C.txt') -Encoding utf8
          $dest = Join-Path $dist $patch
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $dest -CompressionLevel Optimal -Force
          $sha = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $dest).Length
          "$sha  $patch" | Set-Content -Path "$dest.sha256" -Encoding ascii
          Expand-Archive $dest (Join-Path $env:RUNNER_TEMP 'delta-c-readback') -Force
          foreach ($file in $files) {
            $expected = (Get-FileHash $file -Algorithm SHA256).Hash
            $actual = (Get-FileHash (Join-Path (Join-Path $env:RUNNER_TEMP 'delta-c-readback') $file) -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "PATCH_BYTE_DIFF $file" }
          }
          Write-Host "PATCH_CRC_AND_FILE_SHA=PASS"
          Write-Host "PATCH_SHA256=$sha"
          Write-Host "PATCH_SIZE=$size"
          Write-Host "PATCH_PATH=$dest"
      - uses: actions/upload-artifact@v4
        with:
          name: major-v11-windows-delta-c
          path: dist/*
          retention-days: 30
          if-no-files-found: error
