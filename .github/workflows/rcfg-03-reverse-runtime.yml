name: RCFG-03 Reverse Quality Runtime

on:
  push:
    branches:
      - rcfg-03-reverse-runtime-config
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rcfg03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Reverse Quality branch
        uses: actions/checkout@v4

      - name: Checkout validated Runtime dependency
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 0959da43008307398a9cac0f9abfc7fec26dcb8a
          path: .deps/unified-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Reverse Quality dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Runtime dependencies
        run: python -m pip install -r .deps/unified-agent-runtime/requirements-runtime-p0-test.txt

      - name: Isolate Runtime package only
        run: |
          mkdir -p .runtime-dep
          cp -R .deps/unified-agent-runtime/runtime .runtime-dep/runtime

      - name: Verify dependency boundary
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: |
          python - <<'PY'
          import quality_knowledge
          import runtime
          from pathlib import Path
          root=Path.cwd().resolve()
          q=Path(quality_knowledge.__file__).resolve()
          r=Path(runtime.__file__).resolve()
          assert str(q).startswith(str(root)), q
          assert ".runtime-dep" in str(r), r
          print("quality_knowledge:", q)
          print("runtime:", r)
          PY

      - name: Compile Reverse Quality
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: python -m compileall -q quality_knowledge

      - name: RCFG-03 Runtime Mock E2E
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: python -m pytest tests/test_reverse_quality_runtime_integration.py -q

      - name: Reverse Quality RC1 regression
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: |
          python -m pytest tests/test_reverse_quality_store.py -q
          python -m pytest tests/test_reverse_quality.py -q
          python -m pytest tests/test_quality_scenario_generation.py -q
          python -m pytest tests/test_quality_scenario_library.py -q
          python -m pytest tests/test_scenario_multisource_dedup.py -q
          python -m pytest tests/test_scenario_operation_sources.py -q
