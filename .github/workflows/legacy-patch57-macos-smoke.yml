name: Legacy PATCH57 macOS Native Restore Smoke
on:
  push:
    branches:
      - test/legacy-quality-patch57-macos-20260913
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm frozen historical code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6bd207e00b38e3688c817f27621bfedf052aeffb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/legacy-patch57-macos-smoke.yml"
          test ! -e quality_knowledge/reverse_quality.py
          grep -q "V1.1_P2_RC2_PATCH57_20260913" README.md
          echo "ORIGINAL_PATCH57_SHA=$(git rev-parse HEAD^)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install original dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install httpx
      - name: Old-workflow regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_itr_cs_material_mvp.py tests/test_quality_scenario_generation.py tests/test_quality_scenario_library.py tests/test_scenario_assets.py tests/test_scenario_interpretation.py | tee legacy-macos-pytest.log
      - name: Run original main.py knowledge-web on native macOS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,sys,tempfile,time,urllib.request
          with tempfile.TemporaryDirectory(prefix='patch57-macos-') as t:
              db=pathlib.Path(t)/'empty.db'
              log=open('legacy-macos-server.log','w',encoding='utf-8')
              p=subprocess.Popen([sys.executable,'main.py','knowledge-web','--db',str(db)],stdout=log,stderr=subprocess.STDOUT)
              try:
                  for i in range(90):
                      if p.poll() is not None:
                          raise RuntimeError('native Mac web exited early; see legacy-macos-server.log')
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:8080/issues',timeout=2) as r:
                              if r.status==200:break
                      except Exception:
                          time.sleep(1)
                  else:
                      raise RuntimeError('native Mac web startup exceeded 90 seconds')
                  for path,expected in [('/issues','问题工作台'),('/materials/software-operations','软件问题考核工作台'),('/quality-scenarios','质量场景库'),('/quality-scenario-assets','质量场景资产')]:
                      with urllib.request.urlopen('http://127.0.0.1:8080'+path,timeout=20) as r:
                          html=r.read().decode('utf-8')
                          if r.status != 200 or expected not in html:
                              raise AssertionError(f'{path}: status={r.status}, label_present={expected in html}')
                          if path=='/materials/software-operations' and '<th>分值</th>' in html:
                              raise AssertionError('historically absent score column was found')
                          print(f'MACOS_NATIVE_HTTP_PASS={path}')
              finally:
                  p.terminate()
                  try:p.wait(timeout=10)
                  except subprocess.TimeoutExpired:p.kill()
                  log.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PATCH57_MACOS_NATIVE_EVIDENCE
          path: |
            legacy-macos-pytest.log
            legacy-macos-server.log
          retention-days: 14
          if-no-files-found: warn
