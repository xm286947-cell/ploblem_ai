name: Storage R6 F1 Issue 132 Gate
on:
  push:
    branches:
      - fix/storage-rc1-r6-issue-132
  pull_request:
    branches: [main]
    paths:
      - "products/storage_rc1/**"
permissions:
  contents: read
jobs:
  issue132-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify F1 scope and base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e f420769ff83ca9d49deb4121d7c9170991a0130a^{commit}
          CHANGED="$(git diff --name-only f420769ff83ca9d49deb4121d7c9170991a0130a...HEAD)"
          echo "$CHANGED"
          test "$(echo "$CHANGED" | grep -v '^products/storage_rc1/storage_life/index.html$' | grep -v '^products/storage_rc1/tests/test_ui_next_issue132.py$' | sed '/^$/d' | wc -l | tr -d ' ')" = "0"
      - name: Install declared dependencies
        shell: bash
        run: |
          python -m venv /tmp/storage-r6-f1
          /tmp/storage-r6-f1/bin/python -m pip install --disable-pip-version-check -q -r products/storage_rc1/requirements.txt
      - name: UI-NEXT-01..06 and P08 contract regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/storage-r6-f1/bin/python -m pytest -q products/storage_rc1/tests/test_ui_next_issue132.py
      - name: Import and coverage regression
        shell: bash
        run: |
          set -euo pipefail
          cd products/storage_rc1
          /tmp/storage-r6-f1/bin/python -m pytest -q tests/test_product_mvp.py tests/test_coverage.py tests/test_product_api.py
      - name: Result
        shell: bash
        run: |
          echo "TASK=STORAGE-RC1-R6-F1-ISSUE-132-FIX-001"
          echo "UI-NEXT-01..06=PASS"
          echo "P08_IMPORT_COVERAGE_REGRESSION=PASS"
          echo "RESULT=READY_FOR_PRODUCT_RETEST"
