name: Storage MVP Hotfix Patch

on:
  push:
    branches:
      - feature/storage-public-knowledge-inline
    paths:
      - ".github/workflows/storage-mvp-hotfix-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 0b6e7c8bbecc7777a6f2cb9a79dbdd5e1751dd0c
      TARGET_RUNTIME_SHA: b8dcdf54cd31a418a0ab195d9b0858688fac9742
      PATCH_ID: STORAGE_MVP_HOTFIX_0b6e7c8b_TO_b8dcdf54_20261006
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize exact runtime delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/storage-hotfix
          ROOT="/tmp/storage-hotfix/${PATCH_ID}"
          mkdir -p "${ROOT}/payload/products/storage_rc1/storage_life"
          for f in index.html product_api.py public_knowledge.py; do
            git show "${TARGET_RUNTIME_SHA}:products/storage_rc1/storage_life/${f}" > "${ROOT}/payload/products/storage_rc1/storage_life/${f}"
          done

      - name: Verify target syntax
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/storage-hotfix/${PATCH_ID}"
          python -m py_compile             "${ROOT}/payload/products/storage_rc1/storage_life/product_api.py"             "${ROOT}/payload/products/storage_rc1/storage_life/public_knowledge.py"
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path("/tmp/storage-hotfix")/os.environ["PATCH_ID"]
          html=(root/"payload/products/storage_rc1/storage_life/index.html").read_text(encoding="utf-8")
          s=html.index("<script>")+len("<script>")
          e=html.index("</script>",s)
          Path("/tmp/storage-hotfix-inline.js").write_text(html[s:e],encoding="utf-8")
          PY
          node --check /tmp/storage-hotfix-inline.js

      - name: Build patch scripts and manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/storage-hotfix/${PATCH_ID}"

          cat > "${ROOT}/apply_patch.command" <<'SH'
          #!/bin/bash
          set -euo pipefail
          PATCH_DIR="$(cd "$(dirname "$0")" && pwd)"
          REL="products/storage_rc1/storage_life"
          choose_target() {
            if [ "$#" -ge 1 ] && [ -d "$1" ]; then
              printf '%s' "$1"
              return
            fi
            if [ -f "$PWD/$REL/index.html" ]; then
              printf '%s' "$PWD"
              return
            fi
            if [ -f "$(dirname "$PATCH_DIR")/$REL/index.html" ]; then
              printf '%s' "$(dirname "$PATCH_DIR")"
              return
            fi
            if command -v osascript >/dev/null 2>&1; then
              osascript -e 'POSIX path of (choose folder with prompt "选择你刚刚安装的 Storage 完整包根目录")' 2>/dev/null || true
            fi
          }
          TARGET="$(choose_target "${1:-}")"
          TARGET="${TARGET%/}"
          if [ -z "$TARGET" ] || [ ! -f "$TARGET/$REL/index.html" ]; then
            echo "未找到 Storage 安装目录。"
            echo "用法：把安装目录拖到此命令后面，或把补丁文件夹放到安装目录内再双击。"
            read -r -p "按回车退出..."
            exit 2
          fi
          python3 "$PATCH_DIR/patch_apply.py" apply "$TARGET"
          echo
          echo "补丁已完成。重新启动 Storage 即可。"
          read -r -p "按回车关闭..."
          SH

          cat > "${ROOT}/rollback_patch.command" <<'SH'
          #!/bin/bash
          set -euo pipefail
          PATCH_DIR="$(cd "$(dirname "$0")" && pwd)"
          REL="products/storage_rc1/storage_life"
          choose_target() {
            if [ "$#" -ge 1 ] && [ -d "$1" ]; then
              printf '%s' "$1"
              return
            fi
            if [ -f "$PWD/$REL/index.html" ]; then
              printf '%s' "$PWD"
              return
            fi
            if [ -f "$(dirname "$PATCH_DIR")/$REL/index.html" ]; then
              printf '%s' "$(dirname "$PATCH_DIR")"
              return
            fi
            if command -v osascript >/dev/null 2>&1; then
              osascript -e 'POSIX path of (choose folder with prompt "选择已应用补丁的 Storage 安装目录")' 2>/dev/null || true
            fi
          }
          TARGET="$(choose_target "${1:-}")"
          TARGET="${TARGET%/}"
          if [ -z "$TARGET" ] || [ ! -f "$TARGET/$REL/index.html" ]; then
            echo "未找到 Storage 安装目录。"
            read -r -p "按回车退出..."
            exit 2
          fi
          python3 "$PATCH_DIR/patch_apply.py" rollback "$TARGET"
          echo
          read -r -p "按回车关闭..."
          SH

          cat > "${ROOT}/apply_patch.bat" <<'BAT'
          @echo off
          setlocal
          set "PATCH_DIR=%~dp0"
          set "TARGET=%~1"
          if "%TARGET%"=="" set "TARGET=%CD%"
          if not exist "%TARGET%\products\storage_rc1\storage_life\index.html" (
            if exist "%PATCH_DIR%..\products\storage_rc1\storage_life\index.html" (
              for %%I in ("%PATCH_DIR%..") do set "TARGET=%%~fI"
            ) else (
              echo.
              echo Please drag the installed Storage package folder onto apply_patch.bat
              echo or run: apply_patch.bat "C:\path\to\installed\package"
              pause
              exit /b 2
            )
          )
          py -3 "%PATCH_DIR%patch_apply.py" apply "%TARGET%"
          if errorlevel 1 (
            python "%PATCH_DIR%patch_apply.py" apply "%TARGET%"
          )
          if errorlevel 1 (
            echo Patch failed.
            pause
            exit /b 1
          )
          echo.
          echo Patch completed. Restart Storage.
          pause
          BAT

          cat > "${ROOT}/rollback_patch.bat" <<'BAT'
          @echo off
          setlocal
          set "PATCH_DIR=%~dp0"
          set "TARGET=%~1"
          if "%TARGET%"=="" set "TARGET=%CD%"
          if not exist "%TARGET%\products\storage_rc1\storage_life\index.html" (
            if exist "%PATCH_DIR%..\products\storage_rc1\storage_life\index.html" (
              for %%I in ("%PATCH_DIR%..") do set "TARGET=%%~fI"
            ) else (
              echo Please drag the installed Storage package folder onto rollback_patch.bat
              pause
              exit /b 2
            )
          )
          py -3 "%PATCH_DIR%patch_apply.py" rollback "%TARGET%"
          if errorlevel 1 python "%PATCH_DIR%patch_apply.py" rollback "%TARGET%"
          pause
          BAT

          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path("/tmp/storage-hotfix")/os.environ["PATCH_ID"]
          base=os.environ["BASE_SHA"]; target=os.environ["TARGET_RUNTIME_SHA"]
          paths=[
              "products/storage_rc1/storage_life/index.html",
              "products/storage_rc1/storage_life/product_api.py",
              "products/storage_rc1/storage_life/public_knowledge.py",
          ]
          def sha(b): return hashlib.sha256(b).hexdigest()
          manifest={
              "patch_id":os.environ["PATCH_ID"],
              "base_sha":base,
              "target_runtime_sha":target,
              "scope":"runtime files only; user data/database untouched",
              "files":[]
          }
          for p in paths:
              old=subprocess.check_output(["git","show",f"{base}:{p}"])
              new=(root/"payload"/p).read_bytes()
              manifest["files"].append({"path":p,"base_sha256":sha(old),"target_sha256":sha(new)})
          (root/"PATCH_MANIFEST.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")

          script=r'''from __future__ import annotations
          import hashlib, json, os, shutil, sys
          from datetime import datetime
          from pathlib import Path

          PATCH_DIR=Path(__file__).resolve().parent
          MANIFEST=json.loads((PATCH_DIR/"PATCH_MANIFEST.json").read_text(encoding="utf-8"))

          def digest(path:Path)->str:
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          def backup_root(target:Path)->Path:
              return target/".storage_hotfix_backup"/MANIFEST["patch_id"]

          def apply(target:Path)->None:
              files=MANIFEST["files"]
              states=[]
              for item in files:
                  dst=target/item["path"]
                  if not dst.is_file():
                      raise SystemExit(f"PATCH_TARGET_FILE_MISSING: {item['path']}")
                  current=digest(dst)
                  if current==item["target_sha256"]:
                      states.append(("target",item,dst))
                  elif current==item["base_sha256"]:
                      states.append(("base",item,dst))
                  else:
                      raise SystemExit(
                          "PATCH_BASE_MISMATCH: "+item["path"]+
                          "\n当前文件不是本补丁支持的 0b6e7c8b 基线，也不是已更新版本。"+
                          "\n为保护现场数据，补丁已停止，不会覆盖。"
                      )
              if all(s=="target" for s,_,__ in states):
                  print("ALREADY_PATCHED=YES")
                  return
              bdir=backup_root(target)
              for state,item,dst in states:
                  if state!="base": continue
                  bak=bdir/item["path"]
                  bak.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(dst,bak)
              for state,item,dst in states:
                  if state!="base": continue
                  src=PATCH_DIR/"payload"/item["path"]
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  tmp=dst.with_name(dst.name+".hotfix_tmp")
                  shutil.copy2(src,tmp)
                  if digest(tmp)!=item["target_sha256"]:
                      tmp.unlink(missing_ok=True)
                      raise SystemExit("PATCH_PAYLOAD_HASH_MISMATCH: "+item["path"])
                  os.replace(tmp,dst)
              for item in files:
                  dst=target/item["path"]
                  if digest(dst)!=item["target_sha256"]:
                      raise SystemExit("PATCH_VERIFY_FAILED: "+item["path"])
              stamp={
                  "patch_id":MANIFEST["patch_id"],
                  "base_sha":MANIFEST["base_sha"],
                  "target_runtime_sha":MANIFEST["target_runtime_sha"],
                  "applied_at":datetime.now().astimezone().isoformat(),
                  "backup_dir":str(bdir),
              }
              marker=target/".storage_hotfix_applied.json"
              marker.write_text(json.dumps(stamp,ensure_ascii=False,indent=2),encoding="utf-8")
              print("PATCH_RESULT=PASS")
              print("USER_DATA_TOUCHED=NO")
              print("BACKUP_DIR="+str(bdir))

          def rollback(target:Path)->None:
              bdir=backup_root(target)
              if not bdir.is_dir():
                  raise SystemExit("ROLLBACK_BACKUP_NOT_FOUND")
              for item in MANIFEST["files"]:
                  src=bdir/item["path"]
                  dst=target/item["path"]
                  if not src.is_file():
                      raise SystemExit("ROLLBACK_FILE_MISSING: "+item["path"])
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
                  if digest(dst)!=item["base_sha256"]:
                      raise SystemExit("ROLLBACK_VERIFY_FAILED: "+item["path"])
              (target/".storage_hotfix_applied.json").unlink(missing_ok=True)
              print("ROLLBACK_RESULT=PASS")

          if len(sys.argv)!=3 or sys.argv[1] not in {"apply","rollback"}:
              raise SystemExit("usage: patch_apply.py apply|rollback <installed-package-root>")
          target=Path(sys.argv[2]).expanduser().resolve()
          if sys.argv[1]=="apply": apply(target)
          else: rollback(target)
          '''
          # remove workflow heredoc indentation
          lines=script.splitlines()
          cleaned="\n".join(line[10:] if line.startswith("          ") else line for line in lines).lstrip()+"\n"
          (root/"patch_apply.py").write_text(cleaned,encoding="utf-8")

          readme=f"""Storage MVP 增量热修补丁
          PATCH_ID={os.environ['PATCH_ID']}
          BASE={base}
          TARGET_RUNTIME={target}

          本补丁只替换 3 个程序文件：
          - products/storage_rc1/storage_life/index.html
          - products/storage_rc1/storage_life/product_api.py
          - products/storage_rc1/storage_life/public_knowledge.py

          本次修复：
          1. 导入第二份资料时，资料标题跟随当前文件自动刷新。
          2. Public Knowledge 支持删除错误资料 / 错误 Revision。
          3. 检索增加 AI 综合解读：先检索 Citation，再由已连接的大模型综合公开资料；综合结果仍保留来源边界。

          不会修改：
          - SQLite / 产品数据库
          - 已导入资料数据
          - Runtime Snapshot
          - Formal Knowledge
          - 用户配置

          macOS：
          双击 apply_patch.command；若补丁不在安装目录内，会弹出窗口让你选择刚安装的 Storage 完整包根目录。
          回滚：双击 rollback_patch.command。

          Windows：
          把安装目录拖到 apply_patch.bat 上，或命令行执行：
          apply_patch.bat "安装目录"
          回滚同理使用 rollback_patch.bat。

          安全策略：
          - 只支持准确的 0b6e7c8b 基线。
          - 若目标文件已被其他版本修改，补丁会拒绝覆盖。
          - 应用前自动备份 3 个原文件到 .storage_hotfix_backup。
          - 已经打过补丁时重复执行是幂等的。
          """
          (root/"README_先看我.txt").write_text("\n".join(x[10:] if x.startswith("          ") else x for x in readme.splitlines())+"\n",encoding="utf-8")
          PY

          chmod +x "${ROOT}/apply_patch.command" "${ROOT}/rollback_patch.command"

      - name: Upload hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PATCH_ID }}
          path: /tmp/storage-hotfix/${{ env.PATCH_ID }}/
          if-no-files-found: error
