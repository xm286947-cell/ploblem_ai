name: Overall R2 W5 CPC1 Package

on:
  push:
    branches:
      - integration/overall-r2
    paths:
      - ".github/workflows/overall-r2-w5-cpc1-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-and-rollback-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: 0cbfaac74b8e11ff29160abb796f75163b24855c
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source-bound CPC1 directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgName = "OVERALL_R2_CPC1_0CBFAAC_20260929"
          $dist = Join-Path $env:RUNNER_TEMP $pkgName
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist | Out-Null

          git archive --format=zip --output="$env:RUNNER_TEMP\r2-source.zip" 0cbfaac74b8e11ff29160abb796f75163b24855c
          Expand-Archive -Path "$env:RUNNER_TEMP\r2-source.zip" -DestinationPath $dist

          $expectedSeed = "443101e36d2c5b610bc62d130701ed7352175a12696bfc20fd9c5fe47fa411c3"
          $actualSeed = (Get-FileHash -Algorithm SHA256 (Join-Path $dist "quality_knowledge\config\plc_fields.yaml")).Hash.ToLower()
          if ($actualSeed -ne $expectedSeed) { throw "R2 CPC1 PLC seed binding mismatch: $actualSeed" }

          $install = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'where python >nul 2>nul',
            'if %errorlevel%==0 (',
            '  python -m pip install --upgrade pip',
            '  if errorlevel 1 exit /b 1',
            '  python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt',
            ') else (',
            '  py -3.11 -m pip install --upgrade pip',
            '  if errorlevel 1 exit /b 1',
            '  py -3.11 -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt',
            ')',
            'exit /b %errorlevel%'
          )
          $install | Set-Content -Encoding ascii (Join-Path $dist "INSTALL_WINDOWS.bat")

          $startBat = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0START_OVERALL_R2.ps1"',
            'exit /b %errorlevel%'
          )
          $startBat | Set-Content -Encoding ascii (Join-Path $dist "START_OVERALL_R2.bat")

          $stopBat = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0STOP_OVERALL_R2.ps1"',
            'exit /b %errorlevel%'
          )
          $stopBat | Set-Content -Encoding ascii (Join-Path $dist "STOP_OVERALL_R2.bat")

          $startPs = @(
            '$ErrorActionPreference = "Stop"',
            '$root = Split-Path -Parent $MyInvocation.MyCommand.Path',
            'Set-Location $root',
            '$runDir = Join-Path $root "run"',
            '$logDir = Join-Path $root "logs"',
            '$knowledgeDir = Join-Path $root "knowledge"',
            'New-Item -ItemType Directory -Force -Path $runDir,$logDir,$knowledgeDir | Out-Null',
            '$pidFile = Join-Path $runDir "overall-r2.pid"',
            'if (Test-Path $pidFile) {',
            '  $oldPid = [int](Get-Content $pidFile -Raw)',
            '  if (Get-Process -Id $oldPid -ErrorAction SilentlyContinue) { throw "OVERALL_R2_ALREADY_RUNNING:$oldPid" }',
            '  Remove-Item -Force $pidFile',
            '}',
            '$legacy = Join-Path $knowledgeDir "quality_issue_v1.db"',
            'if (!(Test-Path $legacy)) {',
            '  python -c "from quality_knowledge.web import create_app; create_app(r''knowledge/quality_issue_v1.db'')"',
            '  if ($LASTEXITCODE -ne 0) { throw "LEGACY_DB_INIT_FAILED" }',
            '}',
            '$env:LEGACY_QUALITY_ISSUE_DB_PATH = (Resolve-Path $legacy).Path',
            '$stdout = Join-Path $logDir "overall-r2.stdout.log"',
            '$stderr = Join-Path $logDir "overall-r2.stderr.log"',
            '$proc = Start-Process -FilePath "python" -ArgumentList @("main.py","knowledge-p1-start","--db","knowledge\quality_capability_p1.db","--host","127.0.0.1","--port","8080") -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr',
            'Set-Content -Encoding ascii -Path $pidFile -Value $proc.Id',
            '$ready = $false',
            'for ($i=0; $i -lt 60; $i++) {',
            '  if ($proc.HasExited) { break }',
            '  try {',
            '    $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/p0/issues" -UseBasicParsing -TimeoutSec 3',
            '    if ($response.StatusCode -eq 200) { $ready = $true; break }',
            '  } catch {}',
            '  Start-Sleep -Seconds 2',
            '}',
            'if (-not $ready) {',
            '  if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }',
            '  Remove-Item -Force $pidFile -ErrorAction SilentlyContinue',
            '  if (Test-Path $stdout) { Get-Content $stdout }',
            '  if (Test-Path $stderr) { Get-Content $stderr }',
            '  throw "OVERALL_R2_STARTUP_FAILED"',
            '}',
            'Write-Host "OVERALL_R2_STARTED PID=$($proc.Id) URL=http://127.0.0.1:8080/p0/overall"'
          )
          $startPs | Set-Content -Encoding utf8 (Join-Path $dist "START_OVERALL_R2.ps1")

          $stopPs = @(
            '$ErrorActionPreference = "Stop"',
            '$root = Split-Path -Parent $MyInvocation.MyCommand.Path',
            '$pidFile = Join-Path $root "run\overall-r2.pid"',
            'if (!(Test-Path $pidFile)) { Write-Host "OVERALL_R2_NOT_RUNNING"; exit 0 }',
            '$pidValue = [int](Get-Content $pidFile -Raw)',
            '$proc = Get-Process -Id $pidValue -ErrorAction SilentlyContinue',
            'if ($proc) { Stop-Process -Id $pidValue -Force }',
            'Remove-Item -Force $pidFile -ErrorAction SilentlyContinue',
            'Write-Host "OVERALL_R2_STOPPED PID=$pidValue"'
          )
          $stopPs | Set-Content -Encoding utf8 (Join-Path $dist "STOP_OVERALL_R2.ps1")

          $manifest = @(
            'PACKAGE_ID=OVERALL-R2-CPC1-0CBFAAC-20260929',
            'PACKAGE_TYPE=COMPLETE_PRODUCT_CANDIDATE',
            'PRODUCT_SOURCE=0cbfaac74b8e11ff29160abb796f75163b24855c',
            'CURRENT_FORMAL_RELEASE_BASELINE=927efef5b7707d5d2013a34c1f3f40a8ade3d93d',
            'W1_DEVELOPMENT_GATE=PASS',
            'W2_DEVELOPMENT_GATE=PASS',
            'W3_DEVELOPMENT_GATE=PASS',
            'W4_DEVELOPMENT_GATE=PASS',
            'PRODUCT_TEST_GATE=NOT_RUN',
            'RELEASE_DECISION=NOT_REQUESTED',
            'TARGET_DEPLOYMENT=NOT_RUN',
            'DEFAULT_ENTRY=http://127.0.0.1:8080/p0/overall',
            'INSTALL=INSTALL_WINDOWS.bat',
            'START=START_OVERALL_R2.bat',
            'STOP=STOP_OVERALL_R2.bat',
            'PYTHON=3.11',
            'SECRETS_INCLUDED=NO',
            'INTERNAL_DATA_INCLUDED=NO'
          )
          $manifest | Set-Content -Encoding utf8 (Join-Path $dist "CANDIDATE_MANIFEST.txt")

          $installDoc = @(
            'Overall R2 CPC1 - Windows',
            '=========================',
            '1. Install Python 3.11 x64.',
            '2. Extract this ZIP to a clean local directory.',
            '3. Run INSTALL_WINDOWS.bat.',
            '4. Run START_OVERALL_R2.bat.',
            '5. Open http://127.0.0.1:8080/p0/overall',
            '6. Run STOP_OVERALL_R2.bat to stop the exact process started by this package.',
            '',
            'The startup chain remains main.py knowledge-p1-start -> create_p0_app.',
            'No second Web host or port is introduced.',
            'Real Provider secrets and internal production data are not included.'
          )
          $installDoc | Set-Content -Encoding utf8 (Join-Path $dist "INSTALL_AND_START_WINDOWS.txt")

          $rollback = @(
            'ROLLBACK_BASELINE=927efef5b7707d5d2013a34c1f3f40a8ade3d93d',
            'ROLLBACK_PRIORITY=RESTORE_PREDEPLOY_BACKUP_FIRST',
            'ROLLBACK_SOURCE_RECONSTRUCTION=927_SOURCE_PLUS_MANIFEST_BOUND_PLC_SEED',
            'TARGET_ENV_ROLLBACK=NOT_RUN',
            'NOTE=Target deployment and target-machine rollback remain external release evidence before TSE/Release Decision.'
          )
          $rollback | Set-Content -Encoding utf8 (Join-Path $dist "ROLLBACK_BASELINE.txt")

          "PACKAGE_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_NAME=$pkgName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute packaged installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:PACKAGE_DIR
          cmd /c INSTALL_WINDOWS.bat
          if ($LASTEXITCODE -ne 0) { throw "PACKAGED_INSTALL_FAILED" }

      - name: Clean-directory candidate startup and route smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "r2-cpc1-smoke"
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          Copy-Item -Recurse -Force $env:PACKAGE_DIR $smoke
          Set-Location $smoke

          cmd /c START_OVERALL_R2.bat
          if ($LASTEXITCODE -ne 0) { throw "PACKAGED_START_FAILED" }

          try {
            $routes = @(
              "/p0/overall",
              "/api/v2/overall/assembly",
              "/p0/issues",
              "/p0/itr-recovery",
              "/p0/itr-resolution",
              "/p0/missed-test-analysis",
              "/p0/batch-analysis",
              "/analysis",
              "/p0/cases",
              "/p0/hardware-cases",
              "/p0/quality-scenario-insights",
              "/storage-workspace/"
            )
            $results = @()
            foreach ($route in $routes) {
              $response = Invoke-WebRequest -Uri ("http://127.0.0.1:8080" + $route) -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -ne 200) { throw ("ROUTE_FAILED:{0}:{1}" -f $route, $response.StatusCode) }
              $results += "$route=PASS"
            }
            $assembly = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/v2/overall/assembly" -TimeoutSec 15
            if (-not $assembly.all_ready -or $assembly.ready -ne 4) {
              throw "ASSEMBLY_NOT_READY:$($assembly.ready)/$($assembly.total)"
            }
            $results += "ASSEMBLY=4/4_READY"
            $results += "WINDOWS_CLEAN_PACKAGE_START=PASS"
            $results += "SOURCE=0cbfaac74b8e11ff29160abb796f75163b24855c"
            $results | Set-Content -Encoding utf8 (Join-Path $env:PACKAGE_DIR "WINDOWS_CANDIDATE_SMOKE_RESULT.txt")
          }
          finally {
            cmd /c STOP_OVERALL_R2.bat
          }

      - name: Reconstruct and smoke formal rollback baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rollbackRoot = Join-Path $env:RUNNER_TEMP "rollback-927"
          if (Test-Path $rollbackRoot) { Remove-Item -Recurse -Force $rollbackRoot }
          New-Item -ItemType Directory -Path $rollbackRoot | Out-Null
          git archive --format=zip --output="$env:RUNNER_TEMP\rollback-927.zip" 927efef5b7707d5d2013a34c1f3f40a8ade3d93d
          Expand-Archive -Path "$env:RUNNER_TEMP\rollback-927.zip" -DestinationPath $rollbackRoot

          Copy-Item -Force "quality_knowledge\config\plc_fields.yaml" (Join-Path $rollbackRoot "quality_knowledge\config\plc_fields.yaml")
          $expectedSeed = "443101e36d2c5b610bc62d130701ed7352175a12696bfc20fd9c5fe47fa411c3"
          $actualSeed = (Get-FileHash -Algorithm SHA256 (Join-Path $rollbackRoot "quality_knowledge\config\plc_fields.yaml")).Hash.ToLower()
          if ($actualSeed -ne $expectedSeed) { throw "ROLLBACK_SEED_BINDING_FAILED" }

          Set-Location $rollbackRoot
          New-Item -ItemType Directory -Force -Path "knowledge" | Out-Null
          python -c "from quality_knowledge.web import create_app; create_app(r'knowledge/quality_issue_v1.db')"
          $env:LEGACY_QUALITY_ISSUE_DB_PATH = (Resolve-Path "knowledge\quality_issue_v1.db").Path
          $stdout = Join-Path $env:RUNNER_TEMP "rollback-927.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "rollback-927.stderr.log"
          $proc = Start-Process -FilePath "python" -ArgumentList @("main.py","knowledge-p1-start","--db","knowledge\rollback_927.db","--host","127.0.0.1","--port","8081") -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($proc.HasExited) { break }
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8081/p0/issues" -UseBasicParsing -TimeoutSec 3
                if ($resp.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "ROLLBACK_927_RECONSTRUCTION_START_FAILED"
            }
            $overall = Invoke-WebRequest -Uri "http://127.0.0.1:8081/p0/overall" -UseBasicParsing -TimeoutSec 10
            if ($overall.StatusCode -ne 200) { throw "ROLLBACK_927_OVERALL_ROUTE_FAILED" }
          }
          finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

          @(
            "ROLLBACK_SOURCE=927efef5b7707d5d2013a34c1f3f40a8ade3d93d",
            "MANIFEST_BOUND_PLC_SEED_SHA256=$expectedSeed",
            "ROLLBACK_RECONSTRUCTION_SMOKE=PASS",
            "TARGET_ENV_ROLLBACK=NOT_RUN"
          ) | Set-Content -Encoding utf8 (Join-Path $env:PACKAGE_DIR "ROLLBACK_SMOKE_RESULT.txt")

      - name: Build integrity manifest and explicit ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:PACKAGE_DIR
          $files = Get-ChildItem -File -Recurse | Where-Object { $_.Name -ne "FILE_SHA256SUMS.txt" } | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            $rel = $file.FullName.Substring($env:PACKAGE_DIR.Length + 1).Replace([char]92,[char]47)
            "$hash  $rel"
          }
          $lines | Set-Content -Encoding ascii "FILE_SHA256SUMS.txt"

          $zip = Join-Path $env:RUNNER_TEMP ($env:PACKAGE_NAME + ".zip")
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $env:PACKAGE_DIR "*") -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$zipHash  $($env:PACKAGE_NAME).zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "PACKAGE_SHA256.txt")
          "PACKAGE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PACKAGE_SHA256=$zipHash"

      - name: Upload Complete Product Candidate
        uses: actions/upload-artifact@v4
        with:
          name: OVERALL_R2_CPC1_0CBFAAC_20260929
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ runner.temp }}/PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
