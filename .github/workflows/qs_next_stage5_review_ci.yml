name: QS Next Stage5 Review Audit

on:
  push:
    branches:
      - feature/qs-next-stage5-review-audit-20261011
  pull_request:
    paths:
      - 'quality_knowledge/qs_next_review.py'
      - 'quality_knowledge/qs_next_aggregation.py'
      - 'tests/test_qs_next_aggregation.py'
      - 'tests/test_qs_next_review.py'
      - 'quality_knowledge/qs_next_candidate_preview.py'
      - '.github/workflows/qs_next_stage5_review_ci.yml'

permissions:
  contents: read

jobs:
  stage5-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standalone web-test dependencies
        run: python -m pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - name: Compile candidate and review
        run: python -m compileall -q quality_knowledge/qs_next_review.py quality_knowledge/qs_next_candidate_preview.py tests/test_qs_next_review.py
      - name: Stage3 regression
        run: python -m unittest discover -s tests -p test_qs_next_gateway.py -v
      - name: Stage4 regression
        run: python -m unittest discover -s tests -p test_qs_next_candidate_preview.py -v
      - name: Stage5 human review/audit contract
        run: python -m unittest discover -s tests -p test_qs_next_review.py -v
      - name: Stage5 conservative multi-problem suggestion contract
        run: python -m unittest discover -s tests -p test_qs_next_aggregation.py -v
