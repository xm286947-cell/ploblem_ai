name: Storage Domain Skills Manual Validation Package

on:
  pull_request:
    branches:
      - integration/storage
    paths:
      - ".github/workflows/storage-domain-skills-validation-package.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_SOURCE_COMMIT: 771ebba32992d0bb93446a794ad6c487635a2fb7
      RUNTIME_SNAPSHOT_COMMIT: 023dc785cb06187acd2509f2304dcc1c18f2be09
      PYTHONPATH: \${{ github.workspace }}:\${{ github.workspace }}/products/storage_rc1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r products/storage_rc1/requirements.txt

      - name: Source regression
        run: |
          python -m pytest -q products/storage_rc1/tests/test_storage_domain_skills_real_knowledge.py
          python -m pytest -q products/storage_rc1/tests/test_storage_domain_skills_v01.py
          python -m pytest -q \
            products/storage_rc1/tests/test_storage_product_mvp_rc1.py \
            products/storage_rc1/tests/test_storage_rc1_r6_complete_assembly.py \
            tests/test_lifetime_engine.py \
            tests/test_runtime_observation_contract.py \
            tests/test_software_impact.py

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/_storage320
          mkdir -p dist/_storage320/STORAGE_PRODUCT_MVP_RC1
          PKG=dist/_storage320/STORAGE_PRODUCT_MVP_RC1

          cp -a products/storage_rc1/. "$PKG/"
          cp -a knowledge_production "$PKG/"
          cp -a repositories "$PKG/"
          cp -a parser "$PKG/"

          rm -rf /tmp/runtime320
          mkdir -p /tmp/runtime320
          git archive "$RUNTIME_SNAPSHOT_COMMIT" \
            runtime \
            config/runtime/model.yaml \
            tools/openai_mock/server.py \
            requirements-runtime-p0-test.txt \
            | tar -x -C /tmp/runtime320

          mkdir -p "$PKG/vendor/unified_agent_runtime/config/runtime"
          mkdir -p "$PKG/vendor/unified_agent_runtime/tools/openai_mock"
          cp -a /tmp/runtime320/runtime "$PKG/vendor/unified_agent_runtime/"
          cp /tmp/runtime320/config/runtime/model.yaml "$PKG/vendor/unified_agent_runtime/config/runtime/model.yaml"
          cp /tmp/runtime320/tools/openai_mock/server.py "$PKG/vendor/unified_agent_runtime/tools/openai_mock/server.py"
          cp /tmp/runtime320/requirements-runtime-p0-test.txt "$PKG/vendor/unified_agent_runtime/"
          printf '%s\n' "$RUNTIME_SNAPSHOT_COMMIT" > "$PKG/vendor/unified_agent_runtime/RUNTIME_COMMIT"

          cat > "$PKG/start_skill_validation.sh" <<'EOF'
          #!/usr/bin/env bash
          set -eu
          cd "$(dirname "$0")"
          export PYTHONPATH="$PWD:$PWD/vendor/unified_agent_runtime\${PYTHONPATH:+:$PYTHONPATH}"
          export STORAGE_WEB_HOST="\${STORAGE_WEB_HOST:-127.0.0.1}"
          export STORAGE_WEB_PORT="\${STORAGE_WEB_PORT:-8765}"
          echo "Storage Skill validation: http://127.0.0.1:$STORAGE_WEB_PORT"
          echo "Readiness: http://127.0.0.1:$STORAGE_WEB_PORT/api/product/skills/readiness"
          echo "Real Golden: http://127.0.0.1:$STORAGE_WEB_PORT/api/product/skills/real-golden"
          exec python -m uvicorn storage_life.app:app --host "$STORAGE_WEB_HOST" --port "$STORAGE_WEB_PORT"
          EOF
          sed -i 's/^          //' "$PKG/start_skill_validation.sh"
          chmod +x "$PKG/start_skill_validation.sh"

          cat > "$PKG/start_skill_validation.bat" <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "PYTHONPATH=%CD%;%CD%\vendor\unified_agent_runtime;%PYTHONPATH%"
          if "%STORAGE_WEB_HOST%"=="" set "STORAGE_WEB_HOST=127.0.0.1"
          if "%STORAGE_WEB_PORT%"=="" set "STORAGE_WEB_PORT=8765"
          echo Storage Skill validation: http://127.0.0.1:%STORAGE_WEB_PORT%
          echo Readiness: http://127.0.0.1:%STORAGE_WEB_PORT%/api/product/skills/readiness
          echo Real Golden: http://127.0.0.1:%STORAGE_WEB_PORT%/api/product/skills/real-golden
          python -m uvicorn storage_life.app:app --host %STORAGE_WEB_HOST% --port %STORAGE_WEB_PORT%
          EOF
          sed -i 's/^          //' "$PKG/start_skill_validation.bat"

          cat > "$PKG/VALIDATION_README.txt" <<EOF
          Storage Domain Skills / Real Knowledge Manual Validation Candidate

          PACKAGE_ID=STORAGE-DOMAIN-SKILLS-VALIDATION-771ebba32992
          PRODUCT_SOURCE_COMMIT=$PRODUCT_SOURCE_COMMIT
          RUNTIME_SNAPSHOT_COMMIT=$RUNTIME_SNAPSHOT_COMMIT
          TEST_SCOPE=#318/#320
          PRODUCT_GATE=NOT_CLAIMED
          RC_PASS=NOT_CLAIMED

          Windows:
            start_skill_validation.bat

          macOS/Linux:
            ./start_skill_validation.sh

          Open:
            http://127.0.0.1:8765/
            http://127.0.0.1:8765/api/product/skills/readiness
            http://127.0.0.1:8765/api/product/skills/real-golden

          Expected:
            formal_knowledge_object_count = 1
            PACK_WRITE_GOVERNANCE = BLOCKED
            PACK_LIFETIME_ENGINEERING = PARTIAL
            PACK_DIAGNOSTIC_VALIDATION = PARTIAL
            PACK_CHANGE_IMPACT = PARTIAL
            evidence_drilldown.status = PASS

          Evidence:
            Percentage Used
            -> KO-4ad47002b1ba4070fa499559
            -> EVD-98019c742313d72837696c0b
            -> NVME@2.0d
            -> NVM Express Base Specification 2.0d
            -> page 200 / SMART / Health
          EOF
          sed -i 's/^          //' "$PKG/VALIDATION_README.txt"

          cat > "$PKG/PACKAGE_MANIFEST.json" <<EOF
          {
            "package_id": "STORAGE-DOMAIN-SKILLS-VALIDATION-771ebba32992",
            "package_type": "MANUAL_VALIDATION_CANDIDATE",
            "issue": 320,
            "product_source_commit": "$PRODUCT_SOURCE_COMMIT",
            "runtime_snapshot_commit": "$RUNTIME_SNAPSHOT_COMMIT",
            "knowledge_release_version": "KP-STORAGE-RC1-VALIDATION-001",
            "test_scope": "#318/#320 domain skills and real knowledge readiness",
            "product_gate_pass": "NOT_CLAIMED",
            "rc_pass": "NOT_CLAIMED"
          }
          EOF
          sed -i 's/^          //' "$PKG/PACKAGE_MANIFEST.json"

          (
            cd "$PKG"
            find . -type f ! -name FILE_SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > FILE_SHA256SUMS.txt
          )

          ZIP=dist/STORAGE_DOMAIN_SKILLS_REAL_KNOWLEDGE_VALIDATION_771ebba32992.zip
          rm -f "$ZIP" "$ZIP.sha256" "$ZIP.DELIVERY_MANIFEST.json"
          (
            cd dist/_storage320
            zip -qr "../$(basename "$ZIP")" STORAGE_PRODUCT_MVP_RC1
          )
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          SIZE=$(stat -c%s "$ZIP")
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "$ZIP.sha256"
          cat > "$ZIP.DELIVERY_MANIFEST.json" <<EOF
          {
            "package_id": "STORAGE-DOMAIN-SKILLS-VALIDATION-771ebba32992",
            "package": "$(basename "$ZIP")",
            "product_source_commit": "$PRODUCT_SOURCE_COMMIT",
            "runtime_snapshot_commit": "$RUNTIME_SNAPSHOT_COMMIT",
            "package_sha256": "$SHA",
            "package_size": $SIZE,
            "fresh_extract_required": true,
            "manual_validation": true,
            "product_gate_pass": "NOT_CLAIMED",
            "rc_pass": "NOT_CLAIMED"
          }
          EOF
          sed -i 's/^          //' "$ZIP.DELIVERY_MANIFEST.json"
          echo "PACKAGE=$ZIP"
          echo "SHA256=$SHA"
          echo "SIZE=$SIZE"

      - name: Fresh extract smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/storage320
          mkdir -p /tmp/storage320
          unzip -q dist/STORAGE_DOMAIN_SKILLS_REAL_KNOWLEDGE_VALIDATION_771ebba32992.zip -d /tmp/storage320
          PKG=/tmp/storage320/STORAGE_PRODUCT_MVP_RC1

          test -f "$PKG/start_skill_validation.bat"
          test -f "$PKG/start_skill_validation.sh"
          test -f "$PKG/skills/real_knowledge.py"
          test -f "$PKG/storage_life/skill_api.py"

          export PYTHONPATH="$PKG:$PKG/vendor/unified_agent_runtime"
          cd "$PKG"
          python -m pytest -q \
            tests/test_storage_domain_skills_real_knowledge.py \
            tests/test_storage_domain_skills_v01.py

          ./start_skill_validation.sh >/tmp/storage320.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/health >/tmp/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ >/tmp/home.html
          curl -fsS http://127.0.0.1:8765/api/product/skills/readiness >/tmp/readiness.json
          curl -fsS http://127.0.0.1:8765/api/product/skills/real-golden >/tmp/golden.json

          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path("/tmp/health.json").read_text())
          ready=json.loads(Path("/tmp/readiness.json").read_text())
          golden=json.loads(Path("/tmp/golden.json").read_text())
          assert health["status"] == "ok"
          assert ready["formal_knowledge_object_count"] == 1
          assert ready["packs"]["PACK_WRITE_GOVERNANCE"]["status"] == "BLOCKED"
          assert ready["packs"]["PACK_LIFETIME_ENGINEERING"]["status"] == "PARTIAL"
          assert ready["packs"]["PACK_DIAGNOSTIC_VALIDATION"]["status"] == "PARTIAL"
          assert ready["packs"]["PACK_CHANGE_IMPACT"]["status"] == "PARTIAL"
          assert ready["evidence_drilldown"]["status"] == "PASS"
          assert golden["overall_status"] == "PARTIAL"
          assert golden["cases"]["RG02"]["evidence_refs"] == ["EVD-98019c742313d72837696c0b"]
          print("FRESH_EXTRACT_SKILL_API_SMOKE=PASS")
          PY

          echo "BROWSER_HOME_SMOKE=PASS"
          echo "SKILL_READINESS_API=PASS"
          echo "REAL_GOLDEN_API=PASS"
          echo "EVIDENCE_DRILLDOWN=PASS"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: storage-domain-skills-real-knowledge-validation
          path: |
            dist/STORAGE_DOMAIN_SKILLS_REAL_KNOWLEDGE_VALIDATION_771ebba32992.zip
            dist/STORAGE_DOMAIN_SKILLS_REAL_KNOWLEDGE_VALIDATION_771ebba32992.zip.sha256
            dist/STORAGE_DOMAIN_SKILLS_REAL_KNOWLEDGE_VALIDATION_771ebba32992.zip.DELIVERY_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
