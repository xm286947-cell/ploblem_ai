name: Storage R6 Canonical Full Gate

on:
  push:
    branches:
      - integration/storage-r6-canonical-consolidation-20260925
    paths:
      - ".github/workflows/storage-r6-canonical-full-gate.yml"
      - ".github/workflows/storage-r6-r1-macos-native-start.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonical-full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governance-only delta from recovered product source
        shell: bash
        run: |
          set -euo pipefail
          BASE=93deeb9fa7f354ebfad9129e3f537f751e4c3b6c
          git cat-file -e "$BASE^{commit}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "$CHANGED"
          UNEXPECTED="$(echo "$CHANGED"             | grep -v '^.github/workflows/storage-r6-r1-macos-native-start.yml$'             | grep -v '^.github/workflows/storage-r6-canonical-full-gate.yml$'             | sed '/^$/d' || true)"
          test -z "$UNEXPECTED"
          echo "PRODUCT_SOURCE_CHANGED=NO"
          echo "GOVERNANCE_ONLY_DELTA=PASS"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies for source-level gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r products/storage_rc1/requirements.txt
          python -m pip install pytest

      - name: Source-level R6 assembly and Knowledge gates
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/products/storage_rc1
          STORAGE_KNOWLEDGE_RELEASE_DIR: ${{ github.workspace }}/products/storage_rc1/knowledge_release/current
        run: |
          python -m pytest -q             products/storage_rc1/tests/test_storage_rc1_r6_f2_golden_a.py             products/storage_rc1/tests/test_ui_next_issue132.py             products/storage_rc1/tests/test_coverage_gate_next001.py             products/storage_rc1/tests/test_review_gate_next001.py             products/storage_rc1/tests/test_storage_rc1_r6_complete_assembly.py             products/storage_rc1/tests/test_storage_product_mvp_rc1.py             products/storage_rc1/tests/test_lifetime_profiles_p7.py             products/storage_rc1/tests/test_runtime_product_adapter.py             products/storage_rc1/tests/test_runtime_product_contract_rc2.py
          python -m pytest -q             tests/test_kp_m01_source_document.py             tests/test_kp_m02_candidate_evidence.py             tests/test_kp_m03_ai_extraction.py             tests/test_kp_d02_evaluation.py             tests/test_kp_d03_review_publish.py             tests/test_kp_d04_release_query.py             tests/test_kp_d05_processing_ui.py             tests/test_kp_d06_storage_golden.py
          echo "SOURCE_LEVEL_CANONICAL_GATES=PASS"

      - name: Download exact frozen R1 Product Test Candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/xm286947-cell/ploblem_ai/actions/artifacts/10858206332/zip"             -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_R1_20260925.zip

      - name: Verify SHA and fresh extract frozen R1
        run: |
          set -euo pipefail
          ZIP="$PWD/artifact/STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_R1_20260925.zip"
          EXPECTED=2c7e3024b94f8be7d7d39a34f6094882f16be159ee75a09c3ac4dba08711ba9a
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "EXPECTED_SHA256=$EXPECTED"
          echo "ACTUAL_SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/storage-r6-canonical-fresh
          mkdir -p /tmp/storage-r6-canonical-fresh
          unzip -q "$ZIP" -d /tmp/storage-r6-canonical-fresh
          PKG=/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1
          test -f "$PKG/vendor/unified_agent_runtime/RUNTIME_COMMIT"
          test "$(tr -d '\r\n ' < "$PKG/vendor/unified_agent_runtime/RUNTIME_COMMIT")" = "f9ca45f82960b3ce380273cf26868bc842a72b7f"
          test -f "$PKG/vendor/unified_agent_runtime/requirements-runtime-p0-test.txt"
          test -f "$PKG/vendor/unified_agent_runtime/config/runtime/model.yaml"
          test -f "$PKG/vendor/unified_agent_runtime/tools/openai_mock/server.py"
          echo "FROZEN_R1_SHA_AND_RUNTIME_VENDOR=PASS"

      - name: Install exact package dependencies
        run: |
          set -euo pipefail
          PKG=/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1
          python -m pip install -q -r "$PKG/requirements.txt"
          python -m pip install -q -r "$PKG/vendor/unified_agent_runtime/requirements-runtime-p0-test.txt"

      - name: Full Storage regression inside frozen R1 package
        run: |
          set -euo pipefail
          PKG=/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1
          export UNIFIED_AGENT_RUNTIME_ROOT="$PKG/vendor/unified_agent_runtime"
          export PYTHONPATH="$PKG:$PKG/vendor/unified_agent_runtime"
          export STORAGE_KNOWLEDGE_RELEASE_DIR="$PKG/knowledge_release/current"
          cd "$PKG"
          python -m pytest -q tests -k "not test_runtime_provider_trace_survives_gbk_console"
          echo "STORAGE_FULL_PACKAGE_REGRESSION_EXCEPT_RUNTIME_38=PASS"

      - name: Exercise known upstream Runtime #38 explicitly
        run: |
          set -euo pipefail
          PKG=/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1
          export UNIFIED_AGENT_RUNTIME_ROOT="$PKG/vendor/unified_agent_runtime"
          export PYTHONPATH="$PKG:$PKG/vendor/unified_agent_runtime"
          cd "$PKG"
          set +e
          python -m pytest -q tests/test_hotfix_gbk_utf8_p1.py::test_runtime_provider_trace_survives_gbk_console             > /tmp/runtime38.log 2>&1
          RC=$?
          set -e
          cat /tmp/runtime38.log
          if [ "$RC" -eq 0 ]; then
            echo "KNOWN_EXCEPTION_RUNTIME_38=RESOLVED"
          else
            grep -F "UnicodeEncodeError" /tmp/runtime38.log
            echo "KNOWN_EXCEPTION_RUNTIME_38=CONFIRMED"
            echo "KNOWN_EXCEPTION=RUNTIME#38"
          fi

      - name: Frozen R1 Package Recovery Gate
        run: |
          set -euo pipefail
          PKG=/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1
          export UNIFIED_AGENT_RUNTIME_ROOT="$PKG/vendor/unified_agent_runtime"
          export PYTHONPATH="$PKG:$PKG/vendor/unified_agent_runtime"
          export STORAGE_KNOWLEDGE_RELEASE_DIR="$PKG/knowledge_release/current"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("/tmp/storage-r6-canonical-fresh/STORAGE_PRODUCT_MVP_RC1")
          for line in (root/"FILE_SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              expected, rel = line.split("  ", 1)
              path = root / rel
              assert path.is_file(), rel
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, rel
          print("PACKAGE_INTEGRITY=PASS")
          PY
          cd "$PKG"
          python scripts/preflight.py --runtime-root "$UNIFIED_AGENT_RUNTIME_ROOT" --mode mock
          bash selfcheck.sh
          python - <<'PY'
          from fastapi.testclient import TestClient
          from storage_life.app import app
          c=TestClient(app)
          assert c.get("/api/health").status_code == 200
          r=c.get("/api/product/knowledge/status")
          assert r.status_code == 200, r.text
          body=r.json()
          assert body["available"] is True, body
          assert body["status"] == "READY", body
          print("FRESH_EXTRACT=PASS")
          print("SELFCHECK=PASS")
          print("PREFLIGHT=PASS")
          print("KNOWLEDGE_STATUS=READY")
          PY

      - name: Canonical Gate Result
        run: |
          echo "TASK=STORAGE-RC1-R6-CANONICAL-FULL-GATE-001"
          echo "CANONICAL_COMMIT=$(git rev-parse HEAD)"
          echo "PRODUCT_SOURCE_BASE=93deeb9fa7f354ebfad9129e3f537f751e4c3b6c"
          echo "FROZEN_R1_SHA256=2c7e3024b94f8be7d7d39a34f6094882f16be159ee75a09c3ac4dba08711ba9a"
          echo "SOURCE_LEVEL_CANONICAL_GATES=PASS"
          echo "STORAGE_FULL_PACKAGE_REGRESSION_EXCEPT_RUNTIME_38=PASS"
          echo "PACKAGE_RECOVERY_GATE=PASS"
          echo "KNOWN_EXCEPTION=RUNTIME#38"
          echo "VALID_FIX_LOST=0"
          echo "RESULT=PASS_WITH_KNOWN_UPSTREAM_EXCEPTION"
          echo "BASELINE_SNAPSHOT=ALLOWED"
