name: Overall R2 W5 Agent Runtime Gate

on:
  pull_request:
    branches: [integration/overall-r2]
    paths:
      - "quality_knowledge/web/overall_runtime_control.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/overall_shell.py"
      - "quality_knowledge/web/templates/overall_agent_config.html"
      - "quality_knowledge/web/templates/overall_runtime_diagnostics.html"
      - "quality_knowledge/web/templates/p0_base.html"
      - "products/storage_rc1/storage_life/product_api.py"
      - "scripts/overall_r2_windows_start.py"
      - "tests/test_r2_w5_agent_config_runtime_diagnostics.py"
      - "docs/product/R2_W5_AGENT_CONFIG_RUNTIME_DIAGNOSTICS_CONTRACT_V1.md"
      - ".github/workflows/overall-r2-w5-agent-runtime-gate.yml"
  workflow_dispatch:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: W5 capability and Runtime boundary regression
        run: >-
          python -m pytest -q --noconftest
          tests/test_r2_w5_agent_config_runtime_diagnostics.py
          tests/test_runtime_request_secret_persistence.py
          tests/compatibility/test_runtime_four_domain_binding.py
      - name: W1-W4 frozen regression
        run: >-
          python -m pytest -q --noconftest
          tests/test_r2_w1_*.py
          tests/test_r2_w2_*.py
          tests/test_r2_w3_*.py
          tests/test_r2_w4_*.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: W5 common control-plane smoke
        shell: cmd
        run: >-
          python -m pytest -q --noconftest
          tests\test_r2_w5_agent_config_runtime_diagnostics.py
          tests\test_r2_w4_storage_direct_reuse.py
