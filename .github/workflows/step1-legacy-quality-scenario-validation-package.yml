name: STEP1 Legacy Quality Scenario Validation Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/scenario*.py"
      - "quality_knowledge/quality_models.py"
      - "quality_knowledge/reverse_quality_scenario_adapter.py"
      - "quality_knowledge/web/app.py"
      - "quality_knowledge/web/scenario_asset_pages.py"
      - "quality_knowledge/web/templates/quality_scenario*.html"
      - "quality_knowledge/web/templates/scenario_*.html"
      - "start_quality_capability_p1.bat"
      - "INSTALL_OVERALL_R2_WINDOWS.bat"
      - ".github/workflows/step1-legacy-quality-scenario-validation-package.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact-source STEP1 validation ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,12)
          $root = "STEP1_LEGACY_QUALITY_SCENARIO_VALIDATION_$short"
          $dist = Join-Path $PWD "dist-step1"
          $stage = Join-Path $dist $root
          New-Item -ItemType Directory -Force $stage | Out-Null
          git archive --format=zip -o (Join-Path $dist "source.zip") HEAD
          Expand-Archive -Path (Join-Path $dist "source.zip") -DestinationPath $stage
          Remove-Item (Join-Path $dist "source.zip") -Force

          @"
STEP1 Legacy Quality Scenario / Portrait Manual Validation

SOURCE_SHA=$sha
ISSUE=#299
PR=#301
CANDIDATE_CLASS=STEP1_MANUAL_VALIDATION
FORMAL_W6_FINAL_CANDIDATE=NO
PRODUCT_TEST_GATE=NOT_INHERITED

1. Double-click INSTALL_OVERALL_R2_WINDOWS.bat once.
2. Bind the EXISTING legacy DB in the same cmd window:
   set "LEGACY_QUALITY_ISSUE_DB_PATH=C:\path\to\your\existing\quality_issue_v1.db"
   Do NOT copy or modify the real DB into this package.
3. Start ONLY with:
   start_quality_capability_p1.bat
4. Open:
   http://127.0.0.1:8080/quality-scenarios
   http://127.0.0.1:8080/quality-scenario-assets
   http://127.0.0.1:8080/quality-scenario-assets/portrait
5. Verify real historical data, filters, detail drill-down, and customer/industry portrait.
6. Regression-check:
   http://127.0.0.1:8080/issues
   http://127.0.0.1:8080/analysis
   http://127.0.0.1:8080/import

Do NOT use START_OVERALL_R2_WINDOWS.bat for STEP1 acceptance.
Do NOT treat /p0/quality-scenario-insights as a substitute for the mature legacy pages.
"@ | Set-Content -Encoding utf8 (Join-Path $stage "STEP1_START_HERE.txt")

          "$sha" | Set-Content -Encoding ascii (Join-Path $stage "STEP1_SOURCE_COMMIT")
          $zip = Join-Path $dist ($root + ".zip")
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "STEP1_PACKAGE=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STEP1_PACKAGE_NAME=$($root).zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STEP1_SOURCE_SHA=$sha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STEP1_PACKAGE_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SOURCE_SHA=$sha"
          Write-Host "PACKAGE_SHA256=$hash"

      - name: Verify exact source and required legacy entry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verify = Join-Path $env:RUNNER_TEMP "step1-verify"
          Expand-Archive -Path $env:STEP1_PACKAGE -DestinationPath $verify
          $root = Get-ChildItem $verify -Directory | Select-Object -First 1
          $inside = (Get-Content -Raw (Join-Path $root.FullName "STEP1_SOURCE_COMMIT")).Trim()
          if ($inside -ne $env:STEP1_SOURCE_SHA) { throw "SOURCE_BINDING_MISMATCH" }
          foreach ($required in @(
            "INSTALL_OVERALL_R2_WINDOWS.bat",
            "start_quality_capability_p1.bat",
            "quality_knowledge\scenarios.py",
            "quality_knowledge\web\scenario_asset_pages.py",
            "quality_knowledge\web\templates\quality_scenarios.html",
            "quality_knowledge\web\templates\scenario_asset_overview.html",
            "quality_knowledge\web\templates\scenario_customer_portrait.html",
            "STEP1_START_HERE.txt"
          )) {
            if (!(Test-Path (Join-Path $root.FullName $required))) { throw "MISSING:$required" }
          }
          Write-Host "STEP1_PACKAGE_CONTRACT=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: STEP1_LEGACY_QUALITY_SCENARIO_VALIDATION
          path: ${{ env.STEP1_PACKAGE }}
          if-no-files-found: error
          retention-days: 14
