name: QS Fast MVP W2 Gate

on:
  push:
    branches:
      - feature/quality-scenario-fast-mvp-v1
    paths:
      - "quality_knowledge/reverse_quality*.py"
      - "quality_knowledge/scenario_source_bundle_v1.py"
      - "quality_knowledge/scenario_generation.py"
      - "quality_knowledge/scenario_sources.py"
      - "config/runtime/agents/reverse_quality.single_issue.analyze.yaml"
      - "prompts/runtime/reverse_quality/**"
      - "tests/test_scenario_source_bundle_v1.py"
      - "tests/test_reverse_quality_store.py"
      - "tests/test_reverse_quality_runtime_integration.py"
      - ".github/workflows/quality-scenario-fast-mvp-w2.yml"
  pull_request:
    paths:
      - "quality_knowledge/reverse_quality*.py"
      - "quality_knowledge/scenario_source_bundle_v1.py"
      - "quality_knowledge/scenario_generation.py"
      - "quality_knowledge/scenario_sources.py"
      - "config/runtime/agents/reverse_quality.single_issue.analyze.yaml"
      - "prompts/runtime/reverse_quality/**"
      - "tests/test_scenario_source_bundle_v1.py"
      - "tests/test_reverse_quality_store.py"
      - "tests/test_reverse_quality_runtime_integration.py"
      - ".github/workflows/quality-scenario-fast-mvp-w2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w2-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Run W2 focused acceptance
        run: |
          python -m pytest -q \
            tests/test_scenario_source_bundle_v1.py \
            tests/test_reverse_quality_store.py \
            tests/test_reverse_quality_runtime_integration.py

  w2-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Run mature QSV1 regression
        run: |
          python -m pytest -q \
            tests/test_r2_w2_qsv1_production_chain.py \
            tests/test_step1b_qsv1_mature_preview.py
