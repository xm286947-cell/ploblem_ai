name: Hardware Case Release Prep

on:
  pull_request:
    paths:
      - "scripts/build_hardware_case_mvp_package.py"
      - "scripts/hardware_case_mvp_smoke.py"
      - "run_hardware_case_mvp_smoke.bat"
      - "run_hardware_case_mvp_smoke.sh"
      - "docs/product/HARDWARE_CASE_MVP_RC0_PREP.md"
      - ".github/workflows/hardware-case-release-prep.yml"
      - "quality_knowledge/**"
      - "repositories/hardware_case_repository.py"
      - "services/hardware_case_*.py"
  workflow_dispatch:

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package smoke dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Build RC0 PREP package
        run: python scripts/build_hardware_case_mvp_package.py
      - name: Verify manifest is non-release and sanitized
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stage = Path("dist/HARDWARE_CASE_MVP_RC0_PREP")
          manifest = json.loads((stage / "PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["release_status"] == "PREP_ONLY_NOT_MVP_RELEASE"
          paths = [item["path"] for item in manifest["files"]]
          forbidden_suffixes = {".db", ".sqlite", ".sqlite3", ".log"}
          assert not any(Path(path).suffix.lower() in forbidden_suffixes for path in paths)
          assert not any(Path(path).name.lower() in {".env", ".env.local"} for path in paths)
          assert "HIFI_PRODUCT_GATE_PASS" in manifest["release_blockers"]
          assert "20_TO_30_REAL_CASE_MVP_INTEGRATION_GATE_PASS" in manifest["release_blockers"]
          print("MANIFEST=PASS")
          PY
      - name: Run smoke from staged package
        working-directory: dist/HARDWARE_CASE_MVP_RC0_PREP
        run: python scripts/hardware_case_mvp_smoke.py
      - name: Run Hardware Case regression
        run: python -m pytest -q --noconftest tests/test_hardware_case_contract.py tests/test_hardware_case_backend.py tests/test_hardware_case_ai_adapter.py tests/test_hardware_case_web_api.py tests/test_hardware_case_product_api_e2e.py
