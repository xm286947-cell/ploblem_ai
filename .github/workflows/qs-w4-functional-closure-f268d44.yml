        },
        {
          "name": "Build full current quality platform",
          "shell": "bash",
          "run": "set -euo pipefail\nSTAGE=\"$RUNNER_TEMP/w4-final\"\nrm -rf \"$STAGE\"; mkdir -p \"$STAGE\" dist\ngit archive \"$PRODUCT_SOURCE_SHA\" | tar -x -C \"$STAGE\"\nmkdir -p \"$STAGE/validation\"\ncp validation/quality_scenario_w4_fixture.db \"$STAGE/validation/\"\ncp validation/quality_scenario_w4_fixture.db.fixture.json \"$STAGE/validation/\"\ncp validation/fixture_build.txt \"$STAGE/validation/\"\ncp validation/fixture_preflight.txt \"$STAGE/validation/\"\npython -c \"from pathlib import Path; import os; Path('$STAGE/PRODUCT_SOURCE_SHA').write_text(os.environ['PRODUCT_SOURCE_SHA']+'\\\\n')\"\npython -c \"from pathlib import Path; import os,json; m={'package_type':'W4_MAC_FUNCTIONAL_GOLDEN_CANDIDATE','package_scope':'FULL_CURRENT_QUALITY_PLATFORM','source_sha':os.environ['PRODUCT_SOURCE_SHA'],'synthetic_business_data':True,'fixture_itr_source_count':5,'canonical_macos_entry':'start_w4_mac_functional_golden.command','functional_provider':'CONTROLLED_OPENAI_MOCK','provider_owned_by_canonical_launcher':True,'g1_complete_source':True,'g2_no_missed_test':True,'g3_conflict_fail_closed':True,'g4_idempotency':True,'g5_source_revision_control':'advance_w4_g5_source_revision.command','direct_qsv1_candidate_write':False,'direct_qsv1_publish_write':False,'real_provider_golden':False,'native_browser_golden':False}; Path('$STAGE/FULL_PLATFORM_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))\"\npython -c \"from pathlib import Path; import os; t='QUALITY PLATFORM W4 MAC FUNCTIONAL GOLDEN\\\\n\\\\nSOURCE_SHA='+os.environ['PRODUCT_SOURCE_SHA']+'\\\\nCANONICAL_ENTRY=./start_w4_mac_functional_golden.command --port 18080\\\\nFUNCTIONAL_PROVIDER=CONTROLLED_OPENAI_MOCK\\\\nPROVIDER_STARTED_BY_CANONICAL_ENTRY=YES\\\\nG5_ADVANCE=./advance_w4_g5_source_revision.command\\\\nDIRECT_QSV1_CANDIDATE_WRITE=NO\\\\nDIRECT_QSV1_PUBLISH_WRITE=NO\\\\nREAL_PROVIDER_GOLDEN=NO\\\\n'; Path('$STAGE/00_README_FIRST.txt').write_text(t,encoding='utf-8')\"\ntest -x \"$STAGE/start_w4_mac_functional_golden.command\"\ntest -x \"$STAGE/start_w4_mac_functional_provider_golden.command\"\ntest -x \"$STAGE/advance_w4_g5_source_revision.command\"\ntest -f \"$STAGE/config/runtime/model.w4-functional.yaml\"\ntest -f \"$STAGE/validation/quality_scenario_w4_fixture.db\"\n(cd \"$STAGE\" && zip -q -r \"$GITHUB_WORKSPACE/dist/${PACKAGE_BASENAME}.zip\" .)\nsha256sum \"dist/${PACKAGE_BASENAME}.zip\" | tee \"dist/${PACKAGE_BASENAME}.zip.sha256\""
