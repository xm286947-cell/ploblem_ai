name: Overall R2 W6 Evidence Only Gate

on:
  pull_request:
    branches: [integration/overall-r2]
    paths:
      - ".github/workflows/overall-r2-w6-evidence-only.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FINAL_R2_SOURCE: 56a47467a0aa2ca403d0230ca4d3d2c9255f6373
  PYTHONPATH: .

jobs:
  source-freeze-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen R2 source
        uses: actions/checkout@v4
        with:
          ref: 56a47467a0aa2ca403d0230ca4d3d2c9255f6373
          fetch-depth: 0

      - name: Verify frozen source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "FINAL_R2_SOURCE_EXPECTED=$FINAL_R2_SOURCE"
          echo "FINAL_R2_SOURCE_ACTUAL=$actual"
          test "$actual" = "$FINAL_R2_SOURCE"
          echo "FINAL_SOURCE_FREEZE_GUARD=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Common Evidence and Return compatibility
        run: >-
          python -m pytest -q
          tests/test_r2_w2_return_context.py
          tests/test_r2_w3_common_evidence.py
          tests/test_historical_case_consumer_contract.py
          tests/test_major_knowledge_publication_contract.py
          tests/test_hardware_case_evidence_source.py

      - name: Legacy Scenario Portrait protection
        run: >-
          python -m pytest -q
          tests/test_overall_legacy_capability_compatibility.py
          tests/test_r2_w2_legacy_scenario_compat.py
          tests/test_quality_scenario_workspace_binding.py
          tests/test_p04_quality_scenario_insight.py
          tests/test_p04_portrait_archive.py
