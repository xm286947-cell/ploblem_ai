name: Hardware UED Native Chrome Mock

on:
  pull_request:
    paths:
      - "quality_knowledge/web/templates/_hardware_case_nav.html"
      - "quality_knowledge/web/templates/hardware_case_*.html"
      - "quality_knowledge/web/templates/p0_base.html"
      - "quality_knowledge/web/static/hardware_case_ued.*"
      - "quality_knowledge/web/static/hardware_case_knowledge_consumption.js"
      - "scripts/hardware_ued_browser_mock.py"
      - ".github/workflows/hardware-ued-browser-mock.yml"
  workflow_dispatch:

jobs:
  chrome-mock:
    name: actual-fastapi-chrome-mock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chinese font for faithful UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -q 'Noto Sans CJK'
      - name: Install isolated web test requirements
        run: |
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
          python -m pip install "playwright==1.55.0"
          python -m playwright install chromium
      - name: Start real product and run Chrome Mock paths
        env:
          HARDWARE_QUERY_AGENT_ENABLED: "0"
          HARDWARE_CONSUMPTION_AGENT_ENABLED: "0"
        run: |
          python scripts/hardware_ued_browser_mock.py --out "${{ runner.temp }}/hardware_ued"
      - name: Upload Mock UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-ued-native-page-mock
          path: ${{ runner.temp }}/hardware_ued/
          if-no-files-found: warn
          retention-days: 7
