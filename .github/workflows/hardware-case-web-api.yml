name: Hardware Case Web API Integration

on:
  pull_request:
    paths:
      - "quality_knowledge/web/hardware_case_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "tests/test_hardware_case_web_api.py"
      - "repositories/hardware_case_repository.py"
      - "services/hardware_case_backend.py"
      - "services/hardware_case_contract.py"
      - ".github/workflows/hardware-case-web-api.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install "pytest>=8,<9" "fastapi>=0.115,<1" "httpx>=0.27,<1" "jinja2>=3.1,<4" "python-multipart>=0.0.9" "openpyxl>=3.1,<4" "PyYAML>=6,<7"
      - name: Run Hardware Case API tests
        run: python -m pytest -q --noconftest tests/test_hardware_case_web_api.py
      - name: Run Hardware Case M1 M2 M4 regression
        run: python -m pip install "jsonschema>=4.21,<5" && python -m pytest -q --noconftest tests/test_hardware_case_contract.py tests/test_hardware_case_backend.py tests/test_hardware_case_ai_adapter.py
