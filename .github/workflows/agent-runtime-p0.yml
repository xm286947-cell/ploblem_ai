name: Agent Runtime P0

on:
  push:
    branches:
      - feature/agent-runtime-p0
    paths:
      - "runtime/**"
      - "tests/test_agent_runtime_p0_*.py"
      - ".github/workflows/agent-runtime-p0.yml"
      - "requirements-runtime-p0-test.txt"
  pull_request:
    branches:
      - main
    paths:
      - "runtime/**"
      - "tests/test_agent_runtime_p0_*.py"
      - ".github/workflows/agent-runtime-p0.yml"
      - "requirements-runtime-p0-test.txt"
  workflow_dispatch:

jobs:
  test-runtime-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime-p0-test.txt

      - name: Run Runtime P0 D1-D11 final acceptance
        run: python -m pytest tests/test_agent_runtime_p0_d1_d2.py tests/test_agent_runtime_p0_d3.py tests/test_agent_runtime_p0_d4.py tests/test_agent_runtime_p0_d5.py tests/test_agent_runtime_p0_d6.py tests/test_agent_runtime_p0_d7.py tests/test_agent_runtime_p0_d8.py tests/test_agent_runtime_p0_d9.py tests/test_agent_runtime_p0_d10.py tests/test_agent_runtime_p0_d11_acceptance_gaps.py tests/test_agent_runtime_p0_merge_blockers.py -q
