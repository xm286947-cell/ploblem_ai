name: Agent Runtime P0

on:
  push:
    branches:
      - feature/agent-runtime-p0
    paths:
      - "runtime/**"
      - "tests/test_agent_runtime_p0_*.py"
      - ".github/workflows/agent-runtime-p0.yml"
  pull_request:
    branches:
      - main
    paths:
      - "runtime/**"
      - "tests/test_agent_runtime_p0_*.py"
      - ".github/workflows/agent-runtime-p0.yml"
  workflow_dispatch:

jobs:
  test-runtime-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip "pytest>=8,<9" "pydantic>=2.7,<3"

      - name: Run Runtime P0 D1-D5 tests
        run: python -m pytest tests/test_agent_runtime_p0_d1_d2.py tests/test_agent_runtime_p0_d3.py tests/test_agent_runtime_p0_d4.py tests/test_agent_runtime_p0_d5.py -q
