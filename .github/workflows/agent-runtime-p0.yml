name: Agent Runtime P0

on:
  push:
    branches:
      - feature/agent-runtime-p0
      - feature/agent-config-001
      - fix/runtime-secret-persistence
      - integration/storage-runtime-acceptance
      - feature/openai-mock-v0.1
    paths:
      - "runtime/**"
      - "storage_e2e/**"
      - "tools/openai_mock/**"
      - "tests/test_agent_runtime_p0_*.py"
      - "tests/test_runtime_request_secret_persistence.py"
      - "tests/test_openai_mock*.py"
      - ".github/workflows/agent-runtime-p0.yml"
      - "requirements-runtime-p0-test.txt"
      - "requirements-openai-mock-test.txt"
  pull_request:
    branches:
      - main
      - feature/agent-config-001
    paths:
      - "runtime/**"
      - "storage_e2e/**"
      - "tools/openai_mock/**"
      - "tests/test_agent_runtime_p0_*.py"
      - "tests/test_runtime_request_secret_persistence.py"
      - "tests/test_openai_mock*.py"
      - ".github/workflows/agent-runtime-p0.yml"
      - "requirements-runtime-p0-test.txt"
      - "requirements-openai-mock-test.txt"
  workflow_dispatch:

jobs:
  test-runtime-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime-p0-test.txt

      - name: Run Runtime P0 + Storage integration acceptance
        run: python -m pytest tests/test_agent_runtime_p0_d1_d2.py tests/test_agent_runtime_p0_d3.py tests/test_agent_runtime_p0_d4.py tests/test_agent_runtime_p0_d5.py tests/test_agent_runtime_p0_d6.py tests/test_agent_runtime_p0_d7.py tests/test_agent_runtime_p0_d8.py tests/test_agent_runtime_p0_d9.py tests/test_agent_runtime_p0_d10.py tests/test_agent_runtime_p0_d11_acceptance_gaps.py tests/test_agent_runtime_p0_merge_blockers.py tests/test_agent_runtime_p0_agent_config.py tests/test_runtime_request_secret_persistence.py tests/test_agent_runtime_p0_storage_e2e_json_truncation.py -q

  test-openai-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI Mock test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-openai-mock-test.txt

      - name: Run OpenAI Mock HTTP + official Python SDK compatibility gates
        run: python -m pytest tests/test_openai_mock_server.py tests/test_openai_mock_sdk_compat.py -q
