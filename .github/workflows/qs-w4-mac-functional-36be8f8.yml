name: QS W4 macOS Functional Golden 36be8f8

on:
  push:
    branches:
      - ci/qs-w4-mac-functional-36be8f8
    paths:
      - ".github/workflows/qs-w4-mac-functional-36be8f8.yml"

permissions:
  contents: read

env:
  PRODUCT_SOURCE_SHA: 36be8f89a10c9f6f58d5ce4965ce12026617c3c3
  PACKAGE_BASENAME: QUALITY_PLATFORM_W4_MAC_FUNCTIONAL_GOLDEN_36be8f89a10c

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36be8f89a10c9f6f58d5ce4965ce12026617c3c3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          git diff --check "$PRODUCT_SOURCE_SHA^..$PRODUCT_SOURCE_SHA"
      - name: Run focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_quality_scenario_w4_functional_fixture.py tests/test_qsv1_portrait_consumption.py tests/test_software_assessment_qsv1_browser_flow.py tests/test_r2_w2_qsv1_production_chain.py tests/test_step1b_qsv1_mature_preview.py
      - name: Build controlled Source-Fact fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          python tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db | tee validation/fixture_build.txt
          grep -q "W4_FUNCTIONAL_FIXTURE=READY" validation/fixture_build.txt
          grep -q "DIRECT_QSV1_CANDIDATE_WRITE=NO" validation/fixture_build.txt
          grep -q "DIRECT_QSV1_PUBLISH_WRITE=NO" validation/fixture_build.txt
          python tools/quality_scenario_real_data_preflight.py --db validation/quality_scenario_w4_fixture.db --require | tee validation/fixture_preflight.txt
          grep -q "REAL_DATA_PREFLIGHT=PASS" validation/fixture_preflight.txt
      - name: Fixture host integration smoke
        shell: bash
        run: |
          set -euo pipefail
          export LEGACY_QUALITY_ISSUE_DB_PATH="$PWD/validation/quality_scenario_w4_fixture.db"
          export QUALITY_SCENARIO_V1_DB_PATH="$LEGACY_QUALITY_ISSUE_DB_PATH"
          python main.py knowledge-web --db "$LEGACY_QUALITY_ISSUE_DB_PATH" --port 18082 > validation/fixture_host.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python -c "import time,urllib.request; base='http://127.0.0.1:18082'; ok=False
for _ in range(60):
    try:
        urllib.request.urlopen(base+'/software-assessment',timeout=1); ok=True; break
    except Exception: time.sleep(.25)
assert ok, 'HOST_NOT_READY'
paths=['/software-assessment','/p0/quality-scenarios/workbench','/p0/quality-scenarios','/quality-scenario-assets/portrait?portrait_axis=product','/quality-scenario-assets/portrait?portrait_axis=industry','/quality-scenario-assets/portrait?portrait_axis=customer','/p0/quality-scenario-insights']
for p in paths:
    assert urllib.request.urlopen(base+p,timeout=3).status==200,p
html=urllib.request.urlopen(base+'/software-assessment',timeout=3).read().decode('utf-8')
for marker in ['异常掉电后关键配方参数丢失','通信链路波动后设备重连超时','升级后部分历史工程无法正常加载','高频写入后诊断日志占满存储空间','长时间运行后任务调度抖动导致周期超时']:
    assert marker in html,marker
p04=urllib.request.urlopen(base+'/p0/quality-scenario-insights',timeout=3).read().decode('utf-8')
assert 'href=\"/issues\">返回问题工作台</a>' in p04
assert 'href=\"/p0/overall\">返回总体工作台</a>' not in p04
print('FIXTURE_HOST_INTEGRATION=PASS')"
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/w4-mac-functional"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          git archive "$PRODUCT_SOURCE_SHA" | tar -x -C "$STAGE"
          mkdir -p "$STAGE/validation"
          cp validation/quality_scenario_w4_fixture.db "$STAGE/validation/"
          cp validation/quality_scenario_w4_fixture.db.fixture.json "$STAGE/validation/"
          cp validation/fixture_build.txt "$STAGE/validation/"
          cp validation/fixture_preflight.txt "$STAGE/validation/"
          python -c "from pathlib import Path; import os; p=Path('$STAGE'); p.joinpath('PRODUCT_SOURCE_SHA').write_text(os.environ['PRODUCT_SOURCE_SHA']+'\n',encoding='utf-8')"
          python -c "from pathlib import Path; import os,json; p=Path('$STAGE'); m={'package_type':'W4_MAC_FUNCTIONAL_GOLDEN_CANDIDATE','package_scope':'FULL_CURRENT_QUALITY_PLATFORM','source_sha':os.environ['PRODUCT_SOURCE_SHA'],'test_fixture_included':True,'synthetic_business_data':True,'direct_qsv1_candidate_write':False,'direct_qsv1_publish_write':False,'real_mature_data_golden':False,'real_mature_data_compatibility':'DEFERRED','macos_entry':'start_w4_mac_functional_golden.command'}; p.joinpath('FULL_PLATFORM_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')"
          python -c "from pathlib import Path; import os; p=Path('$STAGE'); p.joinpath('00_W4_MAC_FUNCTIONAL_README_FIRST.txt').write_text('QUALITY PLATFORM W4 MAC FUNCTIONAL GOLDEN CANDIDATE\n\nSOURCE_SHA='+os.environ['PRODUCT_SOURCE_SHA']+'\nTEST_FIXTURE_INCLUDED=YES\nSYNTHETIC_BUSINESS_DATA=YES\nDIRECT_QSV1_CANDIDATE_WRITE=NO\nDIRECT_QSV1_PUBLISH_WRITE=NO\nREAL_MATURE_DATA_GOLDEN=NO\nREAL_MATURE_DATA_COMPATIBILITY=DEFERRED\n\nmacOS: ./start_w4_mac_functional_golden.command --port 18080\n\nG5 source revision: ./.venv/bin/python tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db --advance-g5\n',encoding='utf-8')"
          test -x "$STAGE/start_w4_mac_functional_golden.command"
          test -f "$STAGE/validation/quality_scenario_w4_fixture.db"
          (
            cd "$STAGE"
            zip -q -r "$GITHUB_WORKSPACE/dist/${PACKAGE_BASENAME}.zip" .
          )
          sha256sum "dist/${PACKAGE_BASENAME}.zip" | tee "dist/${PACKAGE_BASENAME}.zip.sha256"
      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,os,pathlib,zipfile; p=pathlib.Path('dist')/(os.environ['PACKAGE_BASENAME']+'.zip'); z=zipfile.ZipFile(p); m=json.loads(z.read('FULL_PLATFORM_MANIFEST.json')); assert z.read('PRODUCT_SOURCE_SHA').decode().strip()==os.environ['PRODUCT_SOURCE_SHA']; assert m['test_fixture_included'] is True; assert m['direct_qsv1_candidate_write'] is False; assert m['direct_qsv1_publish_write'] is False; assert m['real_mature_data_golden'] is False; assert 'validation/quality_scenario_w4_fixture.db' in z.namelist(); assert 'start_w4_mac_functional_golden.command' in z.namelist(); print('MAC_FUNCTIONAL_PACKAGE_IDENTITY=PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: QUALITY_PLATFORM_W4_MAC_FUNCTIONAL_GOLDEN_36be8f89a10c
          path: |
            dist/QUALITY_PLATFORM_W4_MAC_FUNCTIONAL_GOLDEN_36be8f89a10c.zip
            dist/QUALITY_PLATFORM_W4_MAC_FUNCTIONAL_GOLDEN_36be8f89a10c.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36be8f89a10c9f6f58d5ce4965ce12026617c3c3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native launcher smoke
        shell: bash
        run: python tools/step1b_qsv1_launcher_smoke.py --platform macos --port 18081
