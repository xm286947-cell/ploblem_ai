name: Hardware W3 W2 Legacy Word Import Fail Code Diagnosis
on:
  pull_request:
    paths:
      - ".github/workflows/hardware-w3-w2-legacy-import-diagnose.yml"
      - "scripts/w3_w2_legacy_import_diagnose.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w2-word-http-400:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: c7935e00f1f0abe828b0090524bb14ba923f3635
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen dependencies
        run: python -m pip install -r product/requirements.txt -r product/requirements-runtime-p0-test.txt
      - name: Replay test's own Word fixture under isolated data root without provider
        env:
          PYTHONPATH: product
        run: python support/scripts/w3_w2_legacy_import_diagnose.py product
