name: Hardware W3.2 Data Reliability

on:
  pull_request:
    paths:
      - ".github/workflows/hardware-w3-2-data-reliability.yml"
      - "services/hardware_data_reliability.py"
      - "services/hardware_migrations/**"
      - "repositories/hardware_case_repository.py"
      - "repositories/hardware_tree_import_repository.py"
      - "services/hardware_case_source_store.py"
      - "services/hardware_case_intake.py"
      - "services/hardware_operability.py"
      - "quality_knowledge/web/hardware_operability_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "scripts/hardware_case_data_reliability.py"
      - "tests/test_hardware_data_reliability.py"
      - "tests/test_hardware_data_reliability_http.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hardware-w3-2-data-reliability.yml"
      - "services/hardware_data_reliability.py"
      - "services/hardware_migrations/**"
      - "repositories/hardware_case_repository.py"
      - "repositories/hardware_tree_import_repository.py"
      - "services/hardware_case_source_store.py"
      - "services/hardware_case_intake.py"
      - "services/hardware_operability.py"
      - "quality_knowledge/web/hardware_operability_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "scripts/hardware_case_data_reliability.py"
  workflow_dispatch:

jobs:
  data-reliability:
    name: data-reliability-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: W3.2 Data Reliability Gate
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_data_reliability.py
          tests/test_hardware_data_reliability_http.py

      - name: CLI bootstrap and status smoke
        shell: bash
        run: |
          python scripts/hardware_case_data_reliability.py --db w3_2_cli.db migrate
          python scripts/hardware_case_data_reliability.py --db w3_2_cli.db status
