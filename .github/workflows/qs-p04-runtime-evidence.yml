name: QS P04 Runtime Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "quality_knowledge/web/static/p04_insights.js"
      - "quality_knowledge/web/templates/p04_insights.html"
      - "quality_knowledge/web/p0_pages.py"
      - "scripts/qs_p04_runtime_browser_evidence.py"
      - ".github/workflows/qs-p04-runtime-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Capture P04 real Chromium runtime evidence
        run: python scripts/qs_p04_runtime_browser_evidence.py
