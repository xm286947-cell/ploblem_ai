name: Case Library MVP RC1

on:
  push:
    branches:
      - "release/major-case-mvp-rc1"
      - "patch/case-library-positioning-rc1-patch01"
  pull_request:
    branches:
      - main
    paths:
      - "quality_knowledge/major_cases/**"
      - "quality_knowledge/sqlite_tuning.py"
      - "services/historical_case_contract.py"
      - "services/major_case_publish.py"
      - "services/major_case_publisher.py"
      - "scripts/major_case_mvp_smoke.py"
      - "scripts/build_major_case_mvp_package.py"
      - "scripts/build_case_library_positioning_patch.py"
      - "CASE_LIBRARY_MVP_RC1_PATCH01.md"
      - "run_major_case_mvp_smoke.bat"
      - "run_major_case_mvp_smoke.sh"
      - "MAJOR_CASE_MVP_RC1_DELIVERY.md"
      - "docs/product/CASE_LIBRARY_PRODUCT_BOUNDARY_V1.md"
      - "docs/consumers/HISTORICAL_CASE_V1.md"
      - ".github/workflows/major-case-mvp-rc1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q quality_knowledge/major_cases services scripts/major_case_mvp_smoke.py

      - name: Contract tests
        run: python -m pytest -q tests/test_historical_case_consumer_contract.py

      - name: Publish adapter tests
        run: python -m pytest -q tests/test_case_publish_adapter.py

      - name: Publish service tests
        run: python -m pytest -q tests/test_case_publish_service.py

      - name: Golden Path smoke
        run: python scripts/major_case_mvp_smoke.py

      - name: Build unified Case Library RC package
        run: python scripts/build_major_case_mvp_package.py

      - name: Full package integrity
        shell: bash
        run: |
          set -euo pipefail
          FULL_ZIP="$(ls dist/CASE_LIBRARY_MVP_RC1_[0-9a-f]*.zip | head -n1)"
          test -n "$FULL_ZIP"
          (cd dist && sha256sum -c "$(basename "$FULL_ZIP").sha256")
          unzip -l "$FULL_ZIP" | grep PACKAGE_MANIFEST.json
          ! unzip -l "$FULL_ZIP" | grep -E '(^|/)(input|output|outputs|knowledge)/'
          ! unzip -l "$FULL_ZIP" | grep -E '\.env($|\.)|\.local\.ya?ml$|\.sqlite3?$|\.db$'

      - name: Build positioning patch
        run: python scripts/build_case_library_positioning_patch.py

      - name: Patch integrity
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ZIP="$(ls dist/CASE_LIBRARY_MVP_RC1_PATCH01_POSITIONING_*.zip | head -n1)"
          test -n "$PATCH_ZIP"
          (cd dist && sha256sum -c "$(basename "$PATCH_ZIP").sha256")
          unzip -l "$PATCH_ZIP" | grep PATCH_MANIFEST.json

      - name: Upload RC and patch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: case-library-mvp-rc1-${{ github.sha }}
          path: |
            dist/CASE_LIBRARY_MVP_RC1_[0-9a-f]*.zip
            dist/CASE_LIBRARY_MVP_RC1_[0-9a-f]*.zip.sha256
            dist/CASE_LIBRARY_MVP_RC1_PATCH01_POSITIONING_*.zip
            dist/CASE_LIBRARY_MVP_RC1_PATCH01_POSITIONING_*.zip.sha256
          if-no-files-found: error
          retention-days: 90
