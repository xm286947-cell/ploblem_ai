name: QS W4 Full Platform Final Package 9297998E

on:
  push:
    branches:
      - ci/qs-w4-full-platform-9297998e
    paths:
      - ".github/workflows/qs-w4-full-platform-final-package.yml"

permissions:
  contents: read

env:
  PRODUCT_SOURCE_SHA: 9297998ece35c82fc3ba91e63b4d652c8b593a41
  PACKAGE_BASENAME: QUALITY_PLATFORM_W4_BROWSER_VALIDATION_9297998ece35

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9297998ece35c82fc3ba91e63b4d652c8b593a41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static and focused regression
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          git diff --check ff838474ce6bb542915f059d35a80e2229cf4dda..$PRODUCT_SOURCE_SHA
          python -m py_compile quality_knowledge/scenario_assets.py quality_knowledge/web/scenario_asset_pages.py quality_knowledge/web/app.py quality_knowledge/web/p0_app.py
          pytest -q tests/test_qsv1_portrait_consumption.py
          pytest -q tests/test_software_assessment_qsv1_browser_flow.py tests/test_r2_w2_qsv1_production_chain.py

  build-full-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9297998ece35c82fc3ba91e63b4d652c8b593a41
          fetch-depth: 0
      - name: Build full current project package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          STAGE="$RUNNER_TEMP/full-quality-platform"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          git archive "$PRODUCT_SOURCE_SHA" | tar -x -C "$STAGE"
          printf '%s\n'             'QUALITY PLATFORM W4 BROWSER VALIDATION CANDIDATE'             'PACKAGE_SCOPE=FULL_CURRENT_QUALITY_PLATFORM'             "SOURCE_SHA=$PRODUCT_SOURCE_SHA"             'INCREMENTAL_PACKAGE=NO'             'STANDALONE_QS_PACKAGE=NO'             'CURRENT_PROJECT_IS_SINGLE_DELIVERY_SOURCE=YES'             'QSV1_PUBLISHED_PORTRAIT_CONSUMPTION=INCLUDED'             'QUALITY_SCENARIO_PRODUCTION_ENTRY=SOFTWARE_ASSESSMENT'             'PRODUCT_PORTRAIT_ENTRY=INCLUDED'             'INDUSTRY_PORTRAIT_ENTRY=INCLUDED'             'CUSTOMER_PORTRAIT_ENTRY=INCLUDED'             'REAL_MATURE_BROWSER_GOLDEN=PENDING'             > "$STAGE/00_FULL_PLATFORM_README_FIRST.txt"
          printf '%s\n'             '{'             '  "package_scope": "FULL_CURRENT_QUALITY_PLATFORM",'             "  \"source_sha\": \"$PRODUCT_SOURCE_SHA\","             '  "incremental_package": false,'             '  "standalone_qs_package": false,'             '  "qsv1_published_portrait_consumption": true,'             '  "quality_scenario_production_entry": "/software-assessment#quality-scenario-production",'             '  "product_portrait_entry": "/quality-scenario-assets/portrait?portrait_axis=product",'             '  "industry_portrait_entry": "/quality-scenario-assets/portrait?portrait_axis=industry",'             '  "customer_portrait_entry": "/quality-scenario-assets/portrait?portrait_axis=customer",'             '  "windows_entry": "start_quality_capability_p1.bat",'             '  "macos_entry": "start_quality_capability_p1.command"'             '}' > "$STAGE/FULL_PLATFORM_MANIFEST.json"
          printf '%s\n' "$PRODUCT_SOURCE_SHA" > "$STAGE/PRODUCT_SOURCE_SHA"
          grep -q '质量场景生产' "$STAGE/quality_knowledge/web/templates/base.html"
          grep -q '产品质量画像' "$STAGE/quality_knowledge/web/templates/base.html"
          grep -q '行业质量画像' "$STAGE/quality_knowledge/web/templates/base.html"
          grep -q '客户质量画像' "$STAGE/quality_knowledge/web/templates/base.html"
          grep -q 'qsv1_repository' "$STAGE/quality_knowledge/scenario_assets.py"
          (
            cd "$STAGE"
            zip -q -r "$GITHUB_WORKSPACE/dist/${PACKAGE_BASENAME}.zip" .
          )
          sha256sum "dist/${PACKAGE_BASENAME}.zip" | tee "dist/${PACKAGE_BASENAME}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: QUALITY_PLATFORM_W4_BROWSER_VALIDATION_9297998ece35
          path: |
            dist/QUALITY_PLATFORM_W4_BROWSER_VALIDATION_9297998ece35.zip
            dist/QUALITY_PLATFORM_W4_BROWSER_VALIDATION_9297998ece35.zip.sha256
          if-no-files-found: error
          compression-level: 0

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9297998ece35c82fc3ba91e63b4d652c8b593a41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows launcher smoke
        shell: pwsh
        run: python tools/step1b_qsv1_launcher_smoke.py --platform windows --port 18080

  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9297998ece35c82fc3ba91e63b4d652c8b593a41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: macOS launcher smoke
        shell: bash
        run: python tools/step1b_qsv1_launcher_smoke.py --platform macos --port 18081
