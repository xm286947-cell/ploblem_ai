name: REQ-022 Regression

on:
  push:
    branches:
      - "fix/req022-*"
      - "repair/req022-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  req022-regression:
    name: REQ-022 regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile major-case modules
        run: |
          python -m compileall -q quality_knowledge/major_cases

      - name: Run REQ-022 regression
        run: |
          mkdir -p test-results
          python -m pytest tests/test_req022_major_cases.py -q --junitxml=test-results/req022-junit.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req022-test-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
