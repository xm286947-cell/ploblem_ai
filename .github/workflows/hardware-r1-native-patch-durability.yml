name: Hardware R1 Native Patch Durability

on:
  pull_request:
    paths:
      - ".github/workflows/hardware-r1-native-patch-durability.yml"
      - "scripts/hardware_native_patch_durability.py"
      - "scripts/hardware_patch_durability_gate.py"
      - "tests/test_hardware_patch_durability.py"
      - "tests/test_hardware_native_patch_durability.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  OLD_SOURCE_COMMIT: 4a9cfdfc2c10366c86ab01efcc1c236da5942d38
  NEW_SOURCE_COMMIT: 87fcfaede66f4565eb3fba12330f7b8fba51187a
  OLD_PACKAGE_ID: HARDWARE_R1_NATIVE_PATCH_DURABILITY_OLD_4a9cfdfc2c10.zip
  NEW_PACKAGE_ID: HARDWARE_R1_NATIVE_PATCH_DURABILITY_NEW_87fcfaede66f.zip

jobs:
  build-packages:
    name: Build exact-source test ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test package binding and summary validator
        run: |
          python -m pip install pytest
          python -m pytest -q --noconftest tests/test_hardware_native_patch_durability.py

      - name: Build OLD and NEW ZIPs from frozen commits
        run: python scripts/hardware_native_patch_durability.py build-packages --output-dir packages/native

      - name: Verify source/package bindings and SHA256
        run: >-
          python scripts/hardware_native_patch_durability.py verify-packages
          --manifest packages/native/package_manifest.json
          --package-dir packages/native

      - uses: actions/upload-artifact@v4
        with:
          name: hardware-native-durability-packages
          path: packages/native/*
          if-no-files-found: error
          retention-days: 14

  native-gates:
    name: Native D1 Harness (${{ matrix.platform }})
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DURABILITY_PLATFORM: ${{ matrix.platform }}
      OLD_PACKAGE_ID: HARDWARE_R1_NATIVE_PATCH_DURABILITY_OLD_4a9cfdfc2c10.zip
      NEW_PACKAGE_ID: HARDWARE_R1_NATIVE_PATCH_DURABILITY_NEW_87fcfaede66f.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - uses: actions/download-artifact@v4
        with:
          name: hardware-native-durability-packages
          path: packages/native

      - name: Verify exact ZIP IDs, source commits, and SHA256
        run: >-
          python scripts/hardware_native_patch_durability.py verify-packages
          --manifest packages/native/package_manifest.json
          --package-dir packages/native

      - name: Run frozen D1 Harness on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "hardware-r1-native-durability\windows\persistent-data"
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "PATCH_DURABILITY_EVIDENCE\windows"
          if (Test-Path $dataRoot) { throw "WINDOWS_DATA_ROOT_MUST_BE_FRESH" }
          if (Test-Path $evidenceRoot) { throw "WINDOWS_EVIDENCE_ROOT_MUST_BE_FRESH" }
          $oldPackage = Join-Path $env:GITHUB_WORKSPACE "packages\native\$env:OLD_PACKAGE_ID"
          $newPackage = Join-Path $env:GITHUB_WORKSPACE "packages\native\$env:NEW_PACKAGE_ID"
          python scripts/hardware_patch_durability_gate.py `
            --old-package $oldPackage `
            --new-package $newPackage `
            --old-source-commit $env:OLD_SOURCE_COMMIT `
            --new-source-commit $env:NEW_SOURCE_COMMIT `
            --persistent-data-root $dataRoot `
            --evidence-root $evidenceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run frozen D1 Harness on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          data_root="$RUNNER_TEMP/hardware-r1-native-durability/macos/persistent-data"
          evidence_root="$GITHUB_WORKSPACE/PATCH_DURABILITY_EVIDENCE/macos"
          test ! -e "$data_root" || { echo "MACOS_DATA_ROOT_MUST_BE_FRESH"; exit 2; }
          test ! -e "$evidence_root" || { echo "MACOS_EVIDENCE_ROOT_MUST_BE_FRESH"; exit 2; }
          python scripts/hardware_patch_durability_gate.py \
            --old-package "$GITHUB_WORKSPACE/packages/native/$OLD_PACKAGE_ID" \
            --new-package "$GITHUB_WORKSPACE/packages/native/$NEW_PACKAGE_ID" \
            --old-source-commit "$OLD_SOURCE_COMMIT" \
            --new-source-commit "$NEW_SOURCE_COMMIT" \
            --persistent-data-root "$data_root" \
            --evidence-root "$evidence_root"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-native-durability-${{ matrix.platform }}
          path: PATCH_DURABILITY_EVIDENCE/${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14

  native-summary:
    name: Native gate summary
    if: always()
    needs: [build-packages, native-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hardware-native-durability-packages
          path: packages/native

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hardware-native-durability-*
          path: collected-evidence

      - name: Validate both platform reports and write summary
        if: always()
        run: >-
          python scripts/hardware_native_patch_durability.py summarize
          --windows-evidence collected-evidence/hardware-native-durability-windows
          --macos-evidence collected-evidence/hardware-native-durability-macos
          --package-manifest packages/native/package_manifest.json
          --output native_gate_summary.json
          --package-job-result "${{ needs.build-packages.result }}"
          --native-job-result "${{ needs.native-gates.result }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-native-durability-summary
          path: native_gate_summary.json
          if-no-files-found: warn
          retention-days: 14
