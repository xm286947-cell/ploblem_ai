name: Storage R5 Canonical Package Platform Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/storage-r5-canonical-platform-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  R4A_EXPECTED_SHA256: 4de6586bc23a1105e4004faf949897a595a9c38b5382cb3e99d75c15111ddb60
  SOURCE_BRANCH: fix/storage-rc1-r5-launcher-port-ownership
  SOURCE_COMMIT: 6d9ea0913132e1dce059a0f9ee160877ad0c5e8a
  R4A_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-e438-81fa-9e48-b7fbaa3ad236/raw?se=2026-09-24T16%3A57%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=a43337ca-39d4-50bb-a282-a06b7d35a6b2&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T16%3A28%3A47Z&ske=2026-09-25T16%3A28%3A47Z&sks=b&skv=2026-02-06&sig=YxNHb/mWX8VXcKeLewuZvKVFP23Y/NOYsc71dBBkLl4%3D'

jobs:
  linux-canonical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      r5_sha256: ${{ steps.build.outputs.r5_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download frozen R4A input
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/R4A.zip"
          curl -fL --retry 3 --retry-delay 2 "$R4A_URL" -o "$BASE"
          ACTUAL="$(sha256sum "$BASE" | awk '{print $1}')"
          echo "R4A_SHA256=$ACTUAL"
          test "$ACTUAL" = "$R4A_EXPECTED_SHA256"

      - name: Build canonical R5
        id: build
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/R4A.zip"
          OUT="$RUNNER_TEMP/r5build"
          mkdir -p "$OUT"
          python3 delivery/storage_rc1_r4/tools/build_r4_package.py             --base-zip "$BASE"             --overlay-dir delivery/storage_rc1_r4/overlay             --out-dir "$OUT"             --source-branch "$SOURCE_BRANCH"             --source-commit "$SOURCE_COMMIT"
          ZIP="$OUT/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "R5_SHA256=$SHA"
          echo "r5_sha256=$SHA" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "$OUT/$(basename "$ZIP").sha256"
          python3 - "$ZIP" "$OUT/STORAGE_RC1_DEFECT_115_R5_RELEASE_MANIFEST_20260925.json" <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          z=Path(sys.argv[1]); out=Path(sys.argv[2])
          with zipfile.ZipFile(z) as f:
              data=f.read("STORAGE_PRODUCT_MVP_RC1/RELEASE_MANIFEST.json")
          out.write_bytes(data)
          m=json.loads(data)
          assert m["source_branch"]=="fix/storage-rc1-r5-launcher-port-ownership"
          assert m["source_commit"]=="6d9ea0913132e1dce059a0f9ee160877ad0c5e8a"
          assert m["build_script_version"]=="storage-rc1-r5-builder-v1.0"
          assert m["defect_115_fix"]["r4a_status"]=="FAILED_RETIRED"
          assert m["defect_115_fix"]["release_ceiling"]=="READY_FOR_PLATFORM_RETEST"
          PY

      - name: Linux package contract and fresh-extract launcher
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r5build"
          ZIP="$OUT/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          python3 delivery/storage_rc1_r4/tools/package_contract_gate.py             --package "$ZIP"             --expected-sha256 "$SHA"             --source-branch "$SOURCE_BRANCH"             --source-commit "$SOURCE_COMMIT"             --linux-matrix

      - name: Linux port and established regression evidence
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/r5build/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip"
          ROOT="$RUNNER_TEMP/r5-linux/STORAGE_PRODUCT_MVP_RC1"
          rm -rf "$RUNNER_TEMP/r5-linux"
          mkdir -p "$RUNNER_TEMP/r5-linux"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/r5-linux"
          cd "$ROOT"
          PY="$(bash scripts/select_python.sh)"
          RUNTIME_ROOT="$(bash scripts/setup_runtime.sh)"
          export UNIFIED_AGENT_RUNTIME_ROOT="$RUNTIME_ROOT"
          export PYTHONPATH="$RUNTIME_ROOT:$ROOT:${PYTHONPATH:-}"
          export STORAGE_APP_LOG_STDOUT=0
          "$PY" scripts/port_regression.py --package-root .
          STORAGE_TEST_NO_WAIT=1 STORAGE_TEST_RESET_DATA=1 STORAGE_MOCK_FAULT=normal STORAGE_PYTHON_BIN="$PY" bash run_product_test.sh mock "$RUNTIME_ROOT"
          echo "TEST-PORT-04=PASS FREE_PORT_NORMAL_MOCK_E2E=PASS"
          STORAGE_TEST_NO_WAIT=1 STORAGE_TEST_RESET_DATA=1 STORAGE_MOCK_FAULT=truncate_once STORAGE_PYTHON_BIN="$PY" bash run_product_test.sh mock "$RUNTIME_ROOT"
          STORAGE_TEST_NO_WAIT=1 STORAGE_TEST_RESET_DATA=1 STORAGE_MOCK_FAULT=429_once STORAGE_PYTHON_BIN="$PY" bash run_product_test.sh mock "$RUNTIME_ROOT"
          STORAGE_TEST_NO_WAIT=1 STORAGE_TEST_RESET_DATA=1 STORAGE_MOCK_FAULT=persistent_503 STORAGE_PYTHON_BIN="$PY" bash run_product_test.sh mock "$RUNTIME_ROOT"
          "$PY" -m pytest -q

      - name: Upload canonical R5 package
        uses: actions/upload-artifact@v4
        with:
          name: storage-r5-canonical-package
          path: |
            ${{ runner.temp }}/r5build/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip
            ${{ runner.temp }}/r5build/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip.sha256
            ${{ runner.temp }}/r5build/STORAGE_RC1_DEFECT_115_R5_RELEASE_MANIFEST_20260925.json

  macos-native-gate:
    needs: linux-canonical-build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: storage-r5-canonical-package
          path: ${{ runner.temp }}/r5-artifact

      - name: Verify identical canonical package bytes
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/r5-artifact/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip"
          EXPECTED="${{ needs.linux-canonical-build.outputs.r5_sha256 }}"
          ACTUAL="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          echo "MACOS_SHA256=$ACTUAL"
          echo "LINUX_CANONICAL_SHA256=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run native macOS R5 platform gate
        shell: bash
        run: |
          set -o pipefail
          ZIP="$RUNNER_TEMP/r5-artifact/STORAGE_PRODUCT_MVP_RC1_DEFECT_115_FIX_CANDIDATE_20260925_R5.zip"
          EXPECTED="${{ needs.linux-canonical-build.outputs.r5_sha256 }}"
          set +e
          bash delivery/storage_rc1_r4/tools/platform_gate_macos.sh "$ZIP" "$EXPECTED" 2>&1 | tee "$RUNNER_TEMP/r5_macos_native.log"
          RC=${PIPESTATUS[0]}
          set -e
          echo "MACOS_NATIVE_GATE_EXIT=$RC"
          test "$RC" -eq 0

      - name: Upload macOS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-r5-macos-native-evidence
          path: ${{ runner.temp }}/r5_macos_native.log
