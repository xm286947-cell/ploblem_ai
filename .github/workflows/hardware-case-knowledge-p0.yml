name: Hardware Case Knowledge P0 Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "knowledge_production/**"
      - "contracts/knowledge_public/**"
      - "tests/test_hardware_case_knowledge_p0_contract.py"
      - "tools/hardware_case_knowledge_p0_release.py"
      - ".github/workflows/hardware-case-knowledge-p0.yml"
  push:
    branches:
      - feature/hardware-case-knowledge-p0-001
    paths:
      - "knowledge_production/**"
      - "contracts/knowledge_public/**"
      - "tests/test_hardware_case_knowledge_p0_contract.py"
      - "tools/hardware_case_knowledge_p0_release.py"
      - ".github/workflows/hardware-case-knowledge-p0.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Hardware public contract gate and Knowledge regression
        run: |
          python -m pytest -q \
            tests/test_hardware_case_knowledge_p0_contract.py \
            tests/test_kp_d01_business_candidate_intake.py \
            tests/test_kp_d03_review_publish.py \
            tests/test_kp_d04_release_query.py

      - name: Build deterministic Knowledge capability release
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: feature/hardware-case-knowledge-p0-001
        run: |
          python tools/hardware_case_knowledge_p0_release.py | tee /tmp/hc-kp0.txt
          test -f dist/hardware-case-knowledge-p0/KNOWLEDGE_CAPABILITY_RELEASE_V0.3.zip
          test -f dist/hardware-case-knowledge-p0/KNOWLEDGE_CAPABILITY_RELEASE_V0.3.zip.sha256
          test -f dist/hardware-case-knowledge-p0/gate_result.json
          cat dist/hardware-case-knowledge-p0/gate_result.json

      - name: Mark contract test PASS in gate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dist/hardware-case-knowledge-p0/gate_result.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["CONTRACT_TEST"] = "PASS"
          p.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Knowledge capability release
        uses: actions/upload-artifact@v4
        with:
          name: KNOWLEDGE_CAPABILITY_RELEASE_V0.3
          path: dist/hardware-case-knowledge-p0/
          if-no-files-found: error

      - name: Comment release evidence on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gate = JSON.parse(
              fs.readFileSync(
                'dist/hardware-case-knowledge-p0/gate_result.json',
                'utf8'
              )
            );
            const body = [
              '### HARDWARE-CASE-KNOWLEDGE-P0-001 Gate',
              '',
              '**RESULT:** PASS',
              '',
              '- Knowledge Version: `' + gate.KNOWLEDGE_VERSION + '`',
              '- Source Commit: `' + gate.SOURCE_COMMIT + '`',
              '- Release Package: `' + gate.RELEASE_PACKAGE + '`',
              '- SHA256: `' + gate.SHA256 + '`',
              '- Contract Test: `PASS`',
              '- Mock Compatibility: `' + gate.MOCK_COMPATIBILITY + '`',
              '',
              'K01-K07: **PASS**'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
