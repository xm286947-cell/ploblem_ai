name: Major Runtime Integration Gate

on:
  push:
    branches:
      - "integration/major-runtime-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-runtime-p0-test.txt

      - name: Compile integration modules
        run: |
          python -m compileall -q runtime quality_knowledge/major_cases

      - name: Run Runtime D8 major-issue fixture
        run: |
          mkdir -p test-results/major-runtime-integration
          python -m pytest tests/test_agent_runtime_p0_d8.py -q \
            --junitxml=test-results/major-runtime-integration/runtime-d8.xml

      - name: Run major-case domain integration contract
        run: |
          python -m pytest tests/test_major_runtime_integration_gate.py -q \
            --junitxml=test-results/major-runtime-integration/domain-gate.xml

      - name: Run Runtime retry and hard-budget acceptance
        run: |
          python -m pytest tests/test_agent_runtime_p0_d11_acceptance_gaps.py -q \
            --junitxml=test-results/major-runtime-integration/runtime-d11.xml

      - name: Run Runtime Provider Boundary acceptance
        run: |
          python -m pytest tests/test_runtime_provider_adapter.py -q \
            --junitxml=test-results/major-runtime-integration/provider-boundary.xml

      - name: Run REQ-022 regression
        run: |
          python -m pytest tests/test_req022_major_cases.py -q \
            --junitxml=test-results/major-runtime-integration/req022.xml

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-runtime-integration-evidence-${{ github.sha }}
          path: test-results/major-runtime-integration/
          if-no-files-found: error
          retention-days: 90
