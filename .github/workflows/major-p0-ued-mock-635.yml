name: Major P0 UED Mock contract

on:
  push:
    branches:
      - feature/major-p0-ued-focus-mock-20261011
  pull_request:
    paths:
      - quality_knowledge/web/templates/p0_base.html
      - quality_knowledge/web/templates/major_production.html
      - quality_knowledge/web/static/major_production.js
      - quality_knowledge/web/static/major_production.css
      - tests/test_major_p0_ued_focus_mock.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  major-ued-mock-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/major-p0-ued-focus-mock-20261011
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the product test dependency closure
        run: python -m pip install --disable-pip-version-check -r requirements-major-mvp-product.txt pytest==8.4.2
      - name: Render major and unrelated shells and assert contract
        run: python -m pytest -q tests/test_major_p0_ued_focus_mock.py
      - name: Install browser Mock test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 beautifulsoup4==4.14.3
          python -m playwright install chromium
      - name: Execute Major browser negative and recovery gates
        run: python -m pytest -q tests/test_major_p0_ued_negative_browser_635.py
      - name: P0 missing-required-types and ambiguous Publish real Chromium
        run: python tests/e2e/test_major_p0_publish_gate_mock_635.py
      - name: Ensure JavaScript syntax and preserve old workflow symbols
        run: |
          node --check quality_knowledge/web/static/major_production.js
          python - <<'PY'
          from pathlib import Path
          js=Path('quality_knowledge/web/static/major_production.js').read_text()
          for critical in ('/excel/preview','/excel/confirm','/sources','/analysis','/publish','restoreBatch','restoreCase','showExcelProvenance'):
              assert critical in js, critical
          print('MAJOR_P0_API_CONTRACT_UNCHANGED=PASS')
          PY
      - name: Report boundaries
        if: always()
        run: |
          echo 'OWNER=CHATGPT_MOCK'
          echo 'P0_UED_TEMPLATE_GATE_TESTED=YES'
          echo 'TRUE_NATIVE_PROVIDER=NOT_RUN'
          echo 'GOLDEN_EXCEL_AND_PDF_SUBSTANTIVE_E2E=NOT_RUN'
          echo 'RELEASE_APPROVAL=HOLD'

  major-ued-immutable-candidate:
    needs: major-ued-mock-contract
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/major-p0-ued-focus-mock-20261011
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate builder product dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-major-mvp-product.txt
      - name: Build immutable full product Candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/major635"
          python scripts/build_major_mvp_product_candidate.py --output-dir "$RUNNER_TEMP/major635"
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          outputs=list((Path(os.environ["RUNNER_TEMP"])/"major635").glob("*.zip"))
          assert len(outputs)==1, outputs
          artifact=outputs[0]
          with zipfile.ZipFile(artifact) as z:
              assert z.testzip() is None
              manifest_path=next(n for n in z.namelist() if n.endswith("/PACKAGE_MANIFEST.json"))
              manifest=json.loads(z.read(manifest_path))
              expected=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
              assert manifest["source_commit"]==expected
              prefix=manifest_path.removesuffix("PACKAGE_MANIFEST.json")
              for rel in (
                  "requirements-major-mvp-product.txt",
                  "START_MAJOR_MVP.command",
                  "quality_knowledge/web/templates/p0_base.html",
                  "quality_knowledge/web/templates/major_production.html",
                  "quality_knowledge/web/static/major_production.js",
                  "quality_knowledge/web/static/major_production.css",
              ):
                  assert prefix+rel in z.namelist(), rel
                  assert hashlib.sha256(z.read(prefix+rel)).hexdigest()==manifest["file_sha256"][rel],rel
              assert b"xlrd==2.0.2" in z.read(prefix+"requirements-major-mvp-product.txt")
          print("SOURCE_HEAD="+expected)
          print("NEW_CANDIDATE_NAME="+artifact.name)
          print("NEW_CANDIDATE_SHA256="+hashlib.sha256(artifact.read_bytes()).hexdigest())
          print("MAJOR_P0_UED_IMMUTABLE_MANIFEST=PASS")
          PY
      - name: Upload exact macOS-built candidate
        uses: actions/upload-artifact@v4
        with:
          name: major-p0-ued-635-macos-candidate
          path: ${{ runner.temp }}/major635/*.zip
          if-no-files-found: error
          retention-days: 21
      - name: Keep native Provider Gate separate
        run: |
          echo 'REAL_PROVIDER=NOT_RUN'
          echo 'REAL_MACOS_FIELD_E2E=NOT_RUN'
          echo 'RELEASE_APPROVAL=HOLD'
