name: Hardware W3 Stage A/B Real HTTP Mock Validation
on:
  pull_request:
    paths:
      - ".github/workflows/hardware-w3-mock-stage-http.yml"
      - "tests/support/test_hardware_w3_mock_http_stage_dispatch.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-a-b-real-http-mock:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: c7935e00f1f0abe828b0090524bb14ba923f3635
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact product Runtime test requirements
        run: python -m pip install -r product/requirements.txt -r product/requirements-runtime-p0-test.txt
      - name: Two-stage actual Unified Runtime HTTP Mock and bounded concurrency
        env:
          PYTHONPATH: product
        run: python -m pytest -v -rA support/tests/support/test_hardware_w3_mock_http_stage_dispatch.py
