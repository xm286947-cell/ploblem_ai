name: Knowledge Production MVP

on:
  push:
    branches:
      - feature/knowledge-production-mvp-001
    paths:
      - "knowledge_production/**"
      - "config/runtime/agents/knowledge.production.extract.yaml"
      - "prompts/runtime/knowledge_production/**"
      - "tests/test_kp_m0*.py"
      - "tests/knowledge/**"
      - ".github/workflows/knowledge-production-mvp.yml"
  pull_request:
    paths:
      - "knowledge_production/**"
      - "config/runtime/agents/knowledge.production.extract.yaml"
      - "prompts/runtime/knowledge_production/**"
      - "tests/test_kp_m0*.py"
      - "tests/knowledge/**"

jobs:
  kp-m01-m03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Knowledge Production gates
        run: |
          python -m pytest -q \
            tests/test_kp_m01_source_document.py \
            tests/test_kp_m02_candidate_evidence.py \
            tests/test_kp_m03_ai_extraction.py \
            tests/knowledge/test_knowledge_service.py

  kp-first-golden-source:
    needs: kp-m01-m03
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KP_REAL_PDF: /tmp/S40FC016_002_01118_RevD.pdf
    steps:
      - uses: actions/checkout@v4

      - name: Check one-time golden marker
        id: golden
        shell: bash
        run: |
          if [ -f knowledge_production/.first_golden_pending ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.golden.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.golden.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download official SkyHigh eMMC PDF
        if: steps.golden.outputs.run == 'true'
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://www.skyhighmemory.com/download/eMMC_16GB_STD_PKG_S40FC016C3_002_01118.pdf?v=D" \
            -o "$KP_REAL_PDF"
          ACTUAL_SHA256="$(sha256sum "$KP_REAL_PDF" | awk '{print $1}')"
          echo "ACTUAL_SHA256=$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "a40b2ecc44c89184dbcaed3f8d48e7615e4daefaf7732076a40f7bc73751e978"

      - name: Validate real PDF source and parse
        if: steps.golden.outputs.run == 'true'
        run: |
          python -m pytest -q \
            tests/test_kp_m03_real_pdf_golden.py::test_kp_first_golden_real_pdf_source_parse

  kp-first-golden-real:
    needs: kp-first-golden-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KNOWLEDGE_PRODUCTION_REAL_E2E: "1"
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      KP_REAL_PDF: /tmp/S40FC016_002_01118_RevD.pdf
    steps:
      - uses: actions/checkout@v4

      - name: Check one-time golden marker
        id: golden
        shell: bash
        run: |
          if [ -f knowledge_production/.first_golden_pending ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.golden.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Require live provider configuration
        if: steps.golden.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$DASHSCOPE_BASE_URL" ]; then
            echo "::error::Repository variable DASHSCOPE_BASE_URL is not configured."
            exit 2
          fi
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::Repository secret DASHSCOPE_API_KEY is not configured."
            exit 2
          fi

      - name: Install dependencies
        if: steps.golden.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download official SkyHigh eMMC PDF
        if: steps.golden.outputs.run == 'true'
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://www.skyhighmemory.com/download/eMMC_16GB_STD_PKG_S40FC016C3_002_01118.pdf?v=D" \
            -o "$KP_REAL_PDF"
          ACTUAL_SHA256="$(sha256sum "$KP_REAL_PDF" | awk '{print $1}')"
          echo "ACTUAL_SHA256=$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "a40b2ecc44c89184dbcaed3f8d48e7615e4daefaf7732076a40f7bc73751e978"

      - name: Run first real-PDF Golden Path
        if: steps.golden.outputs.run == 'true'
        run: |
          python -m pytest -q \
            tests/test_kp_m03_real_pdf_golden.py::test_kp_first_golden_real_pdf_to_candidate_evidence
