name: Hardware Case Real Validation Harness

on:
  pull_request:
    paths:
      - "tools/hardware_case_real_validation.py"
      - "config/hardware_case_real_validation.example.json"
      - "tests/test_hardware_case_real_validation.py"
      - "services/hardware_case_ai_adapter.py"
      - "services/hardware_case_word.py"
      - ".github/workflows/hardware-case-real-validation-harness.yml"
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install "pytest>=8,<9" "openpyxl>=3.1,<4" "PyYAML>=6,<7"
      - name: Run validation harness tests
        run: python -m pytest -q --noconftest tests/test_hardware_case_real_validation.py
      - name: Run M1 M2 M4 regression
        run: python -m pip install "jsonschema>=4.21,<5" && python -m pytest -q --noconftest tests/test_hardware_case_contract.py tests/test_hardware_case_backend.py tests/test_hardware_case_ai_adapter.py
