name: Hardware R1 Durable Asset Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/hardware-r1-durable-asset.yml"
      - "services/hardware_asset_repository.py"
      - "services/hardware_asset_legacy_migration.py"
      - "services/hardware_asset_migrations/**"
      - "services/hardware_data_root.py"
      - "services/hardware_data_reliability.py"
      - "services/hardware_startup_coordinator.py"
      - "services/hardware_operability.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/hardware_operability_api.py"
      - "scripts/hardware_case_web_start.py"
      - "main.py"
      - "tests/test_hardware_candidate_asset_repository.py"
      - "tests/test_hardware_asset_legacy_migration.py"
      - "tests/test_hardware_data_root.py"
      - "tests/test_hardware_data_reliability.py"
      - "tests/test_hardware_startup_coordinator.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hardware-r1-durable-asset.yml"
      - "services/hardware_asset_repository.py"
      - "services/hardware_asset_legacy_migration.py"
      - "services/hardware_asset_migrations/**"
      - "services/hardware_data_root.py"
      - "services/hardware_data_reliability.py"
      - "services/hardware_startup_coordinator.py"
      - "services/hardware_operability.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/hardware_operability_api.py"
      - "scripts/hardware_case_web_start.py"
      - "main.py"
      - "tests/test_hardware_candidate_asset_repository.py"
      - "tests/test_hardware_asset_legacy_migration.py"
      - "tests/test_hardware_data_root.py"
      - "tests/test_hardware_data_reliability.py"
      - "tests/test_hardware_startup_coordinator.py"
  workflow_dispatch:

jobs:
  durable-asset:
    name: durable-asset-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install product and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Compile durable asset modules
        run: >
          python -m py_compile
          services/hardware_asset_repository.py
          services/hardware_asset_legacy_migration.py
          services/hardware_startup_coordinator.py
          services/hardware_operability.py
          services/hardware_asset_migrations/__init__.py
          services/hardware_asset_migrations/v001_candidate_repository.py
          services/hardware_asset_migrations/v002_legacy_migration.py
          quality_knowledge/web/p0_app.py
          quality_knowledge/web/hardware_operability_api.py
          scripts/hardware_case_web_start.py
          main.py

      - name: Run durable asset and persistent data regressions
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_candidate_asset_repository.py
          tests/test_hardware_asset_legacy_migration.py
          tests/test_hardware_data_root.py
          tests/test_hardware_data_reliability.py
          tests/test_hardware_startup_coordinator.py
          tests/test_hardware_data_reliability_http.py
          tests/test_hardware_operability.py
          tests/test_hardware_r1_workbench.py
          tests/test_hardware_case_product_api_e2e.py

      - name: Packaged launcher startup gate
        run: python scripts/hardware_case_web_start.py --check
