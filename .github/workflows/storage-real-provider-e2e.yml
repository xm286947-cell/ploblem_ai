name: Storage Real Provider E2E

on:
  workflow_dispatch:

jobs:
  storage-real-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORAGE_REAL_E2E: "1"
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require live provider configuration
        shell: bash
        run: |
          if [ -z "$DASHSCOPE_BASE_URL" ]; then
            echo "::error::Repository variable DASHSCOPE_BASE_URL is not configured."
            exit 2
          fi
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::Repository secret DASHSCOPE_API_KEY is not configured."
            exit 2
          fi

      - name: Install Runtime test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime-p0-test.txt

      - name: Run STORAGE-REAL-E2E-01
        run: python -m pytest tests/test_agent_runtime_p0_storage_real_provider_e2e.py -q
