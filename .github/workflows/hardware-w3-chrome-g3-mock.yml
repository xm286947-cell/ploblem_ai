name: Hardware W3 T2 Chrome G3 Mock Golden
on:
  pull_request:
    paths:
      - ".github/workflows/hardware-w3-chrome-g3-mock.yml"
      - "scripts/w3_tse_chrome_g3.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chrome-g3-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen candidate deps and isolated browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r support/requirements.txt -r support/requirements-runtime-p0-test.txt
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          run-id: 37883734608
          name: HARDWARE_W3_INTERNAL_TEST_CANDIDATE_c7935e0
          path: support/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 37889176428
          name: HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0
          path: support/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run isolated headless Chrome G3 on exact candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          python support/scripts/w3_tse_chrome_g3.py
      - name: Upload redacted browser evidence even when blocked
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HARDWARE_W3_G3_BROWSER_MOCK_EVIDENCE
          path: support/dist/browser_g3_evidence/
          if-no-files-found: ignore
          retention-days: 30
