name: Hardware W3 T2 Browser Mock Fixture Kit
on:
  pull_request:
    paths:
      - "scripts/w3_tse_browser_mock_fixtures.py"
      - "tests/support/test_w3_browser_mock_fixture_kit.py"
      - "docs/test/W3_T2_BROWSER_MOCK_FIXTURE_KIT_README.md"
      - ".github/workflows/hardware-w3-browser-mock-fixture-kit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-gate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: c7935e00f1f0abe828b0090524bb14ba923f3635
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen product Runtime test requirements
        run: python -m pip install -r product/requirements.txt -r product/requirements-runtime-p0-test.txt
      - name: T2 fixture & local Stage Mock real HTTP selftests
        env:
          PYTHONPATH: product
        run: python -m pytest -q -v support/tests/support/test_w3_browser_mock_fixture_kit.py
      - name: Generate real DOCX-bound Evidence fixtures
        run: |
          mkdir -p support/dist/browser_mock_fixture
          python support/scripts/w3_tse_browser_mock_fixtures.py --product-root product --out-dir support/dist/browser_mock_fixture
      - name: Build test-only fixture kit and SHA256 report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          repo=Path("support")
          generated=repo/"dist/browser_mock_fixture"
          path=repo/"dist/HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0.zip"
          with zipfile.ZipFile(path,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for f in sorted(generated.iterdir()):
                  if f.is_file():z.write(f, f.name)
              z.write(repo/"scripts/w3_tse_browser_mock_fixtures.py","w3_tse_browser_mock_fixtures.py")
              z.write(repo/"docs/test/W3_T2_BROWSER_MOCK_FIXTURE_KIT_README.md","README.md")
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              expected={"stage_a_fixture.json","stage_b_fixture.json","T2_FIXTURE_MANIFEST.json",
                        "A9903-MCU串口带载乱码.docx","A9904-MCU串口输出配置异常.docx",
                        "w3_tse_browser_mock_fixtures.py","README.md"}
              assert expected.issubset(z.namelist()),z.namelist()
              print("T2_KIT_ENTRIES="+str(len(z.namelist())))
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          (repo/"dist/HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0_SHA256.txt").write_text(
              "KIT="+path.name+"\nSHA256="+sha+"\nFROZEN=c7935e00f1f0abe828b0090524bb14ba923f3635\nFORMAL_GATE=NOT_PASS\n",encoding="utf-8"
          )
          print("T2_KIT_SHA256="+sha)
          print("T2_KIT_SIZE="+str(path.stat().st_size))
          print("T2_KIT_RESULT=TEST_ONLY_PACKAGE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0
          path: |
            support/dist/HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0.zip
            support/dist/HARDWARE_W3_T2_BROWSER_MOCK_FIXTURES_c7935e0_SHA256.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
