name: Overall R2 W1 Gate

on:
  push:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/**"
      - "tests/test_r2_w1_*.py"
      - "tests/test_rc4_analysis_workbench_ui.py"
      - ".github/workflows/overall-r2-w1-gate.yml"
  pull_request:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/**"
      - "tests/test_r2_w1_*.py"
      - "tests/test_rc4_analysis_workbench_ui.py"

permissions:
  contents: read

jobs:
  w1-focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Compile quality_knowledge
        run: python -m compileall -q quality_knowledge

      - name: Run W1 focused regression
        run: |
          pytest -q \
            tests/test_r2_w1_itr_resolution.py \
            tests/test_rc4_analysis_workbench_ui.py
