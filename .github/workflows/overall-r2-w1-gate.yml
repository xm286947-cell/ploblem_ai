name: Overall R2 W1 Gate

on:
  push:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/**"
      - "tests/test_r2_w1_*.py"
      - "tests/test_rc4_analysis_workbench_ui.py"
      - ".github/workflows/overall-r2-w1-gate.yml"
  pull_request:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/**"
      - "tests/test_r2_w1_*.py"
      - "tests/test_rc4_analysis_workbench_ui.py"
      - ".github/workflows/overall-r2-w1-gate.yml"

permissions:
  contents: read

jobs:
  w1-focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Compile quality_knowledge
        run: python -m compileall -q quality_knowledge

      - name: Run W1 focused regression
        run: |
          pytest -q \
            tests/test_r2_w1_*.py \
            tests/test_rc4_analysis_workbench_ui.py


  w1-windows-clean-start:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Materialize clean source directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "r2-w1-clean-source"
          $zip = Join-Path $env:RUNNER_TEMP "r2-w1-source.zip"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          New-Item -ItemType Directory -Path $root | Out-Null
          git archive --format=zip --output="$zip" HEAD
          Expand-Archive -Path $zip -DestinationPath $root
          if (Test-Path (Join-Path $root ".git")) {
            throw "Clean source unexpectedly contains .git"
          }
          "R2_W1_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify frozen PLC seed byte contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:R2_W1_ROOT
          $manifest = Get-Content "quality_knowledge/config/p0_seed_manifest.json" -Raw | ConvertFrom-Json
          $expected = ($manifest.seeds | Where-Object { $_.seed_key -eq "PLC_MAPPING_SEED_V1" -and $_.version -eq 1 }).sha256.ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 "quality_knowledge/config/plc_fields.yaml").Hash.ToLower()
          Write-Host "PLC_SEED_EXPECTED_SHA256=$expected"
          Write-Host "PLC_SEED_ACTUAL_SHA256=$actual"
          if ($actual -ne $expected) {
            throw "PLC_SEED_BYTE_CONTRACT_MISMATCH expected=$expected actual=$actual"
          }
          Write-Host "PLC_SEED_BYTE_CONTRACT=PASS"

      - name: Prepare independent Legacy and P1 databases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:R2_W1_ROOT
          $knowledge = Join-Path $env:R2_W1_ROOT "knowledge"
          New-Item -ItemType Directory -Path $knowledge -Force | Out-Null
          $legacy = Join-Path $knowledge "r2_w1_legacy.db"
          $p1 = Join-Path $knowledge "r2_w1_p1.db"
          $env:R2_LEGACY_DB = $legacy
          python -c "import os; from quality_knowledge.web import create_app; create_app(os.environ['R2_LEGACY_DB'])"
          if (!(Test-Path $legacy)) { throw "Legacy DB initialization failed" }
          "LEGACY_QUALITY_ISSUE_DB_PATH=$legacy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_W1_P1_DB=$p1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start unified P1 Web from clean source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:R2_W1_ROOT
          $stdout = Join-Path $env:RUNNER_TEMP "r2-w1.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "r2-w1.stderr.log"
          $proc = Start-Process -FilePath "python" -ArgumentList @(
            "main.py","knowledge-p1-start",
            "--db",$env:R2_W1_P1_DB,
            "--host","127.0.0.1",
            "--port","8080"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "R2_W1_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $ready = $false
          for ($i=0; $i -lt 60; $i++) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8080/p0/issues" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            throw "Unified R2 W1 Web did not become ready"
          }

      - name: Smoke W1 formal routes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $routes = @(
            "http://127.0.0.1:8080/p0/issues",
            "http://127.0.0.1:8080/p0/itr-recovery",
            "http://127.0.0.1:8080/p0/itr-resolution",
            "http://127.0.0.1:8080/p0/missed-test-analysis",
            "http://127.0.0.1:8080/p0/batch-analysis",
            "http://127.0.0.1:8080/analysis"
          )
          foreach ($route in $routes) {
            $response = Invoke-WebRequest -Uri $route -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              throw "W1 route failed: $route => $($response.StatusCode)"
            }
            Write-Host "$route=PASS"
          }
          if (!(Test-Path $env:R2_W1_P1_DB)) { throw "P1 DB was not initialized" }
          if (!(Test-Path $env:LEGACY_QUALITY_ISSUE_DB_PATH)) { throw "Legacy DB missing" }
          Write-Host "WINDOWS_CLEAN_SOURCE_START=PASS"
          Write-Host "LEGACY_DB_BINDING=PASS"
          Write-Host "P1_DB_INITIALIZED=PASS"

      - name: Stop unified P1 Web
        if: always()
        shell: pwsh
        run: |
          if ($env:R2_W1_PID) {
            Stop-Process -Id ([int]$env:R2_W1_PID) -Force -ErrorAction SilentlyContinue
          }
