name: Hardware R2 Agent Retrieval Gate
on:
  pull_request:
    paths:
      - "services/hardware_case_ai_retrieval.py"
      - "services/hardware_r2_agent_runtime.py"
      - "quality_knowledge/web/hardware_r2_agent_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/static/hardware_case*.js"
      - "config/runtime/agents/hardware_r2.*.yaml"
      - "tests/test_hardware_r2_smart_search.py"
      - ".github/workflows/hardware-r2-agent-gate.yml"
  workflow_dispatch:
jobs:
  r2-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project deps
        run: python -m pip install -r requirements.txt
      - name: Compile Agent and API
        run: python -m compileall -q services/hardware_r2_agent_runtime.py services/hardware_case_ai_retrieval.py quality_knowledge/web/hardware_r2_agent_api.py quality_knowledge/web/p0_app.py
      - name: Javascript syntax
        run: |
          node --check quality_knowledge/web/static/hardware_case.js
          node --check quality_knowledge/web/static/hardware_case_knowledge_consumption.js
      - name: Focused R2 + prior query regressions
        run: python -m pytest -q tests/test_hardware_r2_smart_search.py tests/test_hardware_case_ai_retrieval.py tests/test_hardware_case_ai_retrieval_w2.py tests/test_hardware_knowledge_consumption.py
