name: Hardware R2 S2 Evidence Grounding Gate
on:
  pull_request:
    paths:
      - "services/hardware_engineering_analysis.py"
      - "services/hardware_engineering_runtime.py"
      - "quality_knowledge/web/hardware_case_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/static/hardware_case_knowledge_consumption.js"
      - "quality_knowledge/web/templates/hardware_case_knowledge_consumption.html"
      - "config/runtime/agents/hardware_retrieval.engineering_consume.yaml"
      - "prompts/runtime/hardware_retrieval/engineering_consume_v1.md"
      - "tests/test_hardware_r2_engineering_analysis.py"
      - ".github/workflows/hardware-r2-s2-agent-gate.yml"
  workflow_dispatch:
jobs:
  s2-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Grounded engineering analysis and API regressions
        run: |
          python -m pytest -q tests/test_hardware_r2_engineering_analysis.py tests/test_hardware_r2_query_agent_contract.py tests/test_hardware_case_web_api.py
      - name: Browser script syntax
        run: node --check quality_knowledge/web/static/hardware_case_knowledge_consumption.js
