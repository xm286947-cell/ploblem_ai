name: REQ-022 Release Gate

on:
  push:
    branches:
      - "fix/req022-release-gate*"
      - "repair/req022-*"
  pull_request:
    branches:
      - "repair/req022-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: REQ-022 cumulative release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m compileall -q quality_knowledge analysis compatibility contracts models parser parsing presentation repositories retriever services

      - name: Run REQ-022 regression
        run: |
          mkdir -p test-results/release-gate
          python -m pytest tests/test_req022_major_cases.py -q \
            --junitxml=test-results/release-gate/req022.xml

      - name: Run legacy M7 and M8 regression
        run: |
          python -m pytest -q \
            tests/test_analysis_pipeline_runner.py \
            tests/test_m71_query_parser.py \
            tests/test_m72_query_ai_enricher.py \
            tests/test_m72_query_enricher_pipeline.py \
            tests/test_m72_query_normalizer.py \
            tests/test_m72_standard_query_builder.py \
            tests/test_m73_retrieval_profile.py \
            tests/test_m7_composite.py \
            tests/test_m7_retriever.py \
            tests/test_m81_candidate_loader.py \
            tests/test_m82_similarity_analyzer.py \
            tests/test_m83_solution_analyzer.py \
            tests/test_m84_repeat_decision.py \
            tests/test_m85_delivery.py \
            --junitxml=test-results/release-gate/legacy-m7-m8.xml

      - name: Run ITR and CS regression
        run: |
          python -m pytest -q \
            tests/test_itr_cs_material_mvp.py \
            tests/test_scenario_multisource_dedup.py \
            tests/test_scenario_operation_sources.py \
            --junitxml=test-results/release-gate/itr-cs.xml

      - name: Run quality scenario regression
        run: |
          python -m pytest -q \
            tests/test_reverse_quality.py \
            tests/test_quality_scenario_generation.py \
            tests/test_quality_scenario_library.py \
            tests/test_scenario_assets.py \
            tests/test_scenario_decisions.py \
            tests/test_scenario_interpretation.py \
            tests/test_scenario_multisource_dedup.py \
            tests/test_scenario_operation_sources.py \
            tests/test_scenario_semantic_convergence.py \
            tests/test_software_operation_year.py \
            tests/test_associated_material_filters.py \
            tests/test_sqlite_performance.py \
            --junitxml=test-results/release-gate/quality-scenarios.xml

      - name: Run issue workbench regression
        run: |
          python -m pytest -q \
            tests/test_rc4_analysis_workbench_ui.py \
            tests/test_issue_month_navigation_patch.py \
            tests/test_p1_batch_analysis.py \
            tests/test_quality_capability_p0_workbench_ued.py \
            tests/test_patch02_compact_issue_and_field_delete.py \
            tests/test_quality_insights_drilldown_fix.py \
            tests/test_ued_ui_v1.py \
            tests/test_ued_ui_v2_layout_compat.py \
            --junitxml=test-results/release-gate/issue-workbench.xml

      - name: Run cumulative repository regression
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_upgrade_package_dependencies.py \
            --junitxml=test-results/release-gate/cumulative.xml

      - name: Record known infrastructure exclusion
        if: always()
        run: |
          printf '%s\n' \
            'tests/test_upgrade_package_dependencies.py is excluded because its required base tag v1.1-p2-rc2-full-20260901 is absent from the remote repository.' \
            'This exclusion is not a functional PASS and must remain visible until the baseline tag is restored or the package baseline is formally changed.' \
            > test-results/release-gate/KNOWN_EXCLUSIONS.txt

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req022-release-gate-evidence-${{ github.sha }}
          path: test-results/release-gate/
          if-no-files-found: error
          retention-days: 90
