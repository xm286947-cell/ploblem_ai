name: Hardware AI Retrieval Metadata W1

on:
  pull_request:
    paths:
      - "services/hardware_retrieval_metadata.py"
      - "services/hardware_retrieval_tagger.py"
      - "services/hardware_retrieval_tagger_runtime.py"
      - "services/hardware_retrieval_index.py"
      - "services/hardware_retrieval_query.py"
      - "services/hardware_case_ai_retrieval.py"
      - "services/hardware_query_agent.py"
      - "services/hardware_assisted_search.py"
      - "services/hardware_engineering_consumption.py"
      - "quality_knowledge/web/hardware_engineering_consumption_api.py"
      - "config/runtime/agents/hardware_retrieval.engineering_consumption.yaml"
      - "prompts/runtime/hardware_retrieval/engineering_consumption_v1.md"
      - "tests/test_hardware_r2_engineering_consumption.py"
      - "quality_knowledge/web/hardware_assisted_query_api.py"
      - "quality_knowledge/web/static/hardware_case_knowledge_consumption.js"
      - "config/runtime/agents/hardware_retrieval.query_understand.yaml"
      - "prompts/runtime/hardware_retrieval/query_understand_v1.md"
      - "tests/test_hardware_r2_query_assist.py"
      - "quality_knowledge/web/hardware_case_api.py"
      - "quality_knowledge/web/p0_app.py"
      - "quality_knowledge/web/templates/hardware_case_search.html"
      - "quality_knowledge/web/static/hardware_case.js"
      - "quality_knowledge/web/static/hardware_case.css"
      - "quality_knowledge/web/templates/hardware_case_detail.html"
      - "config/runtime/agents/hardware_retrieval.tag.yaml"
      - "prompts/runtime/hardware_retrieval/tagger_v1.md"
      - "tests/test_hardware_retrieval_metadata.py"
      - "tests/test_hardware_retrieval_tagger_runtime.py"
      - "tests/test_hardware_retrieval_real_agent_validation.py"
      - "tools/hardware_retrieval_real_agent_validation.py"
      - "tests/test_hardware_retrieval_index.py"
      - "tests/test_hardware_retrieval_query.py"
      - "tests/test_hardware_case_ai_retrieval.py"
      - "tests/test_hardware_case_ai_retrieval_w2.py"
      - "tests/test_hardware_case_w2_ui_smoke_contract.py"
      - "docs/product/HARDWARE_AI_RETRIEVAL_W1_METADATA_TAGGER.md"
      - ".github/workflows/hardware-ai-retrieval-w1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: W1 metadata, Runtime, index, and query tests
        run: >-
          python -m pytest -q
          tests/test_hardware_retrieval_metadata.py
          tests/test_hardware_retrieval_tagger_runtime.py
          tests/test_hardware_retrieval_real_agent_validation.py
          tests/test_hardware_retrieval_index.py
          tests/test_hardware_retrieval_query.py
          tests/test_hardware_case_ai_retrieval.py
          tests/test_hardware_r2_query_assist.py
          tests/test_hardware_r2_engineering_consumption.py
          tests/test_hardware_case_ai_retrieval_w2.py
          tests/test_hardware_case_w2_ui_smoke_contract.py
