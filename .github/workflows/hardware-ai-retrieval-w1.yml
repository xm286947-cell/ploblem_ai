name: Hardware AI Retrieval Metadata W1

on:
  pull_request:
    paths:
      - "services/hardware_retrieval_metadata.py"
      - "services/hardware_retrieval_tagger.py"
      - "services/hardware_retrieval_tagger_runtime.py"
      - "config/runtime/agents/hardware_retrieval.tag.yaml"
      - "prompts/runtime/hardware_retrieval/tagger_v1.md"
      - "tests/test_hardware_retrieval_metadata.py"
      - "tests/test_hardware_retrieval_tagger_runtime.py"
      - "docs/product/HARDWARE_AI_RETRIEVAL_W1_METADATA_TAGGER.md"
      - ".github/workflows/hardware-ai-retrieval-w1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: W1 metadata and Runtime binding tests
        run: >-
          python -m pytest -q
          tests/test_hardware_retrieval_metadata.py
          tests/test_hardware_retrieval_tagger_runtime.py
