name: Major V1.1 macOS primary and Linux candidate Gate 614
on:
  push:
    branches:
      - feature/major-v11-linux-full-agent-e2e-614
  pull_request:
    branches:
      - fix/major-v11-ai-source-runtime-diagnostics-609
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-full-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact DUT source
        uses: actions/checkout@v4
        with:
          ref: feature/major-v11-linux-full-agent-e2e-614
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install candidate and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-major-mvp-product.txt
          # No test-only xlrd; it MUST come from packaged requirements.
          python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Prior Agent capability and Major regression
        run: |
          python -m pytest -q \
            tests/test_repeat_agent_capability_restore.py \
            tests/test_repeat_web_mvp.py \
            tests/test_repeat_search_contract.py \
            tests/test_repeat_result_contract.py \
            tests/test_major_linux_repeat_report_614.py \
            tests/test_major_runtime_dependency_closure_614.py \
            tests/test_major_ai_source_diagnostics_611.py \
            tests/test_major_provider_wiring.py \
            tests/test_major_refresh_recovery_605.py \
            tests/test_major_batch_visibility_607.py
          echo 'LEGACY_AGENT_REGRESSION_GATE=PASS'
      - name: Build complete immutable Linux candidate
        run: |
          mkdir -p "$RUNNER_TEMP/major614"
          python scripts/build_major_mvp_product_candidate.py --output-dir "$RUNNER_TEMP/major614"
          ls -l "$RUNNER_TEMP"/major614/*.zip
          echo 'LINUX_FULL_PACKAGE_BUILD=PASS'
      - name: Fresh extract and independent Linux start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/major614/extracted"
          python - <<'PY'
          from pathlib import Path
          import json, os, hashlib, zipfile, subprocess
          folder = Path(os.environ["RUNNER_TEMP"])/"major614"
          archive = next(folder.glob("*.zip"))
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
              zf.extractall(folder/"extracted")
          dut = next((folder/"extracted").iterdir())
          m = json.loads((dut/"PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          exact_sha=subprocess.check_output(["git", "-C", os.environ["GITHUB_WORKSPACE"], "rev-parse", "HEAD"], text=True).strip()
          assert m["source_commit"] == exact_sha, (m["source_commit"], exact_sha)
          print("DUT_SOURCE_HEAD="+exact_sha)
          required = (
            "START_MAJOR_MVP.sh",
            "scripts/major_mvp_product_start.py",
            "quality_knowledge/repeat_risk/agent_analysis.py",
            "config/runtime/agents/major_issue.repeat_similarity.yaml",
            "config/runtime/agents/major_issue.repeat_solution.yaml",
            "config/runtime/agents/major_issue.repeat_case.yaml",
            "quality_knowledge/major_cases/runtime_provider.py",
            "quality_knowledge/web/static/major_production.js",
            "services/major_case_production.py",
            "runtime/__init__.py",
            "prompts/similarity_analyzer.md",
            "prompts/solution_analyzer.md",
            "prompts/repeat_decision.md",
          )
          for rel in required:
              assert (dut/rel).is_file(), "MISSING_FULL_PACKAGE_FILE=" + rel
              assert m["file_sha256"][rel] == hashlib.sha256((dut/rel).read_bytes()).hexdigest()
          assert not list(dut.rglob("*.db"))
          assert not list(dut.rglob("*.env"))
          assert not list(dut.rglob("*.sqlite3"))
          assert not list(dut.rglob("*.pem"))
          (folder/"DUT_PATH").write_text(str(dut), encoding="utf-8")
          h=hashlib.sha256(archive.read_bytes()).hexdigest()
          (folder/"FULL_PACKAGE_SHA256").write_text(h,encoding="ascii")
          print("DUT="+str(dut))
          print("FULL_PACKAGE_SHA256="+h)
          print("FULL_MANIFEST_AND_EXTRACT=PASS")
          PY
          DUT="$(cat "$RUNNER_TEMP/major614/DUT_PATH")"
          cd "$DUT"
          python -m venv "$DUT/.venv"
          "$DUT/.venv/bin/python" -m pip install --disable-pip-version-check -r "$DUT/requirements-major-mvp-product.txt"
          "$DUT/.venv/bin/python" -c 'import xlrd; assert xlrd.__version__ == "2.0.2"'
          env -u PYTHONPATH "$DUT/.venv/bin/python" scripts/major_mvp_product_start.py --check
          echo 'FRESH_EXTRACT_LINUX_START_CHECK=PASS'
          echo 'LINUX_PACKAGED_XLRD=PASS'
      - name: Run Chromium real DOM click from extracted package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          DUT="$(cat "$RUNNER_TEMP/major614/DUT_PATH")"
          cd "$DUT"
          "$DUT/.venv/bin/python" scripts/major_mvp_product_start.py --data-root "$RUNNER_TEMP/major614/data" --host 127.0.0.1 --port 18080 > "$RUNNER_TEMP/major614/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/p0/major-production >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/p0/major-production >/dev/null
          curl -fsS -X POST -F "group_code=MAJOR" -F "domain=QUALITY" -F "file=@$GITHUB_WORKSPACE/tests/fixtures/major_v5/cases.xls;type=application/vnd.ms-excel" http://127.0.0.1:18080/api/v2/major-production/excel/preview -o "$RUNNER_TEMP/major614/xls-preview.json"
          "$DUT/.venv/bin/python" - "$RUNNER_TEMP/major614/xls-preview.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding="utf-8"))
          assert result.get("batch_id") and result.get("rows"), list(result)
          print("LINUX_PACKAGED_RUNTIME_TRUE_XLS_PREVIEW=PASS")
          PY
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q tests/e2e/test_major_linux_full_click_614.py
          echo 'LINUX_CHROMIUM_REAL_DOM_GATE=PASS'
      - name: Explicit Provider status
        if: always()
        run: |
          echo 'REAL_PROVIDER_D01_CALLED=NO'
          echo 'REAL_PROVIDER_REPEAT_CALLED=NO'
          echo 'LINUX_REAL_PROVIDER_E2E_GATE=NOT_RUN_NO_AUTHORIZED_PROVIDER_IN_CI'
          echo 'WINDOWS_FIELD_GATE=NOT_RUN'
          echo 'READY_FOR_MANUAL_VALIDATION=NO'
      - name: Stage evidence for archive
        if: always()
        shell: bash
        run: |
          mkdir -p linux614-artifacts
          cp -f "$RUNNER_TEMP"/major614/*.zip linux614-artifacts/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/major614/*.sha256 linux614-artifacts/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/major614/FULL_PACKAGE_SHA256 linux614-artifacts/ 2>/dev/null || true
      - name: Upload full Linux candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-v11-linux-full-candidate-614
          path: linux614-artifacts/
          if-no-files-found: warn
          retention-days: 30

  macos-primary-native:
    name: macOS .command native XLS + browser (primary)
    needs: linux-full-candidate
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout exact source for Golden test assets
        uses: actions/checkout@v4
        with:
          ref: feature/major-v11-linux-full-agent-e2e-614
          persist-credentials: false
      - name: Python 3.11 native on macOS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same full Candidate built by Linux
        uses: actions/download-artifact@v4
        with:
          name: major-v11-linux-full-candidate-614
          path: ${{ runner.temp }}/major614/downloaded
      - name: Verify ZIP SHA and run packaged macOS .command
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          mkdir -p "$RUNNER_TEMP/major614/extracted"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile
          folder=Path(os.environ["RUNNER_TEMP"])/"major614"
          candidates=list((folder/"downloaded").glob("*.zip"))
          assert len(candidates)==1,[str(p) for p in candidates]
          archive=candidates[0]
          expected=(folder/"downloaded"/"FULL_PACKAGE_SHA256").read_text().strip()
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual==expected,(actual,expected)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
          # macOS native ditto (unlike Python extractall) preserves executable
          # Unix mode bits, required for Finder double-click .command files.
          subprocess.run(["ditto","-x","-k",str(archive),str(folder/"extracted")],check=True)
          dut=next((folder/"extracted").iterdir())
          manifest=json.loads((dut/"PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          sha=subprocess.check_output(["git","-C",os.environ["GITHUB_WORKSPACE"],"rev-parse","HEAD"],text=True).strip()
          assert manifest["source_commit"]==sha,(sha,manifest["source_commit"])
          assert (dut/"START_MAJOR_MVP.command").is_file()
          (folder/"DUT_PATH").write_text(str(dut),encoding="utf-8")
          print("MACOS_SOURCE_HEAD="+sha)
          print("MACOS_PACKAGE_SHA256="+actual)
          print("MACOS_ARCH="+subprocess.check_output(["uname","-m"],text=True).strip())
          print("MACOS_FULL_PACKAGE_FRESH_EXTRACT=PASS")
          PY
          DUT="$(cat "$RUNNER_TEMP/major614/DUT_PATH")"
          cd "$DUT"
          test -x "$DUT/START_MAJOR_MVP.command"
          test -x "$DUT/START_MAJOR_MVP.sh"
          PYTHON=python3 "$DUT/START_MAJOR_MVP.command" --check
          "$DUT/.venv/bin/python" -c 'import xlrd; assert xlrd.__version__=="2.0.2"'
          echo 'MACOS_NATIVE_COMMAND_AND_ISOLATED_XLRD=PASS'
      - name: Actual binary XLS and Chromium page from native packaged app
        shell: bash
        run: |
          set -euo pipefail
          DUT="$(cat "$RUNNER_TEMP/major614/DUT_PATH")"
          cd "$DUT"
          "$DUT/.venv/bin/python" scripts/major_mvp_product_start.py --data-root "$RUNNER_TEMP/major614/macos-data" --host 127.0.0.1 --port 18080 > "$RUNNER_TEMP/major614/mac-app.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18080/p0/major-production >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -X POST -F "group_code=MAJOR" -F "domain=QUALITY" -F "file=@$GITHUB_WORKSPACE/tests/fixtures/major_v5/cases.xls;type=application/vnd.ms-excel" http://127.0.0.1:18080/api/v2/major-production/excel/preview -o "$RUNNER_TEMP/major614/macos-xls.json"
          "$DUT/.venv/bin/python" - "$RUNNER_TEMP/major614/macos-xls.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert data.get("batch_id") and data.get("rows"), list(data)
          print("MACOS_TRUE_BINARY_XLS_PREVIEW_IN_PACKAGED_RUNTIME=PASS")
          PY
          cd "$GITHUB_WORKSPACE"
          # UI test tools are outside DUT .venv and may NOT install xlrd in it.
          python -m pip install --disable-pip-version-check pytest==8.4.2 playwright==1.56.0 openpyxl pypdf
          python -m playwright install chromium
          python -m pytest -q tests/e2e/test_major_linux_full_click_614.py
          echo 'MACOS_REAL_CHROMIUM_CONFIRM_AND_69_ROW_PAGING=PASS'
      - name: Keep real Provider and user-device Gate separate
        if: always()
        run: |
          echo 'MACOS_CI_REAL_PROVIDER_CALL=NOT_RUN'
          echo 'MACOS_USER_DEVICE_GATE=NOT_RUN'
          echo 'MACOS_REAL_PROVIDER_E2E_GATE=NOT_RUN'
          echo 'WINDOWS_FIELD_GATE=NOT_RUN'
          echo 'READY_FOR_MANUAL_VALIDATION=NO'
