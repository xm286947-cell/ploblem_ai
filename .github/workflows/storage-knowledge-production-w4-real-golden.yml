name: Storage Knowledge Production W4 Real Golden - Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/storage-public-knowledge-inline
    paths:
      - ".github/workflows/storage-knowledge-production-w4-real-golden.yml"

permissions:
  contents: read

jobs:
  real-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_KNOWLEDGE_SOURCE_SHA: 29e7f0de8c9ec2a2e880629371d6bcf442b167a6
      RUNTIME_SOURCE_SHA: 9e36eeb0237459b884ee0d3e663ccf5833bfc685
      KIOXIA_URL: https://americas.kioxia.com/content/dam/kioxia/en-us/business/memory/asset/KIOXIA-SSD-NAND-Endurance-Tech-Brief.pdf
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      STORAGE_LIFE_EXECUTION_MODE: runtime
      STORAGE_MODEL_CONFIG: ${{ github.workspace }}/config/runtime/model.yaml
      UNIFIED_AGENT_RUNTIME_ROOT: ${{ github.workspace }}/.runtime-pinned
      STORAGE_KNOWLEDGE_REPOSITORY_DIR: ${{ runner.temp }}/w4-kp-repository
      STORAGE_KNOWLEDGE_RELEASE_DIR: ${{ runner.temp }}/w4-release/current
      PUBLIC_KNOWLEDGE_API_URL: http://127.0.0.1:9000
      STORAGE_WEB_HOST: 127.0.0.1
      STORAGE_WEB_PORT: "8765"

    steps:
      - name: Checkout W4 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical Unified Agent Runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SOURCE_SHA }}
          path: .runtime-pinned
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require real provider configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DASHSCOPE_BASE_URL" || { echo "::error::DASHSCOPE_BASE_URL is not configured"; exit 2; }
          test -n "$DASHSCOPE_API_KEY" || { echo "::error::DASHSCOPE_API_KEY is not configured"; exit 2; }
          echo "REAL_PROVIDER_CONFIG=AVAILABLE"

      - name: Install existing product runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r products/storage_rc1/requirements.txt
          python -m pip install -r .runtime-pinned/requirements-runtime-p0-test.txt

      - name: Start pinned Public Knowledge service
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/w4-pkr"
          mkdir -p "$RUNNER_TEMP/w4-pkr"
          git archive "$PUBLIC_KNOWLEDGE_SOURCE_SHA"             public_knowledge_rag Dockerfile compose.yaml start.sh stop.sh scripts/health.sh             | tar -x -C "$RUNNER_TEMP/w4-pkr"
          (
            cd "$RUNNER_TEMP/w4-pkr"
            bash ./start.sh
          )
          curl --fail-with-body --silent --show-error http://127.0.0.1:9000/health             | tee "$RUNNER_TEMP/pkr-health.json"
          echo "PUBLIC_KNOWLEDGE_SERVICE=READY"

      - name: Prepare isolated real Knowledge Release workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/w4-release" "$STORAGE_KNOWLEDGE_REPOSITORY_DIR"
          mkdir -p "$RUNNER_TEMP/w4-release" "$STORAGE_KNOWLEDGE_REPOSITORY_DIR"
          cp -a products/storage_rc1/knowledge_release/current "$RUNNER_TEMP/w4-release/current"
          echo "W4_RELEASE_WORKSPACE=ISOLATED"

      - name: Start real Storage product
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/products/storage_rc1:${{ github.workspace }}:${{ github.workspace }}/.runtime-pinned
        run: |
          set -euo pipefail
          (
            cd products/storage_rc1
            nohup python -m uvicorn storage_life.app:app               --host "$STORAGE_WEB_HOST" --port "$STORAGE_WEB_PORT"               >"$RUNNER_TEMP/storage-w4.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/storage-w4.pid"
          )
          ok=0
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8765/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat "$RUNNER_TEMP/storage-w4.log"
            exit 2
          fi
          curl --fail-with-body --silent --show-error http://127.0.0.1:8765/api/health             | tee "$RUNNER_TEMP/storage-health.json"
          echo "STORAGE_PRODUCT=READY"

      - name: Download real public KIOXIA NAND source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors             --output "$RUNNER_TEMP/STDL-EXT-001_kioxia_endurance.pdf" "$KIOXIA_URL"
          test "$(head -c 4 "$RUNNER_TEMP/STDL-EXT-001_kioxia_endurance.pdf")" = "%PDF"
          sha256sum "$RUNNER_TEMP/STDL-EXT-001_kioxia_endurance.pdf"             | tee "$RUNNER_TEMP/source.sha256"
          echo "REAL_SOURCE=YES"

      - name: Import exact PDF through Storage Public Knowledge product path
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST "http://127.0.0.1:8765/api/public-knowledge/sources/import-file?mode=LIVE"             -F "title=KIOXIA How Does Endurance Work in SSDs"             -F "classification=PUBLIC"             -F "publisher=KIOXIA Corporation"             -F "source_uri=$KIOXIA_URL"             -F "file=@$RUNNER_TEMP/STDL-EXT-001_kioxia_endurance.pdf;type=application/pdf"             | tee "$RUNNER_TEMP/import.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"import.json"
          d=json.loads(p.read_text())
          assert d.get("source_id"), d
          assert d.get("source_revision"), d
          assert d.get("publisher") == "KIOXIA Corporation", d
          assert d.get("locator_status") == "READY", d
          print("PUBLIC_KNOWLEDGE_IMPORT=PASS")
          print("PUBLIC_SOURCE_ID="+str(d["source_id"]))
          print("PUBLIC_SOURCE_REVISION="+str(d["source_revision"]))
          PY

      - name: Model Scan pe_cycles with real evidence anchor
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ID="$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"import.json").read_text())["source_id"])')"
          export SOURCE_ID
          python - <<'PY' > "$RUNNER_TEMP/model-scan-request.json"
          import json, os
          print(json.dumps({
            "source_id": os.environ["SOURCE_ID"],
            "device_type": "NAND Flash",
            "parameter_names": ["pe_cycles"],
            "top_k_per_parameter": 3
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error             -X POST "http://127.0.0.1:8765/api/public-knowledge/model-scan?mode=LIVE"             -H "Content-Type: application/json"             --data-binary "@$RUNNER_TEMP/model-scan-request.json"             | tee "$RUNNER_TEMP/model-scan.json"
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"model-scan.json").read_text())
          params=d.get("parameters") or []
          row=next((x for x in params if x.get("canonical_name")=="pe_cycles"), None)
          assert row is not None, d
          assert row.get("coverage_status")=="FOUND", row
          hits=row.get("hits") or []
          assert hits, row
          assert any(isinstance(h.get("locator"),dict) and h["locator"].get("page") for h in hits), hits
          assert "PARAMETER_DEFINITION" in (row.get("knowledge_requirements") or []), row
          print("MODEL_SCAN=PASS")
          print("MODEL_EVIDENCE_ANCHOR=PASS")
          print("PE_CYCLES_HIT_COUNT="+str(len(hits)))
          for h in hits[:3]:
              loc=h.get("locator") or {}
              print("PE_CYCLES_CITATION="+str(h.get("hit_id"))+" PAGE="+str(loc.get("page"))+" SECTION="+str(loc.get("section") or ""))
          PY

      - name: Knowledge Production real-provider preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             http://127.0.0.1:8765/api/product/knowledge-production/provider-status             | tee "$RUNNER_TEMP/provider-status.json"
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"provider-status.json").read_text())
          assert d.get("configured") is True, d
          assert d.get("execution_ready") is True, d
          assert d.get("credential_present") is True, d
          assert d.get("model_ref") == "qwen_prod", d
          assert d.get("transport_status") == "REACHABLE", d
          print("PROVIDER_PREFLIGHT=PASS")
          print("PROVIDER="+str(d.get("provider")))
          print("MODEL="+str(d.get("model")))
          PY

      - name: Existing Knowledge Production extraction from exact Public revision
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ID="$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"import.json").read_text())["source_id"])')"
          REVISION_ID="$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"import.json").read_text())["source_revision"])')"
          export SOURCE_ID REVISION_ID
          python - <<'PY' > "$RUNNER_TEMP/extract-request.json"
          import json, os
          print(json.dumps({
            "source_id": os.environ["SOURCE_ID"],
            "revision_id": os.environ["REVISION_ID"],
            "device_type": "NAND Flash",
            "parameter_names": ["pe_cycles"],
            "top_k_per_parameter": 3
          }, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error --max-time 360             -X POST "http://127.0.0.1:8765/api/public-knowledge/knowledge-production/extract?mode=LIVE"             -H "Content-Type: application/json"             --data-binary "@$RUNNER_TEMP/extract-request.json"             | tee "$RUNNER_TEMP/extract.json"
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"extract.json").read_text())
          assert d.get("status")=="PENDING_REVIEW", d
          assert d.get("candidate_count",0) > 0, d
          assert d.get("candidate_ids"), d
          assert d.get("formal_knowledge_published") is False, d
          print("EXISTING_KP_REUSED=YES")
          print("CANDIDATE_CREATED=YES")
          print("CANDIDATE_COUNT="+str(d["candidate_count"]))
          for cid in d["candidate_ids"]:
              print("CANDIDATE_ID="+str(cid))
          PY

      - name: Capture Candidate and Evidence for human semantic review
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/products/storage_rc1:${{ github.workspace }}:${{ github.workspace }}/.runtime-pinned
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w4-review-evidence/candidates" "$RUNNER_TEMP/w4-review-evidence/evidence"
          cp "$RUNNER_TEMP/import.json" "$RUNNER_TEMP/w4-review-evidence/"
          cp "$RUNNER_TEMP/model-scan.json" "$RUNNER_TEMP/w4-review-evidence/"
          cp "$RUNNER_TEMP/provider-status.json" "$RUNNER_TEMP/w4-review-evidence/"
          cp "$RUNNER_TEMP/extract.json" "$RUNNER_TEMP/w4-review-evidence/"
          cp "$RUNNER_TEMP/source.sha256" "$RUNNER_TEMP/w4-review-evidence/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["STORAGE_KNOWLEDGE_REPOSITORY_DIR"])
          out=Path(os.environ["RUNNER_TEMP"])/"w4-review-evidence"
          ext=json.loads((Path(os.environ["RUNNER_TEMP"])/"extract.json").read_text())
          reviewable=False
          all_evidence=True
          summaries=[]
          for cid in ext["candidate_ids"]:
              cp=root/"knowledge"/"production"/"candidates"/f"{cid}.json"
              assert cp.is_file(), cp
              candidate=json.loads(cp.read_text())
              (out/"candidates"/f"{cid}.json").write_text(json.dumps(candidate,ensure_ascii=False,indent=2))
              storage=((candidate.get("metadata") or {}).get("storage_lifetime") or {})
              params=storage.get("canonical_parameters") or []
              semantic=storage.get("semantic_class_candidates") or []
              if "pe_cycles" in params and "PARAMETER_DEFINITION" in semantic:
                  reviewable=True
              ev_rows=[]
              for eid in candidate.get("evidence_refs") or []:
                  ep=root/"knowledge"/"production"/"evidence"/f"{eid}.json"
                  if not ep.is_file():
                      all_evidence=False
                      continue
                  payload=json.loads(ep.read_text())
                  (out/"evidence"/f"{eid}.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2))
                  ev_rows.append({
                    "evidence_id":eid,
                    "source_id":payload.get("source_id"),
                    "locator":payload.get("locator"),
                    "quote":payload.get("quote") or payload.get("excerpt") or payload.get("text")
                  })
              summaries.append({
                "candidate_id":cid,
                "object_type":candidate.get("object_type"),
                "title":candidate.get("title"),
                "content":candidate.get("content"),
                "scope":candidate.get("scope"),
                "tags":candidate.get("tags"),
                "storage_lifetime":storage,
                "evidence":ev_rows,
              })
          assert all_evidence, summaries
          assert reviewable, summaries
          (out/"human-review-input.json").write_text(json.dumps(summaries,ensure_ascii=False,indent=2))
          print("EVIDENCE_TRACEABLE=YES")
          print("PARAMETER_BINDING_REVIEWABLE=YES")
          print("W4_HUMAN_REVIEW_INPUT_BEGIN")
          print(json.dumps(summaries,ensure_ascii=False,indent=2)[:30000])
          print("W4_HUMAN_REVIEW_INPUT_END")
          PY
          for cid in $(python -c 'import json,os,pathlib; print(" ".join(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"extract.json").read_text())["candidate_ids"]))'); do
            curl --fail-with-body --silent --show-error               "http://127.0.0.1:8765/knowledge-production/candidates/$cid"               > "$RUNNER_TEMP/w4-review-evidence/candidate-$cid.html"
          done

      - name: W4 Phase 1 decision
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TASK=STORAGE-KNOWLEDGE-PRODUCTION-W4-REAL-GOLDEN-001"
            echo "PHASE=W4-A1_REAL_CANDIDATE"
            echo "REAL_SOURCE=YES"
            echo "PUBLIC_KNOWLEDGE_IMPORT=PASS"
            echo "MODEL_SCAN=PASS"
            echo "MODEL_EVIDENCE_ANCHOR=PASS"
            echo "PROVIDER_PREFLIGHT=PASS"
            echo "EXISTING_KP_REUSED=YES"
            echo "CANDIDATE_CREATED=YES"
            echo "EVIDENCE_TRACEABLE=YES"
            echo "PARAMETER_BINDING_REVIEWABLE=YES"
            echo "FORMAL_KNOWLEDGE_PUBLISHED=NO"
            echo "NEXT=HUMAN_SEMANTIC_REVIEW"
          } | tee "$RUNNER_TEMP/w4-review-evidence/RESULT.txt"

      - name: Upload real W4 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: storage-w4-real-golden-human-review
          path: ${{ runner.temp }}/w4-review-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Dump service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Storage W4 log ====="
          cat "$RUNNER_TEMP/storage-w4.log" 2>/dev/null || true
          echo "===== Public Knowledge container log ====="
          docker logs storage-public-knowledge 2>/dev/null || true
