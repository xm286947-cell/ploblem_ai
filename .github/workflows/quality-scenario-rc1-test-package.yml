name: Quality Scenario RC1 Test Package

on:
  push:
    branches:
      - release/quality-scenario-mvp-rc1-test-package
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout validated Runtime dependency
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 0959da43008307398a9cac0f9abfc7fec26dcb8a
          path: .deps/unified-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install product dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Runtime dependencies
        run: python -m pip install -r .deps/unified-agent-runtime/requirements-runtime-p0-test.txt

      - name: Re-run RC1 Golden E2E before packaging
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.deps/unified-agent-runtime
        run: python -m pytest tests/test_quality_scenario_rc1_golden_e2e.py -q

      - name: Build test package
        run: python scripts/build_quality_scenario_rc1_test_package.py --runtime-root .deps/unified-agent-runtime --output-root dist

      - name: Verify packaged runtime boundary
        working-directory: dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924:${{ github.workspace }}/dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924/vendor/unified_agent_runtime
        run: |
          python -m compileall -q quality_knowledge vendor/unified_agent_runtime/runtime tools
          python tools/verify_quality_scenario_rc1_package.py
          node --check quality_knowledge/web/static/p0_scenario_workbench.js
          node --check quality_knowledge/web/static/p0_scenario_library.js
          node --check quality_knowledge/web/static/p0_scenario_detail.js

      - name: Remove generated bytecode from delivery
        run: |
          find dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924 -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Check package safety
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924")
          forbidden={".db",".sqlite",".sqlite3",".log",".xlsx",".xls",".xlsm",".pdf",".doc",".docx",".pyc",".pyo"}
          bad=[str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() in forbidden]
          assert not bad, bad
          assert not (root/".git").exists()
          assert not (root/"output").exists()
          assert not (root/"knowledge").exists()
          print("PACKAGE_SAFETY=PASS")
          PY

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924
          path: dist/QUALITY_SCENARIO_MVP_RC1_TEST_PACKAGE_20260924/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
