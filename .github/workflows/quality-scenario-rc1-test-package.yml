name: Quality Scenario RC1 Defect 126 Package

on:
  push:
    branches:
      - release/quality-scenario-mvp-rc1-test-package
      - fix/quality-scenario-rc1-package-defect-126
  workflow_dispatch:

env:
  PACKAGE_NAME: QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
  PRODUCT_BASELINE: 6ad93f1396585163fffd1e4a70a677aee917a6ff
  RUNTIME_BASELINE: 0959da43008307398a9cac0f9abfc7fec26dcb8a
  TEST_BASELINE: 1f7cf2415abb37fb59ba205c5d566b7b22f0354d

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout package fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen product baseline
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 6ad93f1396585163fffd1e4a70a677aee917a6ff
          path: .baseline/product

      - name: Checkout frozen product-test assets
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 1f7cf2415abb37fb59ba205c5d566b7b22f0354d
          path: .frozen-tests

      - name: Checkout validated Runtime dependency
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 0959da43008307398a9cac0f9abfc7fec26dcb8a
          path: .deps/unified-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and product dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r .deps/unified-agent-runtime/requirements-runtime-p0-test.txt

      - name: Verify product code baseline is frozen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              '.github/workflows/quality-scenario-rc1-test-package.yml',
              'scripts/build_quality_scenario_rc1_test_package.py',
              'scripts/verify_quality_scenario_rc1_package_closure.py',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','6ad93f1396585163fffd1e4a70a677aee917a6ff...HEAD'],
              text=True,
          ).splitlines())
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit('PRODUCT_CODE_CHANGED_UNEXPECTED:' + ','.join(unexpected))
          print('PRODUCT_CODE_CHANGED=NO')
          print('PRODUCT_BASELINE=6ad93f1396585163fffd1e4a70a677aee917a6ff')
          PY

      - name: Re-run RC1 Golden E2E before packaging
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.deps/unified-agent-runtime
        run: python -m pytest tests/test_quality_scenario_rc1_golden_e2e.py -q

      - name: Build defect 126 candidate directory
        run: python scripts/build_quality_scenario_rc1_test_package.py --runtime-root .deps/unified-agent-runtime --output-root dist

      - name: Compile and verify packaged runtime boundary
        working-directory: dist/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python -m compileall -q quality_knowledge models vendor/unified_agent_runtime/runtime tools
          python tools/verify_quality_scenario_rc1_package.py
          node --check quality_knowledge/web/static/p0_scenario_workbench.js
          node --check quality_knowledge/web/static/p0_scenario_library.js
          node --check quality_knowledge/web/static/p0_scenario_detail.js

      - name: Remove generated self-check artifacts from candidate
        shell: bash
        run: |
          find "dist/$PACKAGE_NAME" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "dist/$PACKAGE_NAME" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.log' \) -delete
          rm -rf "dist/$PACKAGE_NAME/output" "dist/$PACKAGE_NAME/data"
          echo 'PACKAGE_SELF_CHECK_ARTIFACT_CLEANUP=PASS'

      - name: Package dependency closure
        run: |
          python scripts/verify_quality_scenario_rc1_package_closure.py \
            --baseline-root .baseline/product \
            --package-root "dist/$PACKAGE_NAME"

      - name: Secret and internal-data static scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('dist')/Path(__import__('os').environ['PACKAGE_NAME'])
          forbidden_suffixes={'.db','.sqlite','.sqlite3','.log','.xlsx','.xls','.xlsm','.pdf','.doc','.docx','.pyc','.pyo'}
          bad=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in forbidden_suffixes]
          assert not bad, 'FORBIDDEN_INTERNAL_DATA_FILES:' + ','.join(bad)
          forbidden_dirs={'.git','knowledge','input','output','outputs'}
          bad_dirs=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_dir() and p.name in forbidden_dirs]
          assert not bad_dirs, 'FORBIDDEN_INTERNAL_DATA_DIRS:' + ','.join(bad_dirs)
          text_suffixes={'.py','.json','.yaml','.yml','.md','.txt','.bat','.js','.html','.css'}
          secret_patterns=[
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}'),
          ]
          secret_hits=[]
          internal_hits=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_suffixes:
                  continue
              try: data=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if any(rx.search(data) for rx in secret_patterns):
                  secret_hits.append(str(p.relative_to(root)))
              if '"contains_internal_real_data": true' in data.lower():
                  internal_hits.append(str(p.relative_to(root)))
          assert not secret_hits, 'SECRET_SCAN_HITS:' + ','.join(secret_hits)
          assert not internal_hits, 'INTERNAL_DATA_MARKER_HITS:' + ','.join(internal_hits)
          print('SECRET_SCAN=PASS')
          print('INTERNAL_DATA_SCAN=PASS')
          PY

      - name: Create exact candidate ZIP and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          name=os.environ['PACKAGE_NAME']
          root=Path('dist')/name
          zip_path=Path('dist')/(name+'.zip')
          if zip_path.exists(): zip_path.unlink()
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, (Path(name)/p.relative_to(root)).as_posix())
          digest=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          metadata={
              'package_name': zip_path.name,
              'sha256': digest,
              'package_size': zip_path.stat().st_size,
              'build_commit': os.environ.get('GITHUB_SHA',''),
              'product_baseline': os.environ['PRODUCT_BASELINE'],
              'runtime_baseline': os.environ['RUNTIME_BASELINE'],
              'defect_id': '#126',
          }
          (Path('dist')/'PACKAGE_METADATA.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print('NEW_PACKAGE_NAME='+zip_path.name)
          print('NEW_SHA256='+digest)
          print('PACKAGE_SIZE='+str(zip_path.stat().st_size))
          print('BUILD_COMMIT='+metadata['build_commit'])
          PY

      - name: Fresh extract candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/fresh_linux
          mkdir -p dist/fresh_linux
          python -m zipfile -e "dist/$PACKAGE_NAME.zip" dist/fresh_linux
          test -f "dist/fresh_linux/$PACKAGE_NAME/models/common.py"
          echo 'FRESH_EXTRACT=PASS'

      - name: Fresh Extract Import Smoke
        working-directory: dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python - <<'PY'
          import models.common
          import quality_knowledge
          import quality_knowledge.models.issue
          import quality_knowledge.web.app
          import quality_knowledge.web.p0_app
          import quality_knowledge.quality_scenario_v1
          import quality_knowledge.quality_scenario_v1_store
          import quality_knowledge.quality_scenario_candidate_v1_service
          import quality_knowledge.quality_scenario_v1_workflow_service
          import quality_knowledge.quality_scenario_traceability_service
          print('IMPORT_SMOKE=PASS')
          PY

      - name: Overlay frozen tests outside candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/fresh_linux/$PACKAGE_NAME/tests"
          cp -R .frozen-tests/tests "dist/fresh_linux/$PACKAGE_NAME/tests"

      - name: pytest Collection Gate
        working-directory: dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python -m pytest --collect-only -q \
            tests/product_test/quality_scenario_rc1/test_quality_scenario_product_baseline.py \
            tests/test_quality_scenario_candidate_v1_service.py \
            tests/test_quality_scenario_v1_workflow_service.py \
            tests/test_quality_scenario_traceability.py \
            tests/test_quality_scenario_rc1_golden_e2e.py
          echo 'PYTEST_COLLECTION=PASS'
          echo 'COLLECTION_ERROR=0'

      - name: Mock Provider Smoke
        working-directory: dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python -m pytest -q tests/product_test/quality_scenario_rc1/test_quality_scenario_product_baseline.py::test_qs_pt_001_openai_mock_contract_and_runtime_secret_safety
          echo 'MOCK_PROVIDER_SMOKE=PASS'

      - name: Fresh Extract Startup Smoke
        working-directory: dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_linux/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          set -euo pipefail
          python tools/run_quality_scenario_rc1.py --db data/startup_smoke.db --host 127.0.0.1 --port 18080 > startup_smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          url='http://127.0.0.1:18080/p0/quality-scenarios/workbench'
          last=None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url,timeout=1) as response:
                      if response.status == 200:
                          print('FRESH_EXTRACT_STARTUP=PASS')
                          break
              except Exception as error:
                  last=error
                  time.sleep(0.25)
          else:
              raise SystemExit(f'STARTUP_SMOKE_FAILED:{last}')
          PY
          kill $pid
          wait $pid || true
          trap - EXIT
          echo 'LINUX_PACKAGE_SMOKE=PASS'

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
          path: |
            dist/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1.zip
            dist/PACKAGE_METADATA.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos-smoke:
    needs: build-linux
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen product-test assets
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 1f7cf2415abb37fb59ba205c5d566b7b22f0354d
          path: .frozen-tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact Linux-built candidate
        uses: actions/download-artifact@v4
        with:
          name: QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
          path: dist

      - name: Verify SHA and fresh extract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          meta=json.loads(Path('dist/PACKAGE_METADATA.json').read_text(encoding='utf-8'))
          p=Path('dist')/meta['package_name']
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==meta['sha256'], (actual,meta['sha256'])
          print('SHA256=PASS')
          PY
          mkdir -p dist/fresh_mac
          python -m zipfile -e "dist/$PACKAGE_NAME.zip" dist/fresh_mac
          echo 'FRESH_EXTRACT=PASS'

      - name: Install candidate dependencies
        run: |
          python -m pip install -r "dist/fresh_mac/$PACKAGE_NAME/requirements.txt"
          python -m pip install -r "dist/fresh_mac/$PACKAGE_NAME/vendor/unified_agent_runtime/requirements-runtime-p0-test.txt"

      - name: macOS import smoke
        working-directory: dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python tools/verify_quality_scenario_rc1_package.py
          python - <<'PY'
          import models.common
          import quality_knowledge.models.issue
          import quality_knowledge.web.app
          import quality_knowledge.web.p0_app
          print('IMPORT_SMOKE=PASS')
          PY

      - name: Overlay frozen tests outside candidate ZIP
        shell: bash
        run: |
          rm -rf "dist/fresh_mac/$PACKAGE_NAME/tests"
          cp -R .frozen-tests/tests "dist/fresh_mac/$PACKAGE_NAME/tests"

      - name: macOS collection and Mock smoke
        working-directory: dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          python -m pytest --collect-only -q \
            tests/product_test/quality_scenario_rc1/test_quality_scenario_product_baseline.py \
            tests/test_quality_scenario_candidate_v1_service.py \
            tests/test_quality_scenario_v1_workflow_service.py \
            tests/test_quality_scenario_traceability.py \
            tests/test_quality_scenario_rc1_golden_e2e.py
          python -m pytest -q tests/product_test/quality_scenario_rc1/test_quality_scenario_product_baseline.py::test_qs_pt_001_openai_mock_contract_and_runtime_secret_safety
          echo 'PYTEST_COLLECTION=PASS'
          echo 'COLLECTION_ERROR=0'
          echo 'MOCK_PROVIDER_SMOKE=PASS'

      - name: macOS Fresh Extract Startup
        working-directory: dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1
        env:
          PYTHONPATH: ${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1:${{ github.workspace }}/dist/fresh_mac/QUALITY_SCENARIO_MVP_RC1_DEFECT_126_FIX_CANDIDATE_20260925_R1/vendor/unified_agent_runtime
        run: |
          set -euo pipefail
          python tools/run_quality_scenario_rc1.py --db data/startup_smoke.db --host 127.0.0.1 --port 18081 > startup_smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          url='http://127.0.0.1:18081/p0/quality-scenarios/workbench'
          last=None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url,timeout=1) as response:
                      if response.status == 200:
                          print('FRESH_EXTRACT_STARTUP=PASS')
                          break
              except Exception as error:
                  last=error
                  time.sleep(0.25)
          else:
              raise SystemExit(f'STARTUP_SMOKE_FAILED:{last}')
          PY
          kill $pid
          wait $pid || true
          trap - EXIT
          echo 'MACOS_PACKAGE_SMOKE=PASS'
          echo 'LINUX_MAC_PACKAGE_SMOKE=PASS'
