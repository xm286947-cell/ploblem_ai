name: Storage R6 Complete Assembly

on:
  push:
    branches:
      - feature/storage-rc1-r6-complete-product-assembly
    paths:
      - "products/storage_rc1/**"
      - "knowledge_production/**"
      - "runtime/**"
      - "repositories/**"
      - "tests/test_kp_*.py"
      - ".github/workflows/storage-r6-complete-assembly.yml"
  workflow_dispatch:

jobs:
  complete-assembly-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r products/storage_rc1/requirements.txt
          python -m pip install pytest
      - name: Storage assembly tests
        env:
          PYTHONPATH: products/storage_rc1:.
        run: |
          python -m pytest -q             products/storage_rc1/tests/test_ui_next_issue132.py             products/storage_rc1/tests/test_storage_rc1_r6_f2_golden_a.py             products/storage_rc1/tests/test_storage_rc1_r6_complete_assembly.py             products/storage_rc1/tests/test_storage_product_mvp_rc1.py
      - name: Unified Knowledge core gates
        run: |
          python -m pytest -q             tests/test_kp_m01_source_document.py             tests/test_kp_m02_candidate_evidence.py             tests/test_kp_m03_ai_extraction.py             tests/test_kp_d01_business_candidate_intake.py             tests/test_kp_d02_evaluation.py             tests/test_kp_d03_review_publish.py             tests/test_kp_d04_release_query.py             tests/test_kp_d05_processing_ui.py             tests/test_kp_d06_storage_golden.py
      - name: Fresh extract startup and package gate
        env:
          PYTHONPATH: products/storage_rc1:.
        run: |
          rm -rf /tmp/storage-r6-fresh
          mkdir -p /tmp/storage-r6-fresh
          cp -a products/storage_rc1 /tmp/storage-r6-fresh/product
          cp -a knowledge_production runtime repositories config prompts /tmp/storage-r6-fresh/
          cd /tmp/storage-r6-fresh
          python - <<'PY'
          import os, sys
          sys.path[:0] = [os.getcwd(), os.path.join(os.getcwd(), "product")]
          from storage_life.app import app
          from storage_life.knowledge_release import KnowledgeReleaseConsumer
          paths = {getattr(route, "path", "") for route in app.router.routes}
          required = {
              "/api/health",
              "/api/documents/jobs",
              "/api/product/knowledge/status",
              "/api/product/knowledge-production/sources",
              "/knowledge-production/candidates",
              "/api/product/diagnostics",
              "/api/product/change-impact",
          }
          missing = sorted(required - paths)
          assert not missing, missing
          status = KnowledgeReleaseConsumer.current().status()
          assert status["available"] is True, status
          assert status["status"] == "READY", status
          print("FRESH_EXTRACT_STARTUP=PASS")
          print("KNOWLEDGE_RELEASE_VERSION="+status["knowledge_release_version"])
          print("KNOWLEDGE_SNAPSHOT_HASH="+status["snapshot_hash"])
          PY
          python product/scripts/package_gate.py
      - name: Build immutable candidate
        env:
          PYTHONPATH: products/storage_rc1:.
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          root=Path.cwd()
          out=root/"dist"
          out.mkdir(exist_ok=True)
          stage=out/"STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_20260925"
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir()
          for name in ["products/storage_rc1","knowledge_production","runtime","repositories","config","prompts"]:
              src=root/name
              dst=stage/("product" if name=="products/storage_rc1" else name)
              if src.is_dir(): shutil.copytree(src,dst)
          manifest=json.loads((root/"products/storage_rc1/knowledge_release/current/release_manifest.json").read_text())
          delivery={
              "package_id":"STORAGE-RC1-R6-COMPLETE-TEST-CANDIDATE-20260925",
              "package_type":"PRODUCT_TEST_CANDIDATE",
              "source_commit":os.environ["GITHUB_SHA"],
              "knowledge_release_version":manifest["knowledge_release_version"],
              "knowledge_snapshot_hash":manifest["snapshot_hash"],
              "completion_ceiling":"READY_FOR_FULL_PRODUCT_RETEST",
              "product_gate_pass":False,
              "rc1_pass":False,
          }
          (stage/"DELIVERY_MANIFEST.json").write_text(json.dumps(delivery,ensure_ascii=False,indent=2),encoding="utf-8")
          archive=shutil.make_archive(str(stage),"zip",root_dir=stage)
          digest=hashlib.sha256(Path(archive).read_bytes()).hexdigest()
          Path(archive+".sha256").write_text(digest+"  "+Path(archive).name+"\n",encoding="utf-8")
          print("PACKAGE="+archive)
          print("SHA256="+digest)
          print("SIZE="+str(Path(archive).stat().st_size))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_20260925
          path: |
            dist/STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_20260925.zip
            dist/STORAGE_PRODUCT_MVP_RC1_R6_COMPLETE_TEST_CANDIDATE_20260925.zip.sha256
          if-no-files-found: error
