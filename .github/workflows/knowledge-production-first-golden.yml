name: Knowledge Production First Real PDF Golden

on:
  pull_request:
    paths:
      - "knowledge_production/**"
      - "config/runtime/agents/knowledge.production.extract.yaml"
      - "prompts/runtime/knowledge_production/**"
      - "tests/test_kp_first_real_pdf_golden.py"
      - ".github/workflows/knowledge-production-first-golden.yml"

jobs:
  real-pdf-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate real PDF source and parse
        run: |
          python -m pytest -q \
            tests/test_kp_first_real_pdf_golden.py::test_kp_first_real_pdf_source_parse_preflight

  real-provider-golden:
    needs: real-pdf-source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KNOWLEDGE_PRODUCTION_REAL_GOLDEN: "1"
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require real provider configuration
        shell: bash
        run: |
          if [ -z "$DASHSCOPE_BASE_URL" ]; then
            echo "::error::Repository variable DASHSCOPE_BASE_URL is not configured."
            exit 2
          fi
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::Repository secret DASHSCOPE_API_KEY is not configured."
            exit 2
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run real PDF plus real provider golden path
        run: |
          python -m pytest -q \
            tests/test_kp_first_real_pdf_golden.py::test_kp_first_real_pdf_golden_path
