name: Overall R2 W2 Gate

on:
  push:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/web/**"
      - "quality_knowledge/p04/**"
      - "tests/test_r2_w2_*.py"
      - ".github/workflows/overall-r2-w2-gate.yml"
  pull_request:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/web/**"
      - "quality_knowledge/p04/**"
      - "tests/test_r2_w2_*.py"

permissions:
  contents: read

jobs:
  w2-workspace-scenario-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Compile Overall and P04
        run: python -m compileall -q quality_knowledge/web quality_knowledge/p04

      - name: Run W2 focused regression
        run: |
          pytest -q \
            tests/test_r2_w2_*.py \
            tests/test_overall_frontend_shell.py \
            tests/test_overall_vnext_v03_frontend_binding.py \
            tests/test_p04_quality_scenario_insight.py \
            tests/test_p04_portrait_archive.py \
            tests/test_quality_scenario_workspace_binding.py
