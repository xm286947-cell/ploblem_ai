name: Overall R2 W2 Gate

on:
  push:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/web/overall_shell.py"
      - "quality_knowledge/web/templates/overall_*.html"
      - "quality_knowledge/web/templates/p0_base.html"
      - "quality_knowledge/web/static/overall_shell.css"
      - "tests/test_r2_w2_*.py"
      - "tests/test_overall_frontend_shell.py"
      - "tests/test_overall_frontend_parent_integration.py"
      - ".github/workflows/overall-r2-w2-gate.yml"
  pull_request:
    branches:
      - integration/overall-r2
    paths:
      - "quality_knowledge/web/overall_shell.py"
      - "quality_knowledge/web/templates/overall_*.html"
      - "quality_knowledge/web/templates/p0_base.html"
      - "quality_knowledge/web/static/overall_shell.css"
      - "tests/test_r2_w2_*.py"
      - "tests/test_overall_frontend_shell.py"
      - "tests/test_overall_frontend_parent_integration.py"

permissions:
  contents: read

jobs:
  w2-ia-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Compile Overall web
        run: python -m compileall -q quality_knowledge/web
      - name: Run Overall Shell baseline
        run: |
          pytest -q \
            tests/test_overall_frontend_shell.py \
            tests/test_overall_frontend_parent_integration.py
      - name: Run W2 focused tests when present
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/test_r2_w2_*.py)
          if (( ${#files[@]} )); then
            pytest -q "${files[@]}"
          else
            echo "No W2 focused tests yet; baseline gate only."
          fi
