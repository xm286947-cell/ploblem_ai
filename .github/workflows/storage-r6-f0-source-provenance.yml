name: Storage R6 F0 Source Provenance Closure

on:
  push:
    branches:
      - fix/storage-rc1-r6-source-provenance
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/storage-r6-f0-source-provenance.yml"
      - "products/storage_rc1/**"

permissions:
  contents: write

env:
  TARGET_BRANCH: fix/storage-rc1-r6-source-provenance
  BASE_COMMIT: 2f75be9caa057269f9f152896291d4006c0c3ebc
  SNAPSHOT_SHA256: d1d3753bcf959bf5f0dba02fa42f202cac4000115a201f5f06f1fb947a09901d
  SNAPSHOT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b850-81fd-b496-0de149e6510f/raw?se=2026-09-25T06%3A28%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=a6b87401-807f-5c01-a912-12cfd54df606&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T06%3A03%3A37Z&ske=2026-09-26T06%3A03%3A37Z&sks=b&skv=2026-02-06&sig=otfIUad1j6ZxiduUAjwItuGm/HZP4v8X4dRj57/Gsqg%3D'

jobs:
  f0-close:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact F0 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Download and verify frozen R5 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SNAPSHOT_URL" -o /tmp/storage_r5_source_snapshot.zip
          ACTUAL="$(sha256sum /tmp/storage_r5_source_snapshot.zip | awk '{print $1}')"
          echo "SOURCE_SNAPSHOT_SHA256=$ACTUAL"
          test "$ACTUAL" = "$SNAPSHOT_SHA256"

      - name: Restore snapshot unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf products/storage_rc1
          unzip -q /tmp/storage_r5_source_snapshot.zip -d /tmp/storage-r5-source
          test -d /tmp/storage-r5-source/products/storage_rc1
          mkdir -p products
          cp -a /tmp/storage-r5-source/products/storage_rc1 products/

      - name: Verify 122-file provenance exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("products/storage_rc1")
          manifest=json.loads((root/"SOURCE_PROVENANCE_R5.json").read_text(encoding="utf-8"))
          files=manifest["files"]
          missing=[]
          mismatch=[]
          for item in files:
              path=root/item["path"]
              if not path.is_file():
                  missing.append(item["path"])
                  continue
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item["sha256"] or path.stat().st_size != item["size"]:
                  mismatch.append(item["path"])
          matched=len(files)-len(missing)-len(mismatch)
          print(f"SOURCE_FILE_COUNT={len(files)}")
          print(f"PROVENANCE_SHA_MATCH={matched}/{len(files)}")
          print(f"MISSING={len(missing)}")
          print(f"MISMATCH={len(mismatch)}")
          assert len(files)==122
          assert matched==122
          assert not missing
          assert not mismatch
          ui=hashlib.sha256((root/"storage_life/index.html").read_bytes()).hexdigest()
          print(f"STORAGE_LIFE_INDEX_SHA256={ui}")
          assert ui=="87db47c5d6f023eddd1bfbdb61e465c8df41278785b58faf4542bbd39908c2f5"
          PY

      - name: Install declared Storage test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/storage-f0-venv
          /tmp/storage-f0-venv/bin/python -m pip install --disable-pip-version-check -q -r products/storage_rc1/requirements.txt

      - name: Minimum Storage import smoke
        shell: bash
        run: |
          set -euo pipefail
          cd products/storage_rc1
          /tmp/storage-f0-venv/bin/python - <<'PY'
          import storage_life
          import storage_life.app
          print("STORAGE_LIFE_IMPORT_SMOKE=PASS")
          PY

      - name: Commit exact snapshot to remote branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/storage_rc1
          if git diff --cached --quiet; then
            echo "SNAPSHOT_COMMIT=ALREADY_PRESENT"
          else
            git commit -m "chore(storage): restore formal R5 product source provenance"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "REMOTE_COMMIT=$(git rev-parse HEAD)"
          echo "remote_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Final F0 closure evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "TASK=STORAGE-RC1-R6-F0-SOURCE-PROVENANCE-001"
          echo "RESULT=PASS"
          echo "REMOTE_BRANCH=$TARGET_BRANCH"
          echo "REMOTE_COMMIT=${{ steps.commit.outputs.remote_commit }}"
          echo "SOURCE_FILE_COUNT=122"
          echo "PROVENANCE_SHA_MATCH=122/122"
          echo "MISSING=0"
          echo "MISMATCH=0"
          echo "STORAGE_LIFE_IMPORT_SMOKE=PASS"
          echo "ISSUE_132_FIXED=NO"
          echo "R5_CHANGED=NO"
          echo "NEXT_ALLOWED_STEP=STORAGE-RC1-R6-F1-ISSUE-132-FIX-001"
