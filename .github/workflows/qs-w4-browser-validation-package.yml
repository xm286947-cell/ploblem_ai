name: QS W4 Browser Validation Package FF838474

on:
  push:
    branches:
      - ci/qs-w4-package-ff838474
    paths:
      - ".github/workflows/qs-w4-browser-validation-package.yml"

permissions:
  contents: read

env:
  PRODUCT_SOURCE_SHA: ff838474ce6bb542915f059d35a80e2229cf4dda
  PACKAGE_BASENAME: QUALITY_SCENARIO_W4_BROWSER_VALIDATION_ff838474ce6b

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed product source
        uses: actions/checkout@v4
        with:
          ref: ff838474ce6bb542915f059d35a80e2229cf4dda
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE_SHA"
          git diff --check "$PRODUCT_SOURCE_SHA^..$PRODUCT_SOURCE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build W4 browser validation candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_step1b_qsv1_preview_package.py --output-dir dist
          SRC="dist/STEP1B_QSV1_MATURE_PREVIEW_${PRODUCT_SOURCE_SHA:0:12}.zip"
          DST="dist/${PACKAGE_BASENAME}.zip"
          mv "$SRC" "$DST"

          printf '%s\n'             'QUALITY SCENARIO W4 BROWSER VALIDATION CANDIDATE'             ''             'PACKAGE_TYPE=W4_BROWSER_VALIDATION_CANDIDATE'             "SOURCE_SHA=$PRODUCT_SOURCE_SHA"             'W5_RELEASE_PACKAGE=NO'             'BUSINESS_FLOW_CODE_WALKTHROUGH=PASS'             'CI_REMEDIATION=PASS'             'REAL_MATURE_BROWSER_GOLDEN=PENDING'             'W4_ARCH_REVIEW=PENDING'             'SYNTHETIC_BUSINESS_DATA_INCLUDED=NO'             ''             'Windows: bind mature DB with LEGACY_QUALITY_ISSUE_DB_PATH / QUALITY_SCENARIO_V1_DB_PATH, run start_quality_capability_p1.bat, open /software-assessment'             'macOS: bind mature DB with the same env vars, run ./start_quality_capability_p1.command, open /software-assessment'             > dist/00_W4_BROWSER_VALIDATION_README_FIRST.txt

          printf '%s\n'             '{'             '  "package_type": "W4_BROWSER_VALIDATION_CANDIDATE",'             "  \"source_sha\": \"$PRODUCT_SOURCE_SHA\","             '  "w5_release_package": false,'             '  "business_flow_walkthrough": "PASS",'             '  "remediation_ci": "PASS",'             '  "real_mature_browser_golden": "PENDING",'             '  "w4_arch_review": "PENDING",'             '  "synthetic_business_data_included": false,'             '  "windows_entry": "start_quality_capability_p1.bat",'             '  "macos_entry": "start_quality_capability_p1.command",'             '  "browser_entry": "/software-assessment",'             '  "legacy_db_env": "LEGACY_QUALITY_ISSUE_DB_PATH",'             '  "qsv1_db_env": "QUALITY_SCENARIO_V1_DB_PATH"'             '}'             > dist/W4_BROWSER_VALIDATION_MANIFEST.json

          printf '%s\n' "$PRODUCT_SOURCE_SHA" > dist/W4_PRODUCT_SOURCE_SHA

          (
            cd dist
            zip -q -u "${PACKAGE_BASENAME}.zip"               00_W4_BROWSER_VALIDATION_README_FIRST.txt               W4_BROWSER_VALIDATION_MANIFEST.json               W4_PRODUCT_SOURCE_SHA
          )

          sha256sum "dist/${PACKAGE_BASENAME}.zip" | tee "dist/${PACKAGE_BASENAME}.zip.sha256"
          printf '%s\n'             'PACKAGE_TYPE=W4_BROWSER_VALIDATION_CANDIDATE'             "SOURCE_SHA=$PRODUCT_SOURCE_SHA"             "PACKAGE=${PACKAGE_BASENAME}.zip"             'W5_RELEASE_PACKAGE=NO'             'REAL_MATURE_BROWSER_GOLDEN=PENDING'             'W4_ARCH_REVIEW=PENDING'             > "dist/${PACKAGE_BASENAME}_BUILD_INFO.txt"

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,os,zipfile,pathlib; p=pathlib.Path('dist')/(os.environ['PACKAGE_BASENAME']+'.zip'); z=zipfile.ZipFile(p); s=z.read('W4_PRODUCT_SOURCE_SHA').decode().strip(); m=json.loads(z.read('W4_BROWSER_VALIDATION_MANIFEST.json')); n=set(z.namelist()); assert s==os.environ['PRODUCT_SOURCE_SHA']; assert m['source_sha']==s; assert m['package_type']=='W4_BROWSER_VALIDATION_CANDIDATE'; assert 'start_quality_capability_p1.bat' in n; assert 'start_quality_capability_p1.command' in n; print('PACKAGE_IDENTITY=PASS')"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUALITY_SCENARIO_W4_BROWSER_VALIDATION_ff838474ce6b
          path: |
            dist/QUALITY_SCENARIO_W4_BROWSER_VALIDATION_ff838474ce6b.zip
            dist/QUALITY_SCENARIO_W4_BROWSER_VALIDATION_ff838474ce6b.zip.sha256
            dist/QUALITY_SCENARIO_W4_BROWSER_VALIDATION_ff838474ce6b_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed product source
        uses: actions/checkout@v4
        with:
          ref: ff838474ce6bb542915f059d35a80e2229cf4dda
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows mature launcher smoke
        shell: pwsh
        run: |
          python tools/step1b_qsv1_launcher_smoke.py --platform windows --port 18080

  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed product source
        uses: actions/checkout@v4
        with:
          ref: ff838474ce6bb542915f059d35a80e2229cf4dda
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: macOS mature launcher smoke
        shell: bash
        run: |
          python tools/step1b_qsv1_launcher_smoke.py --platform macos --port 18081
