name: Storage Review UX #353

on:
  push:
    branches:
      - feature/storage-parameter-review-ux-353
    paths:
      - "products/storage_rc1/**"
      - ".github/workflows/storage-review-ux-353.yml"
  pull_request:
    branches:
      - integration/storage
    paths:
      - "products/storage_rc1/**"
      - ".github/workflows/storage-review-ux-353.yml"

jobs:
  review-ux-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/products/storage_rc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r products/storage_rc1/requirements.txt
          python -m pip install pytest
      - name: #353 focused review UX gate
        run: |
          cd products/storage_rc1
          python -m pytest -q             tests/test_parameter_review_ux_353.py             tests/test_storage_rc1_review_blocker_001.py             tests/test_review_gate_next001.py             tests/test_coverage_ui_next001.py
      - name: Storage product regression
        run: |
          cd products/storage_rc1
          python -m pytest -q             tests/test_storage_product_mvp_rc1.py             tests/test_storage_rc1_r6_complete_assembly.py             tests/test_ui_next_issue132.py
