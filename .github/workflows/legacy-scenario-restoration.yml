name: Legacy Quality Scenario Restore Gate

on:
  push:
    branches:
      - restore/quality-scenario-legacy-rc1-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-scenario-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: Old RC1 scenario and original issue/import/analysis regression
        run: python -m pytest -q tests/test_legacy_scenario_restoration.py tests/test_scenario_assets.py
      - name: Reject empty database on Windows without creating one
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:LEGACY_QUALITY_ISSUE_DB_PATH = "never-exists-rc1-gate.db"
          cmd /c start_quality_capability_p1.bat
          if ($LASTEXITCODE -ne 3) { throw "Windows launcher must reject missing mature DB with exit=3; actual=$LASTEXITCODE" }
          if (Test-Path "never-exists-rc1-gate.db") { throw "Launcher created an unauthorized DB" }
          Write-Host "WINDOWS_MISSING_DB_FAIL_CLOSED=PASS"
          $global:LASTEXITCODE = 0  # expected exit=3 is validated above; do not propagate it
      - name: Compile restored and untouched code
        run: python -m compileall -q quality_knowledge/web/app.py quality_knowledge/web/legacy_scenario_rc1_routes.py quality_knowledge/scenarios.py
      - name: Confirm non-scenario tracked code unchanged from main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main HEAD > changed.txt
          cat changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = Path('changed.txt').read_text().splitlines()
          allowed = ('quality_knowledge/scenario', 'quality_knowledge/reverse_quality_scenario_adapter.py',
                     'quality_knowledge/quality_models.py', 'quality_knowledge/materials.py',
                     'quality_knowledge/web/scenario', 'quality_knowledge/web/legacy_scenario_rc1_routes.py',
                     'quality_knowledge/web/templates/quality_scenario',
                     'quality_knowledge/web/templates/scenario_', 'tests/test_legacy_scenario_restoration.py',
                     'tests/test_scenario_assets.py', 'start_quality_capability_p1.command', 'start_quality_capability_p1.bat',
                     'tools/verify_legacy_quality_db.py',
                     '.github/workflows/legacy-scenario-restoration.yml')
          fixed = {'quality_knowledge/web/app.py', 'quality_knowledge/web/templates/base.html'}
          unexpected = [x for x in changed if x not in fixed and not x.startswith(allowed)]
          if unexpected: raise SystemExit('UNRELATED_FILE_CHANGED: '+repr(unexpected))
          print('OTHER_DOMAINS_SOURCE_UNCHANGED=PASS')
          PY

  restoration-zip:
    needs: old-scenario-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create full source restoration package after matrix Gate
        shell: bash
        run: |
          git archive --format=zip --output=LEGACY_QUALITY_SCENARIO_RESTORE_RC1.zip HEAD
          sha256sum LEGACY_QUALITY_SCENARIO_RESTORE_RC1.zip > RESTORE_PACKAGE_SHA256.txt
          cat RESTORE_PACKAGE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LEGACY_QUALITY_SCENARIO_RESTORE_RC1
          path: |
            LEGACY_QUALITY_SCENARIO_RESTORE_RC1.zip
            RESTORE_PACKAGE_SHA256.txt
          if-no-files-found: error
