name: Hardware Tree Import M3B Frontend

on:
  pull_request:
    paths:
      - "quality_knowledge/web/templates/hardware_tree_import.html"
      - "quality_knowledge/web/static/hardware_tree_import.css"
      - "quality_knowledge/web/static/hardware_tree_import.js"
      - "quality_knowledge/web/templates/p0_base.html"
      - "quality_knowledge/web/p0_pages.py"
      - "quality_knowledge/web/hardware_tree_import_api.py"
      - "services/hardware_tree_excel.py"
      - "tests/test_hardware_tree_import_m3b_frontend.py"
      - "tests/test_hardware_tree_import_m3a_api.py"
      - ".github/workflows/hardware-tree-import-m3b-frontend.yml"
  workflow_dispatch:

jobs:
  p07-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: JavaScript syntax
        run: node --check quality_knowledge/web/static/hardware_tree_import.js
      - name: HC-TREE M1-M3B tests
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_tree_import_m1.py
          tests/test_hardware_tree_import_m2.py
          tests/test_hardware_tree_import_m3a_api.py
          tests/test_hardware_tree_import_m3b_frontend.py
      - name: Hardware Case unified Web/API regression
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_case_contract.py
          tests/test_hardware_case_backend.py
          tests/test_hardware_case_web_api.py
          tests/test_hardware_case_product_api_e2e.py
