name: Hardware Tree Import M3B Frontend

on:
  pull_request:
    paths:
      - "quality_knowledge/web/hardware_tree_import_pages.py"
      - "quality_knowledge/web/templates/hardware_tree_import_p07.html"
      - "quality_knowledge/web/static/hardware_tree_import_p07.css"
      - "quality_knowledge/web/static/hardware_tree_import_p07.js"
      - "quality_knowledge/web/templates/p0_base.html"
      - "quality_knowledge/web/p0_app.py"
      - "tests/test_hardware_tree_import_m3b_frontend.py"
      - ".github/workflows/hardware-tree-import-m3b-frontend.yml"
  workflow_dispatch:

jobs:
  p07-frontend-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt
      - name: P07 M3B frontend contract tests
        run: python -m pytest -q --noconftest tests/test_hardware_tree_import_m3b_frontend.py
      - name: HC-TREE M1 + M2 + M3A regression
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_tree_import_m1.py
          tests/test_hardware_tree_import_m2.py
          tests/test_hardware_tree_import_m3a_api.py
      - name: Hardware Case Web/API regression
        run: >
          python -m pytest -q --noconftest
          tests/test_hardware_case_web_api.py
          tests/test_hardware_case_product_api_e2e.py
          tests/test_hardware_case_backend.py
          tests/test_hardware_case_contract.py
      - name: Install browser capture dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture P07 browser evidence
        run: python scripts/hardware_tree_m3b_visual_capture.py
      - name: Upload P07 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hc-tree-m3b-p07-screenshots
          path: artifacts/hc_tree_m3b/*.png
          if-no-files-found: error
