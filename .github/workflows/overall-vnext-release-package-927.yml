name: Overall VNext Release Package 927EFEF5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/overall-vnext-release-package-927.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact approved release source
        uses: actions/checkout@v4
        with:
          ref: 927efef5b7707d5d2013a34c1f3f40a8ade3d93d
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgName = "OVERALL_VNEXT_RELEASE_V1.0_927EFEF5"
          $dist = Join-Path $env:RUNNER_TEMP $pkgName
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist | Out-Null
          git archive --format=zip --output="$env:RUNNER_TEMP\source.zip" 927efef5b7707d5d2013a34c1f3f40a8ade3d93d
          Expand-Archive -Path "$env:RUNNER_TEMP\source.zip" -DestinationPath $dist

          $install = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'echo [Overall VNext] Installing dependencies...',
            'where python >nul 2>nul',
            'if %errorlevel%==0 (',
            '  python -m pip install --upgrade pip',
            '  if errorlevel 1 exit /b 1',
            '  python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt',
            ') else (',
            '  py -3.11 -m pip install --upgrade pip',
            '  if errorlevel 1 exit /b 1',
            '  py -3.11 -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt',
            ')',
            'exit /b %errorlevel%'
          )
          $install | Set-Content -Encoding ascii (Join-Path $dist "INSTALL_WINDOWS.bat")

          $start = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'set "REPEAT_CASE_NO_PAUSE=1"',
            'echo Starting Overall VNext approved release...',
            'echo Source: 927efef5b7707d5d2013a34c1f3f40a8ade3d93d',
            'echo URL: http://127.0.0.1:8080/p0/issues',
            'where python >nul 2>nul',
            'if %errorlevel%==0 (',
            '  python main.py knowledge-p1-start --db "knowledge\quality_capability_p1.db" --host 127.0.0.1 --port 8080',
            ') else (',
            '  py -3.11 main.py knowledge-p1-start --db "knowledge\quality_capability_p1.db" --host 127.0.0.1 --port 8080',
            ')',
            'endlocal'
          )
          $start | Set-Content -Encoding ascii (Join-Path $dist "START_OVERALL_VNEXT.bat")

          $manifest = @(
            'OVERALL VNext Release Package V1.0',
            '=================================',
            'PACKAGE_ID=OVERALL-VNEXT-RELEASE-V1.0-927EFEF5-20260928',
            'RELEASE_SOURCE=927efef5b7707d5d2013a34c1f3f40a8ade3d93d',
            'PRODUCT_TEST_GATE=PASS',
            'OVERALL_TEST_CLOSURE=PASS',
            'RELEASE_REVIEW=PASS',
            'EXECUTABLE_SCENARIOS=19',
            'PASS=19',
            'FAIL=0',
            'BLOCKED=0',
            'DEFAULT_ENTRY=http://127.0.0.1:8080/p0/issues',
            'INSTALL=INSTALL_WINDOWS.bat',
            'STARTUP=START_OVERALL_VNEXT.bat',
            '',
            'Built from exact approved Git source plus release-only wrapper/docs.',
            'No product business logic change. No second Web host or port.'
          )
          $manifest | Set-Content -Encoding utf8 (Join-Path $dist "RELEASE_MANIFEST.txt")

          $installDoc = @(
            'Windows Installation / Startup',
            '==============================',
            '1. Install Python 3.11 x64 and make python or py available.',
            '2. Extract to a clean local directory.',
            '3. Run INSTALL_WINDOWS.bat once.',
            '4. Run START_OVERALL_VNEXT.bat.',
            '5. Open http://127.0.0.1:8080/p0/issues',
            '',
            'Runtime chain:',
            'START_OVERALL_VNEXT.bat',
            ' -> main.py knowledge-p1-start',
            ' -> create_p0_app',
            ' -> same FastAPI host / same 8080.',
            '',
            'Real-provider secrets and internal data are not included.',
            'Use existing config/runtime templates and keep secrets only on target machine.'
          )
          $installDoc | Set-Content -Encoding utf8 (Join-Path $dist "INSTALL_AND_START_WINDOWS.txt")

          $rollback = @(
            'Rollback Baseline',
            '=================',
            'No earlier Overall VNext release has the same 19/19 Product Test approval.',
            '',
            'Primary rollback:',
            '1. Before deploying, back up the existing target installation directory,',
            '   local SQLite/data files, and local-only config/secrets.',
            '2. Stop the new process and restore that pre-install backup.',
            '',
            'TECHNICAL_PARENT=7aa56ced3f79fdcfe70cb862107e2ba30d2d668e',
            'NOTE=Technical predecessor only; NOT a formal 19/19 approved release.',
            'APPROVED_RELEASE_PIN=927efef5b7707d5d2013a34c1f3f40a8ade3d93d'
          )
          $rollback | Set-Content -Encoding utf8 (Join-Path $dist "ROLLBACK_BASELINE.txt")

          "OVERALL-VNEXT-RELEASE-V1.0-927EFEF5-20260928" | Set-Content -Encoding ascii (Join-Path $dist "PACKAGE_ID")
          "927efef5b7707d5d2013a34c1f3f40a8ade3d93d" | Set-Content -Encoding ascii (Join-Path $dist "RELEASE_SOURCE")
          "PACKAGE_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Windows runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:PACKAGE_DIR
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt

      - name: Clean-directory startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "overall-smoke-clean"
          if (Test-Path $smokeRoot) { Remove-Item -Recurse -Force $smokeRoot }
          Copy-Item -Recurse -Force $env:PACKAGE_DIR $smokeRoot
          $env:REPEAT_CASE_NO_PAUSE = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "overall-start.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "overall-start.stderr.log"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","START_OVERALL_VNEXT.bat" -WorkingDirectory $smokeRoot -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $routes = @(
            "http://127.0.0.1:8080/p0/issues",
            "http://127.0.0.1:8080/p0/cases",
            "http://127.0.0.1:8080/p0/hardware-cases",
            "http://127.0.0.1:8080/p0/quality-scenario-insights"
          )
          $ready = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $routes[0] -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            throw "Overall VNext did not become ready on /p0/issues"
          }

          $results = @()
          foreach ($route in $routes) {
            $resp = Invoke-WebRequest -Uri $route -UseBasicParsing -TimeoutSec 10
            if ($resp.StatusCode -ne 200) { throw "Route failed: $route => $($resp.StatusCode)" }
            $results += "$route=PASS"
          }
          $db = Join-Path $smokeRoot "knowledge\quality_capability_p1.db"
          if (!(Test-Path $db)) { throw "P1 database was not initialized" }
          $results += "P1_DB_INITIALIZED=PASS"
          $results += "WINDOWS_CLEAN_DIR_STARTUP=PASS"
          $results += "MANUAL_RESTART_REQUIRED=NO"
          $results += "SOURCE=927efef5b7707d5d2013a34c1f3f40a8ade3d93d"
          $results | Set-Content -Encoding utf8 (Join-Path $env:PACKAGE_DIR "WINDOWS_SMOKE_RESULT.txt")
          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }

      - name: Package integrity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:PACKAGE_DIR
          $files = Get-ChildItem -File -Recurse | Where-Object { $_.Name -ne "FILE_SHA256SUMS.txt" } | Sort-Object FullName
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            $rel = $f.FullName.Substring($env:PACKAGE_DIR.Length + 1).Replace([char]92,[char]47)
            "$h  $rel"
          }
          $lines | Set-Content -Encoding ascii "FILE_SHA256SUMS.txt"

      - name: Upload formal release package
        uses: actions/upload-artifact@v4
        with:
          name: OVERALL_VNEXT_RELEASE_V1.0_927EFEF5
          path: ${{ env.PACKAGE_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
