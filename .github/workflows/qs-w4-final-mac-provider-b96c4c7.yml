{
  "name": "QS W4 Final Mac Functional Provider Golden b96c4c7",
  "on": {
    "push": {
      "branches": [
        "ci/qs-w4-final-mac-provider-b96c4c7"
      ],
      "paths": [
        ".github/workflows/qs-w4-final-mac-provider-b96c4c7.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PRODUCT_SOURCE_SHA": "b96c4c74a524464dbaccaf9a724ae30181ed8a7d",
    "PACKAGE_BASENAME": "QUALITY_PLATFORM_W4_MAC_PROVIDER_GOLDEN_b96c4c74a524"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "b96c4c74a524464dbaccaf9a724ae30181ed8a7d",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt"
        },
        {
          "name": "Verify exact source",
          "shell": "bash",
          "run": "set -euo pipefail\n[ \"$(git rev-parse HEAD)\" = \"$PRODUCT_SOURCE_SHA\" ]\ngit diff --check \"$PRODUCT_SOURCE_SHA^..$PRODUCT_SOURCE_SHA\""
        },
        {
          "name": "Focused regression",
          "shell": "bash",
          "run": "set -euo pipefail\npython -m pytest -q tests/test_quality_scenario_w4_functional_provider_e2e.py tests/test_quality_scenario_w4_functional_fixture.py tests/test_qsv1_portrait_consumption.py tests/test_software_assessment_qsv1_browser_flow.py tests/test_r2_w2_qsv1_production_chain.py tests/test_step1b_qsv1_mature_preview.py tests/test_openai_mock_runtime_integration.py::test_openai_mock_bind_does_not_require_reverse_dns"
        }
      ]
    },
    "mac-full-chain": {
      "runs-on": "macos-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "b96c4c74a524464dbaccaf9a724ae30181ed8a7d"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install -r requirements.txt -r requirements-runtime-p0-test.txt"
        },
        {
          "name": "Prepare package-like venv and fixture",
          "shell": "bash",
          "run": "set -euo pipefail\npython -m venv --system-site-packages .venv\nmkdir -p validation\npython tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db"
        },
        {
          "name": "Run Mac controlled-provider full chain",
          "shell": "bash",
          "run": "python - <<'PY'\nimport json,os,signal,subprocess,time,urllib.request\nfrom pathlib import Path\nroot=Path.cwd()\nlog_path=root/'validation'/'mac_provider_full_chain.log'\nlog=log_path.open('w+',encoding='utf-8',errors='replace')\nproc=subprocess.Popen(\n    ['./start_w4_mac_functional_provider_golden.command','--host','127.0.0.1','--port','18083'],\n    cwd=root,stdout=log,stderr=subprocess.STDOUT,text=True,start_new_session=True,\n)\nbase='http://127.0.0.1:18083'\ntry:\n    ok=False\n    for _ in range(720):\n        try:\n            urllib.request.urlopen(base+'/software-assessment',timeout=1)\n            ok=True\n            break\n        except Exception:\n            if proc.poll() is not None:\n                break\n            time.sleep(.25)\n    if not ok:\n        log.flush(); log.seek(0)\n        raise AssertionError('MAC_PROVIDER_HOST_NOT_READY\\n'+log.read()[-12000:])\n    manifest=json.load(open(root/'validation'/'quality_scenario_w4_fixture.db.fixture.json',encoding='utf-8'))\n    g1=next(x for x in manifest['cases'] if x['case_id']=='G1_COMPLETE')\n    def req(method,path,payload=None):\n        data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')\n        r=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json'})\n        with urllib.request.urlopen(r,timeout=30) as resp:\n            raw=resp.read()\n            return resp.status,(json.loads(raw.decode('utf-8')) if resp.headers.get_content_type()=='application/json' else raw.decode('utf-8'))\n    payload={'material_ids':[g1['software_assessment_material_id']],'trigger_source':'HIGH_PERCEPTION','trigger_reason':'W4_MAC_FUNCTIONAL_GOLDEN'}\n    s,p=req('POST','/api/v2/software-assessment/quality-scenario/preview',payload)\n    assert s==200 and p['items'][0]['state']=='READY',p\n    print('MAC_G1_SOURCE_BUNDLE_PREVIEW=PASS',flush=True)\n    s,start=req('POST','/api/v2/software-assessment/quality-scenario/generations',payload)\n    assert s==200,start\n    task_id=start['task_id']\n    task=None\n    for _ in range(300):\n        s,task=req('GET',f'/api/v2/software-assessment/quality-scenario/generations/{task_id}')\n        states={x.get('state') for x in task.get('items',[])}\n        if 'ANALYZING' not in states:\n            break\n        time.sleep(.1)\n    assert task['items'][0]['state']=='CANDIDATE_CREATED',task\n    print('MAC_G1_CANDIDATE_CREATED=PASS',flush=True)\n    scenario=task['items'][0]['scenario']; sid=scenario['scenario_id']\n    s,r=req('POST',f'/api/v2/quality-scenario-workflow/v1/quality-scenarios/{sid}/review',{'expected_scenario_version':scenario['scenario_version'],'review_status':'CONFIRMED','reviewer':'W4 Mac CI','comment':'controlled provider mac functional golden'})\n    assert s==200,r\n    scenario=r['scenario']\n    print('MAC_G1_REVIEW=PASS',flush=True)\n    s,r=req('POST',f'/api/v2/quality-scenario-workflow/v1/quality-scenarios/{sid}/confirm',{'expected_scenario_version':scenario['scenario_version'],'quality_confirmed_by':'W4 Quality','technical_confirmed_by':'W4 Technical','confirmation_note':'Mac controlled-provider CI'})\n    assert s==200,r\n    scenario=r['scenario']\n    assert scenario['status']=='CONFIRMED',scenario\n    print('MAC_G1_CONFIRM=PASS',flush=True)\n    s,r=req('POST',f'/api/v2/quality-scenario-workflow/v1/quality-scenarios/{sid}/publish',{'expected_scenario_version':scenario['scenario_version'],'published_by':'W4 Mac CI'})\n    assert s==200 and r['scenario']['status']=='PUBLISHED',r\n    print('MAC_G1_PUBLISH=PASS',flush=True)\n    s,trace=req('GET',f'/api/v2/quality-scenario-workflow/v1/quality-scenarios/{sid}/traceability')\n    assert s==200,trace\n    s,history=req('GET',f'/api/v2/quality-scenario-workflow/v1/quality-scenarios/{sid}/history')\n    assert s==200 and history,history\n    print('MAC_G1_TRACEABILITY_HISTORY=PASS',flush=True)\n    for axis,marker,label in [('product','PLC-X200','PRODUCT'),('industry','新能源','INDUSTRY'),('customer','客户A','CUSTOMER')]:\n        with urllib.request.urlopen(base+f'/quality-scenario-assets/portrait?portrait_axis={axis}',timeout=10) as resp:\n            text=resp.read().decode('utf-8')\n        assert marker in text,(axis,marker)\n        print(f'MAC_G1_{label}_PORTRAIT=PASS',flush=True)\n    print('MAC_FUNCTIONAL_PROVIDER_GOLDEN=PASS',flush=True)\n    print('FUNCTIONAL_PROVIDER=CONTROLLED_OPENAI_MOCK',flush=True)\n    print('UNIFIED_RUNTIME_REUSED=YES',flush=True)\n    print('REAL_PROVIDER_GOLDEN=NO',flush=True)\nfinally:\n    try: os.killpg(proc.pid,signal.SIGTERM)\n    except ProcessLookupError: pass\n    try: proc.wait(timeout=8)\n    except subprocess.TimeoutExpired:\n        try: os.killpg(proc.pid,signal.SIGKILL)\n        except ProcessLookupError: pass\n        proc.wait(timeout=5)\n    log.close()\n\nPY"
        }
      ]
    },
    "package": {
      "needs": [
        "validate",
        "mac-full-chain"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "b96c4c74a524464dbaccaf9a724ae30181ed8a7d",
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install product dependencies",
          "run": "python -m pip install -r requirements.txt"
        },
        {
          "name": "Build controlled fixture",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p validation\npython tools/build_quality_scenario_test_fixture.py --db validation/quality_scenario_w4_fixture.db | tee validation/fixture_build.txt\ngrep -q 'W4_FUNCTIONAL_FIXTURE=READY' validation/fixture_build.txt\ngrep -q 'DIRECT_QSV1_CANDIDATE_WRITE=NO' validation/fixture_build.txt\ngrep -q 'DIRECT_QSV1_PUBLISH_WRITE=NO' validation/fixture_build.txt"
        },
        {
          "name": "Build exact full-platform package",
          "shell": "bash",
          "run": "set -euo pipefail\nSTAGE=\"$RUNNER_TEMP/w4-final\"\nrm -rf \"$STAGE\"\nmkdir -p \"$STAGE\" dist\ngit archive \"$PRODUCT_SOURCE_SHA\" | tar -x -C \"$STAGE\"\nmkdir -p \"$STAGE/validation\"\ncp validation/quality_scenario_w4_fixture.db \"$STAGE/validation/\"\ncp validation/quality_scenario_w4_fixture.db.fixture.json \"$STAGE/validation/\"\ncp validation/fixture_build.txt \"$STAGE/validation/\"\npython -c \"from pathlib import Path; import os; Path('$STAGE/PRODUCT_SOURCE_SHA').write_text(os.environ['PRODUCT_SOURCE_SHA']+'\\\\n',encoding='utf-8')\"\npython -c \"from pathlib import Path; import os,json; m={'package_type':'W4_MAC_FUNCTIONAL_PROVIDER_GOLDEN_CANDIDATE','package_scope':'FULL_CURRENT_QUALITY_PLATFORM','source_sha':os.environ['PRODUCT_SOURCE_SHA'],'test_fixture_included':True,'synthetic_business_data':True,'functional_provider':'CONTROLLED_OPENAI_MOCK','unified_runtime_reused':True,'direct_qsv1_candidate_write':False,'direct_qsv1_publish_write':False,'real_provider_golden':False,'real_mature_data_compatibility':'DEFERRED','macos_entry':'start_w4_mac_functional_provider_golden.command'}; Path('$STAGE/FULL_PLATFORM_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')\"\npython -c \"from pathlib import Path; import os; t='QUALITY PLATFORM W4 MAC FUNCTIONAL PROVIDER GOLDEN CANDIDATE\\\\n\\\\nSOURCE_SHA='+os.environ['PRODUCT_SOURCE_SHA']+'\\\\nFUNCTIONAL_PROVIDER=CONTROLLED_OPENAI_MOCK\\\\nUNIFIED_RUNTIME_REUSED=YES\\\\nDIRECT_QSV1_CANDIDATE_WRITE=NO\\\\nDIRECT_QSV1_PUBLISH_WRITE=NO\\\\nREAL_PROVIDER_GOLDEN=NO\\\\nREAL_MATURE_DATA_COMPATIBILITY=DEFERRED\\\\n\\\\nmacOS: ./start_w4_mac_functional_provider_golden.command --port 18080\\\\n'; Path('$STAGE/00_W4_MAC_PROVIDER_README_FIRST.txt').write_text(t,encoding='utf-8')\"\ntest -x \"$STAGE/start_quality_capability_p1.command\"\ntest -x \"$STAGE/start_w4_mac_functional_provider_golden.command\"\ntest -f \"$STAGE/validation/quality_scenario_w4_fixture.db\"\n(cd \"$STAGE\" && zip -q -r \"$GITHUB_WORKSPACE/dist/${PACKAGE_BASENAME}.zip\" .)\nsha256sum \"dist/${PACKAGE_BASENAME}.zip\" | tee \"dist/${PACKAGE_BASENAME}.zip.sha256\""
        },
        {
          "name": "Verify package identity",
          "shell": "bash",
          "run": "set -euo pipefail\npython -c \"import json,os,pathlib,zipfile; p=pathlib.Path('dist')/(os.environ['PACKAGE_BASENAME']+'.zip'); z=zipfile.ZipFile(p); m=json.loads(z.read('FULL_PLATFORM_MANIFEST.json')); assert z.read('PRODUCT_SOURCE_SHA').decode().strip()==os.environ['PRODUCT_SOURCE_SHA']; assert m['functional_provider']=='CONTROLLED_OPENAI_MOCK'; assert m['unified_runtime_reused'] is True; assert not m['direct_qsv1_candidate_write']; assert not m['direct_qsv1_publish_write']; assert not m['real_provider_golden']; assert 'validation/quality_scenario_w4_fixture.db' in z.namelist(); print('FINAL_MAC_PROVIDER_PACKAGE_IDENTITY=PASS')\""
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "QUALITY_PLATFORM_W4_MAC_PROVIDER_GOLDEN_b96c4c74a524",
            "path": "dist/QUALITY_PLATFORM_W4_MAC_PROVIDER_GOLDEN_b96c4c74a524.zip\ndist/QUALITY_PLATFORM_W4_MAC_PROVIDER_GOLDEN_b96c4c74a524.zip.sha256",
            "if-no-files-found": "error",
            "retention-days": 30,
            "compression-level": 0
          }
        }
      ]
    }
  }
}