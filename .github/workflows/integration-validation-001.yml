name: INTEGRATION-VALIDATION-001

on:
  push:
    branches:
      - integration-validation-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: c7aa3017e07f46d1b010c90300becdae9ccd7005
      FINAL_SHA: f970dbabdf111e816e6361cd97a85e32a7385f2f
      RUNTIME_SHA: 0959da43008307398a9cac0f9abfc7fec26dcb8a
      PATCH_SHA256: 5ee8fd181891a830c6fb530f213bcd50ebc80ce1e00d7a412f198216e9951919
      ZIP_SHA256: ec3616b6e7a097681db05343221fa783b680312c32e21e9991a8afb173d570f6
    steps:
      - name: Checkout declared BASE
        uses: actions/checkout@v4
        with:
          ref: c7aa3017e07f46d1b010c90300becdae9ccd7005
          fetch-depth: 1

      - name: Verify target baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          echo "BASE verified: $BASE_SHA"

      - name: Download Final Integrated Patch artifact
        uses: actions/download-artifact@v4
        with:
          name: reverse-quality-v01-final-integrated-patch
          path: .validation-input
          repository: xm286947-cell/ploblem_ai
          run-id: 35706343551
          github-token: ${{ github.token }}

      - name: Verify Final Integrated Patch SHA-256
        run: |
          set -euo pipefail
          echo "$ZIP_SHA256  .validation-input/reverse-quality-v01-final-integrated-patch.zip" | sha256sum -c -
          echo "$PATCH_SHA256  .validation-input/reverse-quality-v01-final-integrated-patch/reverse-quality-v0.1-final-integrated.patch" | sha256sum -c -
          diff -u             <(printf '%s  reverse-quality-v0.1-final-integrated.patch\n' "$PATCH_SHA256")             .validation-input/reverse-quality-v01-final-integrated-patch/SHA256SUMS.txt
          echo "Final Integrated Patch hashes verified"

      - name: Apply Final Integrated Patch
        run: |
          set -euo pipefail
          PATCH=.validation-input/reverse-quality-v01-final-integrated-patch/reverse-quality-v0.1-final-integrated.patch
          git apply --check "$PATCH"
          git apply "$PATCH"
          git apply -R --check "$PATCH"
          echo "Patch apply and reverse-check verified"

      - name: Verify exact 14-file scope and FINAL content
        run: |
          set -euo pipefail
          EXPECTED=.validation-input/reverse-quality-v01-final-integrated-patch/CHANGED_FILES.txt

          awk '$1 == "A" {print $2}' "$EXPECTED" | while read -r path; do
            [ -n "$path" ] || continue
            git add -N -- "$path"
          done

          git diff --name-status HEAD | sort > /tmp/changed.actual
          sort "$EXPECTED" > /tmp/changed.expected
          diff -u /tmp/changed.expected /tmp/changed.actual
          test "$(git diff --name-only HEAD | wc -l | tr -d ' ')" = "14"

          git fetch --no-tags --depth=1 origin "$FINAL_SHA"
          git cat-file -e "$FINAL_SHA^{commit}"
          cut -f2- "$EXPECTED" | while read -r path; do
            [ -n "$path" ] || continue
            actual="$(git hash-object "$path")"
            expected="$(git rev-parse "$FINAL_SHA:$path")"
            test "$actual" = "$expected"
          done

          cp /tmp/changed.actual CHANGED_FILES_ACTUAL.txt
          echo "14-file scope and FINAL file content verified"

      - name: Checkout validated Runtime dependency
        uses: actions/checkout@v4
        with:
          repository: xm286947-cell/ploblem_ai
          ref: 0959da43008307398a9cac0f9abfc7fec26dcb8a
          path: .deps/unified-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Reverse Quality dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Runtime dependencies
        run: python -m pip install -r .deps/unified-agent-runtime/requirements-runtime-p0-test.txt

      - name: Isolate Runtime package only
        run: |
          mkdir -p .runtime-dep
          cp -R .deps/unified-agent-runtime/runtime .runtime-dep/runtime

      - name: Verify Runtime dependency boundary
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: |
          python - <<'PY'
          import quality_knowledge
          import runtime
          from pathlib import Path

          root = Path.cwd().resolve()
          q = Path(quality_knowledge.__file__).resolve()
          r = Path(runtime.__file__).resolve()
          assert str(q).startswith(str(root)), q
          assert ".runtime-dep" in str(r), r
          print("quality_knowledge:", q)
          print("runtime:", r)
          PY

      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: python -m compileall -q quality_knowledge builder

      - name: Full 81 Case Gate
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime-dep
        run: |
          set -euo pipefail
          total=0
          run_suite() {
            local test_file="$1"
            local out
            out="$(python -m pytest "$test_file" -q 2>&1)"
            printf '%s\n' "$out"
            local count
            count="$(printf '%s\n' "$out" | sed -nE 's/^([0-9]+) passed.*$/\1/p' | tail -1)"
            test -n "$count"
            total=$((total + count))
          }

          run_suite tests/test_reverse_quality_runtime_integration.py
          run_suite tests/test_reverse_quality_store.py
          run_suite tests/test_reverse_quality.py
          run_suite tests/test_quality_scenario_generation.py
          run_suite tests/test_quality_scenario_library.py
          run_suite tests/test_scenario_multisource_dedup.py
          run_suite tests/test_scenario_operation_sources.py

          test "$total" -eq 81
          printf 'TOTAL: %s passed / 0 failed\n' "$total"
          printf '%s\n' "$total" > TEST_TOTAL.txt

      - name: Build validation evidence
        if: always()
        run: |
          mkdir -p integration-validation-001-evidence
          cp CHANGED_FILES_ACTUAL.txt integration-validation-001-evidence/ 2>/dev/null || true
          cp TEST_TOTAL.txt integration-validation-001-evidence/ 2>/dev/null || true
          cat > integration-validation-001-evidence/VALIDATION_RESULT.md <<EOF
          # INTEGRATION-VALIDATION-001

          - BASE: $BASE_SHA
          - FINAL: $FINAL_SHA
          - Runtime: $RUNTIME_SHA
          - Patch SHA-256: $PATCH_SHA256
          - ZIP SHA-256: $ZIP_SHA256
          - Scope: 14 files
          - Patch apply check: PASS if job succeeded
          - Applied content == FINAL: PASS if job succeeded
          - Compile: PASS if job succeeded
          - Target Gate: 81 passed / 0 failed
          EOF

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-validation-001-evidence
          path: integration-validation-001-evidence
          retention-days: 30
