<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Knowledge Processing{% endblock %}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
    header{background:#0f4c81;color:#fff;padding:18px 28px}
    nav{background:#fff;border-bottom:1px solid #dbe3ea;padding:10px 28px}
    nav a{margin-right:22px;color:#0f4c81;text-decoration:none;font-weight:600}
    main{max-width:1180px;margin:24px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #dfe6ec;border-radius:10px;padding:18px;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .muted{color:#6b7280}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf3f8;margin-right:6px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
    th{background:#f8fafc}
    form{margin:8px 0}.error{background:#fff1f2;color:#991b1b;padding:10px;border-radius:8px}
    .ok{background:#ecfdf5;color:#065f46;padding:10px;border-radius:8px}
    input,textarea,select{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 10px;border:1px solid #cbd5e1;border-radius:6px}
    button{background:#0f4c81;color:white;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
    button.secondary{background:#475569} button.danger{background:#b91c1c}
    code,pre{white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
<header><h1>Knowledge Production 工作台</h1><div>Source Document ≠ Knowledge Candidate ≠ Human Review ≠ Published Knowledge</div></header>
<nav>
  <a href="/knowledge-production/sources">资料</a>
  <a href="/knowledge-production/candidates">Candidate</a>
  <a href="/knowledge-production/reviews">Review</a>
  <a href="/knowledge-production/published">Published Knowledge</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
