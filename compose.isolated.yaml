services:
  public-knowledge:
    build:
      context: .
    image: storage-public-knowledge:w4-isolated
    container_name: storage-public-knowledge-w4-isolated
    restart: unless-stopped
    env_file:
      - path: public_knowledge_rag/.env
        required: false
    environment:
      PKR_DATA_DIR: /var/lib/public-knowledge
      PKR_RESTART_STRATEGY: supervised_process_exit
    ports:
      - "127.0.0.1:19000:8080"
    volumes:
      - public_knowledge_w4_isolated_data:/var/lib/public-knowledge
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  public_knowledge_w4_isolated_data:
    name: storage_public_knowledge_w4_isolated_data
